es válidas aquellas que, sin afectar la salud o la unidad familiar directa, demuestren una mejora sustancial en las condiciones de vida del agente o el inicio de estudios de grado/posgrado vinculados a la actividad del Instituto.\n\n- La concesión de este traslado estará estrictamente supeditada a la existencia de vacante y a que no se afecte la normal prestación del servicio en la sede de origen."}, {"id": "a61", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN TRASLADOS", "nombre": "Artículo 4º: Traslado por Perspectiva de Género y Violencia. En cumplimiento de la Ley I Nº 635, la Ley XV Nº 26 y convenciones internacionales (Belém do Pará), el Instituto garantizará el traslado in", "texto": "- Procedimiento: La solicitud tendrá carácter de \"Urgente\" y será de trámite reservado.\n\n- Acreditación: Bastará con la presentación de la denuncia judicial, informe de organismos oficiales de género o medida cautelar de restricción.\n\n- Excepción: En estos casos, no se exigirá el cumplimiento del plazo de permanencia de cinco (5) años ni la existencia previa de vacante presupuestaria en el momento exacto, debiendo el Instituto arbitrar los medios para la reubicación inmediata."}, {"id": "a62", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN TRASLADOS", "nombre": "Artículo 6º: Traslados por Razones de Servicio. Cuando el traslado sea por iniciativa del Instituto y hacia una localidad diferente, la Gerencia General deberá:", "texto": "- Notificar fehacientemente con treinta (30) días de anticipación.\n\n- Fundamentar la necesidad del servicio que justifica el movimiento.\n\n- El agente podrá oponerse dentro de los cinco (5) días de notificado si acredita fehacientemente que la medida vulnera su salud o la unidad familiar (conforme Art. 3 y 5 de este reglamento)."}, {"id": "a63", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN PROMOCIÓN", "nombre": "Artículo 2º: ANTIGÜEDAD Y REQUISITOS FORMALES. Para postularse, el agente deberá:", "texto": "- Acreditar tres (3) años de permanencia en el rango actual. Excepción: Para el primer llamado tras la aprobación del Estatuto, se aplicará el reconocimiento de antigüedad previsto en el Artículo 4º de las Disposiciones Transitorias.\n\n- Poseer un legajo libre de sanciones graves. Se entenderá por tal no haber superado un máximo de tres (3) suspensiones o cinco (5) apercibimientos en los últimos veinticuatro (24) meses."}, {"id": "a64", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN PROMOCIÓN", "nombre": "Artículo 3º: MATRIZ DE EVALUACIÓN (EL 70%). La aprobación se obtendrá al alcanzar el setenta por ciento (70%) del puntaje total, compuesto de la siguiente manera:", "texto": "Factor de EvaluaciónPonderaciónDescripciónDesempeño Institucional40%Calificación anual del superior inmediato sobre cumplimiento de objetivos.Capacitación Específica30%Cursos validados por el Instituto o títulos de mayor jerarquía obtenidos.Evaluación de Aptitud30%Examen técnico o Proyecto de Mejora según el agrupamiento.Artículo 4º: EVALUACIÓN POR AGRUPAMIENTO.\n\n- Agrupamientos Administrativo, Servicios y Maestranza: Deberán rendir un examen de oposición teórico-práctico sobre procedimientos internos, normativa del Instituto y herramientas de gestión del área.\n\n- Agrupamientos Técnico, Profesional y Médico/Legal: Deberán presentar un Proyecto de Mejora Operativa o Prestacional. El proyecto deberá ser original, factible económicamente y orientado a optimizar los servicios del ISSyS. Será defendido ante la Comisión Evaluadora."}, {"id": "a65", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN PROMOCIÓN", "nombre": "Artículo 6º: ORDEN DE PRELACIÓN Y LISTA DE ESPERA. Si el número de aprobados superase la disponibilidad financiera, se confeccionará un orden de mérito priorizando:", "texto": "- Mayor antigüedad en la Institución.\n\n- Mayor puntaje obtenido en la evaluación de aptitud. Aquellos agentes aprobados que no accedan al beneficio por cupo, ingresarán en la Lista de Espera Prioritaria, conservando su aprobación para el siguiente llamado sin necesidad de reevaluación."}, {"id": "a66", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ASCENSO", "nombre": "Artículo 2º: REQUISITOS DE INSCRIPCIÓN.", "texto": "- Planta: Pertenecer a la Planta Permanente o Planta Hotelera Permanente.\n\n- Antigüedad: Se fija una antigüedad mínima de cinco (5) años para cargos jerárquicos y de dos (2) años para cargos no jerárquicos, computando tiempo en diversas condiciones de contratación.\n\n- Perspectiva de Género: Es requisito excluyente haber finalizado o acreditar el cursado activo de la capacitación en género (Ley Provincial VIII Nº 129 - Ley Micaela).\n\n- Educación: Poseer título secundario. En casos excepcionales de cargos no jerárquicos, si el ganador no posee título, tendrá un plazo de 3 años para finalizarlo, manteniendo una designación transitoria."}, {"id": "a67", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ASCENSO", "nombre": "Artículo 4º: EVALUACIÓN TÉCNICA EXTERNA. A fin de asegurar imparcialidad, los exámenes de conocimiento técnico serán confeccionados, administrados y corregidos por la Universidad Nacional de la Patago", "texto": "- Aprobación: Para continuar en el proceso, el postulante deberá alcanzar un puntaje mínimo del setenta por ciento (70%) en la evaluación de conocimientos técnicos.\n\n- Contenido: El examen versará sobre procedimientos, políticas y regulaciones específicas del cargo."}, {"id": "a68", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ASCENSO", "nombre": "Artículo 5º: PUNTUACIÓN DE ANTECEDENTES.", "texto": "- Antigüedad: 0,50 puntos por cada mes de servicio efectivo en el Instituto.\n\n- Asistencia: Se premia la asistencia de los últimos 2 años: >90% otorga 20 puntos.\n\n- Desempeño: Se valora la última calificación registrada (Sobresaliente: 20 pts).\n\n- Sanciones (Puntaje Negativo): Los apercibimientos descuentan 4 puntos y las suspensiones 6 puntos por cada día. Se exceptúa de estas deducciones a agentes con tutela sindical."}, {"id": "a69", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN REAGRUPAMIENTO", "nombre": "Artículo 3º: Evaluación Técnica (Coherencia con Resolución 2025). Siguiendo los estándares de transparencia del Instituto, el reagrupamiento requerirá superar las siguientes etapas:", "texto": "- Conocimiento Técnico (31%): Examen administrado según los temarios de la UNPSJB para el nuevo perfil.\n\n- Aptitudes y Actitudes (35%): Evaluación de competencias para las nuevas funciones.\n\n- Antecedentes (34%): Valoración de la trayectoria en el Instituto.\n\n- Puntaje de aprobación: 70%."}, {"id": "a70", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN CONSERVACIÓN DE DERECHOS Y ASUNCIÓN EFECTIVA", "nombre": "Artículo 3º: OBLIGACIÓN DE ASUNCIÓN. En caso de resultar ganador de un concurso de ascenso o ser beneficiario de una promoción de rango, el agente será notificado de la adjudicación. Para que el benef", "texto": "- Presentar su renuncia al cargo político o solicitar el cese de su licencia por cargo electivo/gremial.\n\n- Hacer toma de posesión efectiva del nuevo cargo o rango dentro de los diez (10) días hábiles posteriores a la notificación."}, {"id": "a71", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN CONSERVACIÓN DE DERECHOS Y ASUNCIÓN EFECTIVA", "nombre": "Artículo 4º: INCUMPLIMIENTO Y CADUCIDAD. Si el agente optara por continuar en el cargo político o gremial y no asumiera efectivamente sus nuevas funciones en el plazo establecido, la adjudicación del ", "texto": "- El cargo vacante será adjudicado al postulante que siga en el orden de mérito.\n\n- El agente mantendrá su retención de cargo original, sin las mejoras que hubiera obtenido en el concurso fallido."}, {"id": "a72", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 1º: REGISTRO DE ASISTENCIA. El personal está obligado a registrar su ingreso y egreso mediante el sistema biométrico o el método que el Instituto determine.", "texto": "El registro deberá efectuarse puntualmente a la hora de inicio y finalización de la jornada.\n\nLa omisión de registro sin causa justificada será considerada inasistencia."}, {"id": "a73", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 2º: TOLERANCIA Y TARDANZAS. Se establece una tolerancia de diez (10) minutos en el ingreso.", "texto": "Superado ese lapso y hasta los treinta (30) minutos, se considerará \"tardanza\".\n\nLa acumulación de cinco (5) tardanzas en un mes calendario dará lugar a una sanción de apercibimiento, salvo justificación aceptada por el superior.\n\nPasados los treinta (30) minutos del horario de ingreso, el agente podrá ser autorizado a prestar servicio, pero se le computará \"media inasistencia\" a efectos reglamentarios."}, {"id": "a74", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 3º: CAMBIO DE TURNO O MODALIDAD. Las solicitudes de cambio de turno (mañana a tarde o viceversa) deberán ser gestionadas ante el Departamento Desarrollo de Recursos Humanos y Personal, contan", "texto": "El cambio podrá ser definitivo o transitorio por razones de estudio o cuidado de familiares, siempre que no se afecte la dotación mínima necesaria del sector.\n\nLa Gerencia General podrá disponer cambios de turno por razones de servicio debidamente fundadas, notificando al agente con 48 horas de antelación."}, {"id": "a75", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 5º: PAUSA DE REFRIGERIO. El descanso de veinte (20) minutos es de carácter obligatorio y no acumulable.", "texto": "No podrá ser utilizado para ingresar más tarde o retirarse antes de la jornada.\n\nNo podrá realizarse durante la primera o la última hora de la jornada laboral.\n\nEl personal de atención al público deberá coordinar el descanso por turnos internos para no interrumpir la atención."}, {"id": "a76", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 8º: SALIDAS PARTICULARES. Se podrán conceder hasta dos (2) permisos mensuales por razones particulares.", "texto": "- Límites: Cada permiso no podrá exceder las dos horas y media (2:30 hs) y el cupo anual máximo será de diez (10) permisos.\n\n- Reposición: El agente deberá reponer la totalidad del tiempo utilizado dentro del mes calendario en que se produjo la salida, coordinando el horario con su superior.\n\n- Excesos Justificados: Si una demora excediera los límites dispuestos y estuviere debidamente justificada, se encuadrará como \"Inasistencia Justificada\" (según el artículo correspondiente a licencias). Si no quedaren cupos de licencias disponibles, se procederá al descuento proporcional de haberes.\n\n- Incumplimiento: La demora no justificada o la falta de reposición horaria dará lugar a las sanciones disciplinarias previstas en el régimen de faltas."}, {"id": "a77", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 9º: SALIDAS OFICIALES. Son aquellas motivadas por el cumplimiento de tareas propias del Instituto fuera de su sede habitual (gestiones bancarias, diligencias judiciales, trámites ante organis", "texto": "- Estas salidas no requieren reposición horaria ni computan para el límite de salidas particulares, pero deben ser autorizadas por escrito o mediante el sistema de gestión por el superior inmediato."}, {"id": "a78", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN JORNADA LABORAL, HORARIOS Y CONTROL DE ASISTENCIA", "nombre": "Artículo 10º: SALIDAS EXCEPCIONALES. Serán aquellas que, por su naturaleza extraordinaria o urgencia manifiesta, superen los límites de los artículos anteriores.", "texto": "- Deberán ser autorizadas exclusivamente por la Gerencia General.\n\n- Cuando la situación sea recurrente o prolongada, deberá formalizarse mediante el acto administrativo correspondiente que justifique la excepción al régimen general."}, {"id": "a79", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA ANUAL REGLAMENTARIA", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y PROYECCIÓN ANUAL. El agente deberá presentar ante su superior inmediato y el Departamento de Recursos Humanos su proyección anual de L.A.R. antes del 1º de di", "texto": "- La solicitud se realizará mediante los formularios u aplicativos digitales que el Instituto disponga.\n\n- La aprobación definitiva quedará sujeta a la autorización del responsable del área, quien deberá garantizar que el usufructo de la licencia no afecte la dotación mínima necesaria para la prestación del servicio.\n\n- El cronograma aprobado podrá ser modificado a solicitud del agente hasta el mes de octubre del año de usufructo."}, {"id": "a80", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA ANUAL REGLAMENTARIA", "nombre": "Artículo 2º: PROCEDIMIENTO DE INTERRUPCIÓN Y SUSPENSIÓN. La licencia podrá ser interrumpida por razones de servicio o suspendida por razones de salud o fuerza mayor.", "texto": "- Interrupción por razones de servicio: Se produce por decisión fundada del Directorio o Gerencia General ante necesidades operativas críticas. El agente tendrá derecho al resarcimiento de gastos de traslado y hospedaje no recuperables, previa presentación de comprobantes.\n\n- Suspensión por causas particulares: El usufructo se suspenderá automáticamente por:\n\n- Enfermedad (propia o de familiar): Se suspende por el plazo que dure la afección, debiendo el agente comunicar la novedad de inmediato para la intervención del Contralor Médico.\n\n- Fallecimiento de familiar: Se suspende por el plazo que establezca el Estatuto según el grado de parentesco.\n\n- Una vez finalizada la causa de suspensión o interrupción, el agente deberá reanudar el saldo de su licencia de forma inmediata, salvo que por razones fundadas el superior autorice un nuevo cronograma."}, {"id": "a81", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA ANUAL REGLAMENTARIA", "nombre": "Artículo 3º: PROCEDIMIENTO PARA EL ADELANTO DE L.A.R. El agente podrá solicitar un adelanto de hasta cinco (5) días hábiles con cargo a la L.A.R. del año en curso.", "texto": "- Este beneficio podrá solicitarse únicamente a partir del 1º de julio de cada año.\n\n- El pedido debe ser excepcional, debidamente fundado y contar con el visto bueno del jefe directo y la autorización de la Gerencia General.\n\n- Los días adelantados serán descontados automáticamente del total de días que correspondan al finalizar el año de devengamiento."}, {"id": "a82", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA ANUAL REGLAMENTARIA", "nombre": "Artículo 4º: PROCEDIMIENTO DE SUSPENSIÓN POR MATERNIDAD/ADOPCIÓN. Cuando el nacimiento o la entrega de la guarda con fines de adopción coincida con el período de vacaciones del agente:", "texto": "- El agente o un tercero deberá dar aviso al Departamento de Recursos Humanos dentro de las 48 horas.\n\n- El sistema de control de asistencia interrumpirá el conteo de la L.A.R. y registrará el inicio de la licencia por maternidad/adopción.\n\n- El saldo de días de L.A.R. no usufructuados no caducará al 30 de diciembre del año siguiente, pudiendo ser utilizado inmediatamente después de finalizada la licencia especial o acumulado para el período siguiente por resolución excepcional de la Gerencia."}, {"id": "a83", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA ANUAL REGLAMENTARIA", "nombre": "Artículo 5º: PROCEDIMIENTO PARA RECONOCIMIENTO DE ANTIGÜEDAD. Para el cómputo de antigüedad en entidades públicas (Nacionales, Provinciales o Municipales) y privadas, el agente deberá seguir el siguie", "texto": "- Presentar ante el Departamento de Recursos Humanos el \"Reconocimiento de Servicios\" oficial emitido por la ANSES, Caja Previsional correspondiente o certificación de servicios legalizada.\n\n- El área técnica verificará la documentación y emitirá el dictamen de actualización de antigüedad.\n\n- El cambio en la escala de días de L.A.R. impactará a partir del período anual inmediato posterior a la fecha de aprobación del reconocimiento."}, {"id": "a84", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ENFERMEDAD", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AVISO. Todo agente que se vea impedido de asistir a sus tareas por razones de salud deberá:", "texto": "- Comunicar la novedad a su superior inmediato y al área de Personal dentro de las primeras dos (2) horas de su jornada habitual.\n\n- Cargar en el sistema dispuesto a tales fines el certificado médico digital dentro en un plazo máximo de cuarenta y ocho (48) horas de producida la afección.\n\n- Presentar el certificado médico original ante el Depto. RRHH al reintegrarse. Para el personal de las delegaciones y bocas de expendio el envio del certificado será realizado a través de la mesa de entrada de cada Delegación.\n\n- El certificado debe contener: diagnóstico (codificado o no, según ley de protección de datos), fecha de inicio, plazo estimado de reposo, datos del agente (Nombre Completo y DNI) y firma/sello del médico tratante."}, {"id": "a85", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ENFERMEDAD", "nombre": "Artículo 2º: PROCEDIMIENTO DE EVALUACIÓN DEL CONTRALOR MÉDICO. El Contralor Médico del Instituto tendrá las siguientes facultades:", "texto": "- Validar el certificado presentado y determinar si la licencia se encuadra como Corta o Larga Evolución.\n\n- Disponer, si lo considera necesario, una visita domiciliaria de control para verificar la permanencia del agente en su domicilio o lugar de recuperación informado.\n\n- Citar al agente a consultorio para evaluación física o requerir estudios complementarios para avalar la licencia."}, {"id": "a86", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ENFERMEDAD", "nombre": "Artículo 3º: PROCEDIMIENTO DE JUNTA MÉDICA. La intervención de la Junta Médica será obligatoria cuando:", "texto": "- El agente haya agotado los 30 días de Corta Evolución y solicite prórroga o pase a Larga Evolución.\n\n- Se trate de enfermedades crónicas, accidentes graves o patologías que requieran la duplicación de plazos prevista en el Estatuto.\n\n- El Contralor Médico disienta con el diagnóstico del médico tratante. El dictamen de la Junta Médica será inapelable en la instancia administrativa y determinará la capacidad laboral del agente, la necesidad de adecuación de tareas o el inicio de trámites jubilatorios por invalidez."}, {"id": "a87", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ENFERMEDAD", "nombre": "Artículo 4º: DETERMINACIÓN DEL ENCUADRE Y EXCLUSIÓN.", "texto": "- El Contralor Médico institucional, al recibir la notificación de una enfermedad de larga duración, deberá determinar en primera instancia si la patología se encuadra como Enfermedad Inculpable (sin relación con el trabajo) o Enfermedad Profesional/Accidente de Trabajo.\n\n- Si el Contralor Médico o la ART determinan que la causa es de origen laboral, se procederá al cierre inmediato del trámite bajo el Inciso b) y se abrirá el expediente bajo el Inciso p) (Accidente de Trabajo o Enfermedad Profesional).\n\n- En ninguna circunstancia un agente podrá usufructuar los 547 días de la licencia por enfermedad de larga evolución y, posteriormente, solicitar los 730 días por accidente de trabajo por la misma patología. El plazo máximo de protección para enfermedades de origen laboral es el establecido en el Inciso p."}, {"id": "a88", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR EXAMEN", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD. El agente que requiera hacer uso de la licencia deberá solicitarla ante su superior inmediato y el Departamento de Recursos Humanos con una antelación mínima d", "texto": "- Constancia de inscripción al examen o cronograma de evaluaciones.\n\n- Certificado de alumno regular del año en curso (presentado una vez por ciclo lectivo)."}, {"id": "a89", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR EXAMEN", "nombre": "Artículo 2º: ACREDITACIÓN Y PLAZOS. Una vez finalizado el examen, el agente dispondrá de un plazo de cinco (5) días hábiles tras su reintegro para presentar la constancia de examen rendido extendida p", "texto": "- Si el examen fuera postergado por la institución educativa, el agente deberá presentar una constancia de dicha postergación para que los días no sean descontados de su cupo anual de forma injustificada.\n\n- En caso de que el agente no se presentara a rendir por razones personales habiendo usufructuado días de preparación, estos serán descontados de sus haberes o, a su pedido, de su saldo de Licencia Anual Reglamentaria."}, {"id": "a90", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ACTIVIDADES CULTURALES", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AUTORIZACIÓN. El agente deberá iniciar la solicitud con una antelación mínima de diez (10) días hábiles a la fecha de inicio de la actividad. El trámite deber", "texto": "- Presentación de la nota de solicitud ante el superior inmediato, adjuntando la invitación, programa o reglamento del evento cultural y la acreditación de la personería de la entidad organizadora.\n\n- El superior jerárquico emitirá un informe sobre la factibilidad operativa de la ausencia.\n\n- La autorización final será dictada por la Gerencia General mediante el acto administrativo o disposición correspondiente."}, {"id": "a91", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ACTIVIDADES CULTURALES", "nombre": "Artículo 2º: ACREDITACIÓN DE PARTICIPACIÓN. Dentro de los cinco (5) días hábiles posteriores al reintegro a sus funciones, el agente deberá presentar ante el Departamento de Recursos Humanos la certif", "texto": "La falta de presentación de dicha constancia transformará los días de ausencia en \"Inasistencias Injustificadas\", con el consecuente descuento de haberes y registro en el legajo personal."}, {"id": "a92", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ACTIVIDADES DEPORTIVAS", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AUTORIZACIÓN. El agente deberá presentar la solicitud con una antelación mínima de diez (10) días hábiles, adjuntando:", "texto": "- Nota de la Federación, Asociación o Entidad Deportiva con personería jurídica, donde conste la designación del agente, el carácter de su participación (deportista, técnico, juez, etc.) y la duración del evento.\n\n- Programa oficial de la competencia o evento.\n\n- Informe de conformidad del superior inmediato respecto a la cobertura del servicio en el área. La autorización final será otorgada por la Gerencia General mediante el acto administrativo pertinente."}, {"id": "a93", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ATENCIÓN DE FAMILIAR ENFERMO", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AVISO. El agente deberá comunicar la necesidad del usufructo de la licencia al superior inmediato y al Departamento de Recursos Humanos dentro de las primeras", "texto": "- La solicitud deberá acompañarse de una Declaración Jurada donde conste que el agente es el único familiar disponible para el cuidado.\n\n- Deberá presentarse el certificado médico del familiar enfermo donde se especifique la necesidad de cuidados por terceros y el tiempo estimado de reposo."}, {"id": "a94", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ATENCIÓN DE FAMILIAR ENFERMO", "nombre": "Artículo 2º: INTERVENCIÓN DEL CONTRALOR MÉDICO. La concesión definitiva de la licencia quedará supeditada a la validación del Contralor Médico institucional, quien podrá:", "texto": "- Auditar la historia clínica o el certificado del familiar.\n\n- Disponer una visita domiciliaria de control para verificar la situación de salud del familiar y la presencia del agente en el domicilio de atención informado."}, {"id": "a95", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ATENCIÓN DE FAMILIAR ENFERMO", "nombre": "Artículo 3º: ACREDITACIÓN DE VÍNCULO Y DOMICILIO. A efectos de verificar la convivencia o proximidad necesaria para el cuidado, el Instituto podrá requerir:", "texto": "- Certificado de convivencia o parentesco (Partidas de nacimiento/matrimonio).\n\n- Constancia de domicilio del familiar enfermo emitida por autoridad policial o Certificado ante el Juzgado de Paz.\n\n- En caso de discapacidad, copia certificada del Certificado Único de Discapacidad (CUD) vigente."}, {"id": "a96", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR FALLECIMIENTO DE FAMILIAR", "nombre": "Artículo 1º: PROCEDIMIENTO DE COMUNICACIÓN. El agente deberá dar aviso del deceso a su superior inmediato y al Departamento de Recursos Humanos a la mayor brevedad posible para registrar el inicio de ", "texto": "- Al reintegrarse, el agente dispondrá de un plazo de cinco (5) días hábiles para presentar el Acta o Certificado de Defunción oficial.\n\n- En caso de vínculos no registrados en el legajo (ej. convivientes no declarados), se deberá adjuntar además la documentación que acredite el vínculo o información sumaria correspondiente."}, {"id": "a97", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR FALLECIMIENTO DE FAMILIAR", "nombre": "Artículo 2º: PROCEDIMIENTO PARA DÍAS ADICIONALES POR TRASLADO. Para el reconocimiento de los días por viaje, el agente deberá:", "texto": "- Declarar el lugar del sepelio al momento de solicitar la licencia.\n\n- Al reintegrarse, presentar constancia que acredite el traslado (pasajes de transporte, comprobantes de combustible/peajes a su nombre, o certificado emitido por autoridad policial o Juzgado de Paz de la localidad del sepelio).\n\n- Los días de traslado se computarán como una extensión de los días otorgados por el parentesco, debiendo ser usufructuados de forma continua."}, {"id": "a98", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATRIMONIO", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AUTORIZACIÓN. El agente deberá solicitar la licencia con una antelación mínima de quince (15) días hábiles a la fecha de inicio del usufructo.", "texto": "- La solicitud se realizará mediante el formulario correspondiente, indicando la fecha de la celebración matrimonial.\n\n- El superior inmediato deberá dar el visto bueno, garantizando que la ausencia no afecte la dotación mínima del área.\n\n- La autorización definitiva será comunicada por el Departamento de Recursos Humanos."}, {"id": "a99", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATRIMONIO", "nombre": "Artículo 2º: ACREDITACIÓN DEL VÍNCULO. Al reintegrarse a sus funciones, el agente dispone de un plazo de diez (10) días hábiles para presentar ante el Departamento de Recursos Humanos el Acta de Matri", "texto": "La falta de presentación de la documentación en el plazo establecido producirá la revocación de la licencia y el descuento de haberes por los días utilizados."}, {"id": "a100", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATRIMONIO DE HIJO/A", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AUTORIZACIÓN. El agente deberá solicitar la licencia ante su superior inmediato con una antelación mínima de cinco (5) días hábiles a la fecha del evento.", "texto": "- En la solicitud deberá indicar si requiere los días adicionales por traslado, declarando la localidad donde se realizará la boda.\n\n- La autorización quedará sujeta a las necesidades del servicio, debiendo el superior jerárquico validar la ausencia."}, {"id": "a101", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATRIMONIO DE HIJO/A", "nombre": "Artículo 2º: ACREDITACIÓN Y PLAZOS. Al reintegrarse a sus funciones, el agente dispone de un plazo de cinco (5) días hábiles para presentar ante el Departamento de Recursos Humanos:", "texto": "- Copia certificada del Acta de Matrimonio del hijo o hija.\n\n- En caso de haber usufructuado días por traslado, deberá adjuntar constancia que acredite el viaje (pasajes, comprobantes de peaje, combustible o certificación de autoridad local).\n\n- La falta de presentación de la documentación en el plazo establecido dará lugar al descuento de los haberes correspondientes a los días utilizados."}, {"id": "a102", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y AUTORIZACIÓN. La agente deberá comunicar fehacientemente su estado de embarazo a partir de la confirmación médica.", "texto": "- Solicitud: Al inicio del séptimo mes de gestación, deberá presentar la solicitud formal indicando la fecha probable de parto y la opción de licencia elegida (45 días pre-parto o reducción a 30 días).\n\n- Acreditación Final: Producido el nacimiento, la agente dispone de diez (10) días hábiles para presentar el Acta de Nacimiento.\n\n- Control Sanitario: Para la continuidad de la percepción de haberes durante la licencia, RR.HH. podrá requerir trimestralmente la constancia de cumplimiento del Calendario Nacional de Vacunación y controles pediátricos obligatorios del recién nacido."}, {"id": "a103", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 2º: PROCEDIMIENTO PARA EXTENSIONES POR EXCEPCIÓN. En los casos de nacimientos múltiples, prematuros o con discapacidad, la agente deberá:", "texto": "- Presentar la certificación médica del centro de salud donde conste la patología, el grado de prematurez o la condición de nacimiento múltiple dentro de los quince (15) días de ocurrido el parto.\n\n- En caso de discapacidad, se deberá presentar el Certificado Único de Discapacidad (CUD) o, en su defecto, dictamen de la Junta Médica del Instituto que avale la necesidad de mayor atención física y psicológica para otorgar la extensión de un (1) año."}, {"id": "a104", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 3º: PROCEDIMIENTO EN CASO DE EMBARAZO DE RIESGO.", "texto": "- La agente deberá presentar certificado del médico tratante que especifique la necesidad de reposo absoluto o disminución de esfuerzos, indicando el plazo estimado.\n\n- Esta solicitud será girada de inmediato al Contralor Médico del Instituto, quien validará la licencia especial.\n\n- Si el riesgo persistiera hasta el inicio de la licencia por maternidad ordinaria, ambas se empalmarán sin interrupción del beneficio salarial."}, {"id": "a105", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 4º: PROCEDIMIENTO POR ABORTO O INTERRUPCIÓN TERAPÉUTICA. Ante la interrupción del embarazo (a partir del 4º mes):", "texto": "- El agente o un familiar deberá dar aviso inmediato.\n\n- Deberá acreditarse mediante certificado médico de la institución donde se realizó la intervención o se produjo el hecho.\n\n- El Contralor Médico registrará la licencia especial de treinta (30) días, garantizando la confidencialidad absoluta del diagnóstico en los registros públicos de asistencia."}, {"id": "a106", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 5º: PROCEDIMIENTO POR FALLECIMIENTO DE HIJO/A EN LICENCIA. Si el fallecimiento ocurriera durante la licencia por maternidad:", "texto": "- La agente deberá presentar el Acta de Defunción.\n\n- A partir de esa fecha, RR.HH. dará de baja la licencia por maternidad y registrará la licencia especial de treinta (30) días por duelo.\n\n- Finalizado este período, la agente podrá solicitar el usufructo de su Licencia Anual Reglamentaria pendiente si no se encontrara en condiciones de retomar el servicio efectivo, sujeto a evaluación médica."}, {"id": "a107", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR MATERNIDAD", "nombre": "Artículo 6º: PROCEDIMIENTO PARA FRANQUICIA DE LACTANCIA.", "texto": "- Al reintegrarse, la agente presentará por escrito ante su Jefe de Área la modalidad de uso de la hora diaria (fraccionada o continua).\n\n- El responsable del área deberá visar la solicitud y elevarla a Personal para su registro en el sistema de control de accesos.\n\n- Cualquier cambio en la modalidad deberá informarse con cuarenta y ocho (48) horas de antelación."}, {"id": "a108", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR PARTERNIDAD", "nombre": "Artículo 1º: PROCEDIMIENTO DE COMUNICACIÓN Y PLAZOS.", "texto": "- El agente deberá comunicar el nacimiento a su superior inmediato y al Departamento de Recursos Humanos dentro de las cuarenta y ocho (48) horas de producido el hecho.\n\n- La licencia comenzará a contarse, sin excepción, a partir del día del nacimiento o del día hábil inmediato posterior."}, {"id": "a109", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR PARTERNIDAD", "nombre": "Artículo 2º: PROCEDIMIENTO DE JUSTIFICACIÓN Y ACREDITACIÓN. Para la justificación definitiva de los días utilizados, el agente dispondrá de diez (10) días hábiles posteriores a su reintegro para prese", "texto": "- Acta de Nacimiento oficial o fotocopia debidamente certificada.\n\n- En su defecto, la partida de nacimiento o la anotación correspondiente en la Libreta de Familia.\n\n- Extensión por Discapacidad: Para acceder a los treinta (30) días hábiles previstos en el Estatuto, se deberá presentar el Certificado Único de Discapacidad (CUD) o certificado médico de entidad oficial que dé cuenta de la patología del recién nacido."}, {"id": "a110", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR PARTERNIDAD", "nombre": "Artículo 3º: PROCEDIMIENTO DE APROBACIÓN.", "texto": "- El Departamento de Recursos Humanos verificará la documentación y emitirá la constancia de justificación de inasistencias.\n\n- El incumplimiento en la presentación de la documentación en los plazos previstos facultará al Instituto a considerar los días como inasistencias injustificadas, con el consecuente descuento de haberes y la aplicación de las sanciones disciplinarias que correspondan por falta de aviso y justificación."}, {"id": "a111", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ADOPCIÓN", "nombre": "Artículo 1º: LICENCIA POR TRÁMITES PREVIOS. Para facilitar el proceso de vinculación, los agentes tendrán derecho a una licencia de hasta diez (10) días por año calendario para trámites vinculados a l", "texto": "- Se otorgará en bloques de hasta dos (2) días corridos por evento.\n\n- El agente deberá dar aviso con 48 horas de antelación y presentar la constancia del juzgado o registro de adoptantes interviniente."}, {"id": "a112", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ADOPCIÓN", "nombre": "Artículo 3º: DINÁMICA FAMILIAR Y FRACCIONAMIENTO. Cuando ambos adoptantes trabajen en el ISSyS u otros organismos públicos provinciales:", "texto": "- Deberán declarar por escrito cómo distribuirán los días de licencia (si uno solo toma el total o si se fracciona).\n\n- En caso de usufructo conjunto, se deberá dejar constancia para la liquidación de los doce (12) días adicionales de extensión previstos en el Estatuto."}, {"id": "a113", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ASUNTOS PARTICULARES", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD.", "texto": "- El agente deberá solicitar la justificación ante su superior inmediato de manera escrita o a través del sistema de gestión de personal.\n\n- En caso de fuerza mayor o fenómenos meteorológicos imprevistos, el aviso deberá darse dentro de las dos (2) primeras horas de la jornada, formalizando el pedido al reintegrarse.\n\n- La autoridad concedente (Jefe de Departamento o superior) tendrá la facultad de aceptar o rechazar la justificación según las razones expuestas y las necesidades del servicio."}, {"id": "a114", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ASUNTOS PARTICULARES", "nombre": "Artículo 3º: MECANISMO DE DESCUENTO DE L.A.R. Cuando el agente haga uso de los días adicionales previstos en el Estatuto (del 7º al 16º día anual):", "texto": "- El Departamento de Recursos Humanos deberá notificar al agente el saldo restante de sus vacaciones tras el descuento.\n\n- El descuento se aplicará sobre el período de L.A.R. más antiguo que el agente tenga pendiente de usufructo.\n\n- Esta compensación no podrá afectar el fraccionamiento mínimo de cinco (5) días de la L.A.R. establecido en el Artículo 32º inciso a)."}, {"id": "a115", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA EXTRAORDINARIA SIN GOCE DE HABERES", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD.", "texto": "- El agente deberá presentar la solicitud con una antelación mínima de treinta (30) días corridos a la fecha de inicio pretendida, adjuntando la documentación que fundamente el carácter excepcional del pedido.\n\n- El superior inmediato y el Gerente del área deberán emitir un informe técnico donde conste si la ausencia del agente puede ser cubierta sin afectar el servicio o si requiere la designación de un subrogante.\n\n- El expediente será elevado a la Presidencia para el dictado del acto administrativo correspondiente."}, {"id": "a116", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA EXTRAORDINARIA SIN GOCE DE HABERES", "nombre": "Artículo 2º: IMPACTO EN LA CARRERA Y ANTIGÜEDAD.", "texto": "- El período de tiempo en que el agente se encuentre en uso de licencia sin goce de haberes no será computado como tiempo de servicio a los efectos de:\n\n- Determinación de la escala de la Licencia Anual Reglamentaria (L.A.R.).\n\n- Cómputo para el adicional por antigüedad.\n\n- Procesos de ascenso o promociones de categoría.\n\n- Durante el usufructo de la licencia, el agente mantiene su cargo y categoría de revista, pero se suspenden los derechos y obligaciones derivados de la relación laboral activa."}, {"id": "a117", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ACTIVIDAD GREMIAL", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD Y COMUNICACIÓN. La entidad sindical deberá comunicar fehacientemente al Instituto la nómina de los agentes afectados a las funciones gremiales mencionadas en el", "texto": "- Mandatos Prolongados: Para la reserva de cargo, se deberá adjuntar copia de la certificación de autoridades emitida por el Ministerio de Trabajo, Empleo y Seguridad Social de la Nación.\n\n- Permisos Breves: Para los delegados o miembros de comisiones, el gremio deberá remitir mensualmente el cronograma de actividades o convocatorias con una antelación mínima de cuarenta y ocho (48) horas."}, {"id": "a118", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION LICENCIA POR ACTIVIDAD GREMIAL", "nombre": "Artículo 2º: CONTROL Y ACREDITACIÓN. El Departamento de Recursos Humanos llevará un registro especial de licencias gremiales.", "texto": "- Los agentes que usufructúen los cuatro (4) días mensuales (delegados) deberán acreditar su asistencia a las reuniones gremiales mediante constancia firmada por la autoridad sindical competente al momento de su reintegro.\n\n- El incumplimiento en la presentación de dichas constancias transformará la ausencia en inasistencia injustificada."}, {"id": "a119", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR DONACION DE SANGRE", "nombre": "Artículo 2º: ACREDITACIÓN.", "texto": "- Al reintegrarse a sus funciones, el agente deberá presentar ante el Departamento de Recursos Humanos la certificación oficial emitida por el banco de sangre, hospital o centro de salud.\n\n- El certificado deberá contener: nombre del agente, DNI, fecha y hora de la donación, y sello de la institución.\n\n- No se aceptarán como justificativo las meras constancias de \"asistencia\" a centros de salud que no especifiquen el acto de donación efectivo."}, {"id": "a120", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR ACCIDENTE DE TRABAJO O ENFERMEDAD PROFESIONAL", "nombre": "Artículo 2º: COORDINACIÓN CON LA ART.", "texto": "El Instituto abonará los haberes durante los plazos legales, solicitando el reintegro de las Prestaciones Dinerarias a la ART según los convenios vigentes.\n\nLos plazos de esta licencia se computarán de manera continua. La determinación de la \"consolidación del daño\" o el \"alta médica\" será facultad de los médicos de la ART o, en su defecto, de la Comisión Médica Jurisdiccional."}, {"id": "a121", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR VIOLENCIA DE GÉNERO", "nombre": "Artículo 1º: PROCEDIMIENTO DE SOLICITUD SIMPLIFICADO. Para preservar la intimidad, el agente podrá solicitar la licencia ante el Departamento de Recursos Humanos o el área de Medicina Laboral mediante", "texto": "- Formulario de solicitud de licencia especial (sin necesidad de relatar el hecho ante superiores directos).\n\n- Acreditación mediante constancia de denuncia judicial, policial, o informe de servicios estatales de atención a la víctima (locales, provinciales o nacionales)."}, {"id": "a122", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR VIOLENCIA DE GÉNERO", "nombre": "Artículo 2º: CERTIFICACIÓN Y CONFIDENCIALIDAD.", "texto": "- El legajo del agente solo contendrá la constancia de \"Licencia Especial Art. 32 Inc. q\". Los detalles de la causa quedarán en sobre cerrado y bajo custodia exclusiva del Responsable de Recursos Humanos.\n\n- Todo el personal que tome conocimiento de la situación por razones de servicio está obligado a guardar secreto profesional, bajo pena de sanción grave."}, {"id": "a123", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN LICENCIA POR VIOLENCIA DE GÉNERO", "nombre": "Artículo 3º: GESTIÓN DE LAS MEDIDAS DE APOYO. Cuando el agente solicite la reducción de jornada o cambio de lugar de trabajo:", "texto": "- El Departamento de Recursos Humanos deberá emitir una disposición transitoria de carácter inmediato.\n\n- La superioridad jerárquica deberá facilitar la medida sin cuestionar los motivos, priorizando la seguridad del agente."}, {"id": "a124", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ASUETOS Y FERIADOS", "nombre": "Artículo 1º: GUARDIAS EN DELEGACIÓN CAPITAL FEDERAL. Debido a la urgencia de las prestaciones de salud que se tramitan en la Ciudad Autónoma de Buenos Aires:", "texto": "- La Jefatura de la Delegación establecerá un cronograma de guardias mínimas para cubrir feriados y asuetos.\n\n- El agente afectado a la guardia tendrá derecho a compensar dicho día con un \"Franco Compensatorio\" a usufructuar dentro de los quince (15) días inmediatos posteriores, previa coordinación con su superior."}, {"id": "a125", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ASUETOS Y FERIADOS", "nombre": "Artículo 2º: LIQUIDACIÓN DE SERVICIOS EN COMPLEJOS TURÍSTICOS. Para el personal de complejos propios u hotelería:", "texto": "- El pago del 200% se aplicará a todas las horas trabajadas durante el día feriado o asueto provincial.\n\n- La oficina de Personal deberá certificar la asistencia efectiva del agente mediante el registro de reloj o planilla de guardia para habilitar el pago del concepto en el recibo de haberes."}, {"id": "a126", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACION DE LAS OBLIGACIONES Y PROHIBICIONES", "nombre": "Artículo 1º: En relación con las obligaciones y prohibiciones establecidas en el Estatuto, se disponen las siguientes normas de procedimiento y control:", "texto": "- La prestación de servicio regular mencionada en el Artículo 34º inciso a) implica el registro obligatorio de ingreso y egreso mediante el sistema que el Instituto determine, considerándose el incumplimiento del horario como falta sujeta a las sanciones previstas en el régimen disciplinario.\n\n- A los efectos del Artículo 34º inciso m), el domicilio legal declarado se considerará constituido para todas las notificaciones administrativas y judiciales. Todo cambio de residencia debe comunicarse al Departamento de Recursos Humanos mediante formulario oficial dentro de las cuarenta y ocho (48) horas de producido, bajo apercibimiento de tener por válidas las notificaciones cursadas al domicilio anterior.\n\n- La obligación de vestimenta adecuada prevista en el Artículo 34º inciso p) se extiende al uso obligatorio de credenciales identificatorias y, en los sectores donde el Instituto provea uniformes de trabajo, estos deberán ser utilizados en forma exclusiva y mantenerse en perfecto estado de higiene.\n\n- El deber de reserva y la prohibición de difundir información interna (Artículos 34º inciso ñ y 35º inciso i) comprenden la prohibición de publicar en redes sociales personales o medios digitales capturas de pantalla, fotografías de expedientes, bases de datos de afiliados o cualquier documento de carácter interno sin autorización jerárquica expresa.\n\n- En cumplimiento del Artículo 34º inciso k), el agente deberá formalizar su excusación por escrito ante su superior inmediato cuando deba intervenir en actuaciones que involucren a parientes hasta el cuarto grado de consanguinidad o segundo de afinidad, o existan intereses comerciales o pleitos pendientes con el administrado.\n\n- La prohibición de patrocinar trámites establecida en el Artículo 35º inciso h) impide que el agente realice gestiones, consultas o seguimientos de expedientes en representación de terceros, incluso fuera de su horario laboral, si dichos trámites se encuentran bajo la órbita del Instituto.\n\n- El uso de elementos del Organismo previsto en el Artículo 35º inciso d) se extiende a los sistemas informáticos, correos institucionales y acceso a internet, los cuales deben ser utilizados exclusivamente para fines laborales, quedando prohibido su uso para actividades particulares o proselitistas.\n\n- La autorización para listas de suscripción con fin social, mencionada en el Artículo 35º inciso e), será otorgada únicamente por la Gerencia de área correspondiente, debiendo el agente responsable rendir cuentas de lo recaudado si así se le solicitara.\n\n- El incumplimiento de cualquiera de los incisos reglamentarios precedentes dará lugar a la apertura del proceso de investigación o sumario administrativo, según la gravedad de la falta y de acuerdo con el régimen disciplinario vigente."}, {"id": "a127", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 1º: PROCEDIMIENTO PARA SANCIONES MENORES. En relación con las sanciones de apercibimiento o suspensiones de hasta diez (10) días por hechos de valoración subjetiva (Artículo 50º), se observar", "texto": "- El superior jerárquico notificará por escrito al agente la conducta imputada, otorgándole un plazo de tres (3) días hábiles para que este presente su descargo y aporte las pruebas que considere pertinentes.\n\n- Presentado el descargo o vencido el plazo para hacerlo, la autoridad competente dictará la resolución dentro de los cinco (5) días hábiles, evaluando las pruebas y antecedentes del agente.\n\n- Las sanciones derivadas de hechos objetivos, tales como el incumplimiento de horario o inasistencias injustificadas, se aplicarán de forma automática mediante la notificación de la resolución basada en los registros de control de asistencia."}, {"id": "a128", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 2º: CÓMPUTO Y NOTIFICACIÓN DE SANCIONES. A los efectos de la aplicación efectiva de las medidas disciplinarias:", "texto": "- Las suspensiones se computarán por días corridos. El agente deberá cumplir la sanción a partir del primer día hábil siguiente a la notificación de la resolución firme, salvo que el acto administrativo disponga una fecha distinta por razones de servicio.\n\n- La notificación de toda sanción deberá hacerse de forma personal en el lugar de trabajo o mediante medio electrónico oficial que garantice la recepción, dejando constancia en el legajo personal del agente.\n\n- El descuento de haberes por días de suspensión se aplicará de manera íntegra en la liquidación correspondiente al mes en que se cumple la sanción, o en el mes inmediato siguiente si el cierre de liquidación ya hubiese operado."}, {"id": "a129", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 3º: CONTROL DE ASISTENCIA Y PUNTUALIDAD. Para la operatividad de los Artículos 44º y 45º, el Departamento de Recursos Humanos observará las siguientes reglas:", "texto": "- El cierre del cómputo de tardanzas e inasistencias se realizará mensualmente. Los informes de exceso de tolerancia o inasistencias sin justificar serán elevados a la autoridad jerárquica para la emisión de la resolución sancionatoria correspondiente.\n\n- Se considerará inasistencia injustificada aquella en la cual el agente no haya dado aviso dentro de las primeras dos horas de la jornada y no presente el certificado médico o comprobante de fuerza mayor dentro de las cuarenta y ocho (48) horas de producido el hecho."}, {"id": "a130", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 4º: TRAMITACIÓN DE RECURSOS. En relación con el Artículo 51º, el trámite de los recursos se ajustará a lo siguiente:", "texto": "- El escrito de interposición del recurso debe contener la fundamentación fáctica y jurídica de la impugnación. La falta de fundamentos será causa suficiente para el rechazo in limine del recurso.\n\n- Durante el efecto suspensivo del recurso, el agente continuará prestando servicios y percibiendo sus haberes normalmente hasta que recaiga resolución definitiva que agote la vía administrativa."}, {"id": "a131", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 5º: SUSPENSIÓN PREVENTIVA DURANTE EL SUMARIO. En los casos de instrucción de sumario administrativo por faltas graves:", "texto": "- La autoridad que ordena el sumario podrá disponer la suspensión preventiva del agente por un plazo no mayor a treinta (30) días cuando su permanencia en el cargo sea inconveniente para el esclarecimiento de los hechos o peligre la seguridad de los bienes del Instituto.\n\n- Dicha suspensión será con goce de haberes, salvo que el sumario se origine por una condena penal privativa de la libertad, en cuyo caso la suspensión será sin goce de haberes mientras dure la detención."}, {"id": "a132", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ADCIONAL ZONA DESFAVORABLE", "nombre": "Artículo 2º: Residencia Efectiva y Traslados. El derecho al percibo de los porcentajes establecidos en los incisos a) o b) nace a partir de la toma de posesión del cargo en el destino geográfico asign", "texto": "- En caso de traslados, el cambio de porcentaje se aplicará a partir del primer día del mes siguiente de producida la novedad.\n\n- Si el agente es trasladado transitoriamente (comisión de servicios), mantendrá el porcentaje de su zona de origen."}, {"id": "a133", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN PROLONGACIÓN DE JORNADA", "nombre": "Artículo 1º: Procedimiento de Autorización. La solicitud de Prolongación de Jornada deberá iniciarse mediante nota fundada del Director Funcional o Delegado, detallando:", "texto": "- Fundamentos de la mayor carga horaria.\n\n- Listado del personal afectado.\n\n- Visto bueno de la Gerencia General. Una vez aprobada la necesidad, se dictará la Disposición o Resolución correspondiente que habilite la liquidación."}, {"id": "a134", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN FALLO DE CAJA", "nombre": "Artículo 2º: Proporcionalidad por Cumplimiento. Dado que el beneficio compensa un riesgo por contacto efectivo con valores:", "texto": "- Se liquidará en proporción a los días en que el agente efectivamente realizó la apertura y cierre de caja.\n\n- No se percibirá durante períodos de licencia de cualquier tipo, inasistencias, o cuando el agente sea asignado transitoriamente a tareas administrativas que no impliquen manejo de dinero.\n\n- El valor diario se obtendrá dividiendo el monto total del grupo correspondiente por veintidós (22)."}, {"id": "a135", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN BONIFICACIÓN POR FALLECIMIENTO", "nombre": "Artículo 1º: Acreditación del Vínculo. Para acceder al cobro de las bonificaciones previstas, los beneficiarios deberán presentar ante el Departamento de Desarrollo de RRHH y Personal:", "texto": "- Certificado de Defunción del agente.\n\n- Documentación que acredite el vínculo (Partida de Matrimonio, Unión Convivencial inscrita o Partidas de Nacimiento).\n\n- Declaratoria de Herederos o, en casos de urgencia social debidamente acreditada, autorización del Directorio para el pago anticipado a quien acredite haber sufragado los gastos de sepelio."}, {"id": "a136", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN ADICIONAL POR VIVIENDA", "nombre": "Artículo 1º: Procedimiento de Solicitud. Para acceder al beneficio, el agente deberá presentar ante el Departamento de Desarrollo de RRHH y Personal:", "texto": "- Copia del Acto Administrativo que dispone la prestación transitoria de servicios fuera de su asiento habitual.\n\n- Declaración Jurada de domicilio y certificación negativa de propiedad inmueble en la localidad de destino, emitida por el Registro de la Propiedad Inmueble.\n\n- Contrato de locación o comprobante de gastos de alojamiento a su nombre."}, {"id": "a137", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN INDEMNIZACIÓN POR TRASLADO", "nombre": "Artículo 2º: Acreditación del Grupo Familiar. Para el cobro del adicional del 31%, el agente deberá presentar:", "texto": "- Certificados de vecindad del grupo familiar en el nuevo destino o cambio de domicilio en el DNI.\n\n- Certificación de la Dirección de Recursos Humanos de que los familiares se encuentran declarados a cargo del agente.\n\n- En caso de hijos en edad escolar, constancia de inscripción o vacante en establecimientos educativos de la nueva localidad."}, {"id": "a138", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN SUBROGANCIAS", "nombre": "Artículo 2º: Cálculo de la Diferencia Salarial. La diferencia de sueldo se calculará restando:", "texto": "- El Sueldo Básico que ostentaría el agente en la Categoría superior (manteniendo su Rango de promoción horizontal).\n\n- El Sueldo Básico que el agente percibe actualmente por su situación de revista. El resultado será un adicional transitorio denominado \"Diferencia por Subrogancia\", el cual tendrá carácter remunerativo."}, {"id": "a139", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN PROTECCIÓN DE HABERES", "nombre": "Artículo 1º: Prioridad de Descuentos. El Sector Sueldos, al aplicar retenciones sobre los haberes, deberá respetar el siguiente orden de prelación:", "texto": "- Retenciones de Ley (Aportes Previsionales y Obra Social).\n\n- Embargos por cuotas alimentarias.\n\n- Embargos comerciales (respetando el tope del 20%).\n\n- Cuotas por préstamos asistenciales o convenios institucionales."},
{"id":"ri01","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 1º: Objeto","texto":"El proceso de selección tiene por objeto evaluar la idoneidad, formación y aptitudes de los postulantes para el ingreso al Instituto de Seguridad Social y Seguros (ISSyS), garantizando la igualdad de oportunidades y el cumplimiento de los requisitos establecidos en el Estatuto.","tipo":"reglamento"},
{"id":"ri02","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 2º: Rango de Ingreso","texto":"Todo ingreso a la Planta Permanente del ISSyS, resultado de este proceso de selección, se efectuará indefectiblemente en el Rango Inicial del Agrupamiento correspondiente (Médico/Legal, Profesional, Técnico, Administrativo, Servicios u Hotelero).","tipo":"reglamento"},
{"id":"ri03","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 3º: Autoridad y Fiscalización","texto":"El llamado y desarrollo del proceso de selección será responsabilidad de la Dirección de Secretaría General, a través del Departamento Desarrollo de Recursos Humanos y Personal. El proceso contará con la participación de la Asociación del Personal del Instituto de Seguridad Social y Seguros (A.P.I.S.S.y S.) en carácter de fiscalizador, a los fines de controlar la legalidad de los procedimientos.","tipo":"reglamento"},
{"id":"ri04","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 4º: Convocatoria","texto":"Los concursos de ingreso serán abiertos y difundidos mediante los medios de prensa o plataformas oficiales del Instituto con una antelación mínima que asegure la máxima concurrencia. La resolución de convocatoria deberá consignar: la fecha de inscripción, el Agrupamiento y el cargo a concursar, la fecha y hora del examen, y los pliegos de condiciones.","tipo":"reglamento"},
{"id":"ri05","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 5º: Documentación Obligatoria","texto":"Para formalizar la inscripción, el postulante deberá presentar ante el Departamento Desarrollo de Recursos Humanos y Personal la totalidad de la documentación requerida en el Artículo 16º del Estatuto. La falta de presentación de alguno de los documentos obligatorios implicará la no admisión al concurso.","tipo":"reglamento"},
{"id":"ri06","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 6º: Comisión Evaluadora","texto":"Se conformará una Comisión Evaluadora integrada por agentes de la Planta Permanente del Instituto, designados por la autoridad competente. Esta comisión tendrá a su cargo la tarea de certificar las copias de los documentos originales y de notificar los resultados a los concursantes.","tipo":"reglamento"},
{"id":"ri07","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 7º: Evaluación de Antecedentes","texto":"La Comisión Evaluadora asignará un puntaje a los antecedentes presentados por el postulante conforme a la escala que se determine en la reglamentación complementaria, incluyendo la acreditación de haber cumplido con los ciclos de enseñanza requeridos para el Agrupamiento.","tipo":"reglamento"},
{"id":"ri08","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 8º: Examen de Oposición","texto":"Los postulantes que cumplan con la totalidad de los requisitos de inscripción y antecedentes deberán rendir un examen de oposición, cuyo temario y modalidad serán establecidos por el área del cargo a concursar.","tipo":"reglamento"},
{"id":"ri09","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 9º: Contenido del Examen","texto":"El examen versará sobre los conocimientos técnicos o prácticos necesarios para el desempeño de las funciones, pudiendo incluir, según el agrupamiento, la evaluación de antecedentes laborales, conocimientos básicos de matemáticas, dactilografía, caligrafía y redacción.","tipo":"reglamento"},
{"id":"ri10","titulo":"REGLAMENTACIÓN","capitulo":"REGLAMENTACIÓN DEL PROCESO DE SELECCIÓN PARA EL INGRESO","nombre":"Artículo 10º: Aprobación","texto":"Se considera aprobada la instancia de oposición al obtener el setenta por ciento (70%) de la puntuación máxima del examen, conforme a lo dispuesto en la reglamentación para el proceso de promoción.","tipo":"reglamento"},

// ─── AUTH ─────────────────────────────────────────────────────────────────
function initAuth() {
  window._fbOnAuthChanged(async user => {
    if (user) {
      currentUser = user;
      try {
        const snap = await window._fbGetDoc(window._fbDoc(window._fbDb, 'users', user.uid));
        if (snap.exists()) {
          currentUserProfile = snap.data();
        } else {
          const usersSnap = await window._fbFirestore.getDocs(window._fbFirestore.collection(window._fbDb, 'users'));
          const role = usersSnap.empty ? 'admin' : 'lector';
          currentUserProfile = { email: user.email, name: user.email, role, active: true, createdAt: Date.now() };
          await window._fbSetDoc(window._fbDoc(window._fbDb, 'users', user.uid), currentUserProfile);
        }
      } catch(e) {
        console.error('Error perfil:', e);
        currentUserProfile = { email: user.email, name: user.email, role: 'lector', active: true };
      }
      if (currentUserProfile.active === false) { showToast('❌ Cuenta desactivada'); await doSignOut(); return; }
      document.getElementById('authOverlay').style.display = 'none';
      updateUserMenu();
      applyRoleUI();
      await loadAllData();
    } else {
      currentUser = null; currentUserProfile = null;
      document.getElementById('authOverlay').style.display = 'flex';
    }
  });
}

function updateUserMenu() {
  if (!currentUserProfile) return;
  const p = currentUserProfile;
  document.getElementById('userMenuName').textContent  = p.name || p.email;
  document.getElementById('userMenuEmail').textContent = p.email;
  const rb = document.getElementById('userMenuRole');
  rb.textContent = ROLE_LABELS[p.role] || p.role;
  rb.className = 'role-badge ' + (ROLE_CLASS[p.role] || '');
  const words = (p.name || p.email).trim().split(/\s+/);
  const initials = words.length >= 2 ? (words[0][0] + words[words.length-1][0]).toUpperCase() : words[0].substring(0,2).toUpperCase();
  document.getElementById('userAvatar').textContent = initials;
}

function applyRoleUI() {
  document.getElementById('btnAddConcept').disabled = !canWrite();
}

async function doSignIn() {
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPassword').value;
  const btn   = document.getElementById('authBtn');
  const err   = document.getElementById('authError');
  if (!email || !pass) { showAuthError('Completá email y contraseña'); return; }
  btn.disabled = true; btn.textContent = 'Iniciando…';
  err.classList.remove('visible');
  try { await window._fbSignIn(email, pass); }
  catch(e) {
    const msgs = { 'auth/user-not-found':'Usuario no encontrado','auth/wrong-password':'Contraseña incorrecta','auth/invalid-email':'Email inválido','auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.','auth/invalid-credential':'Email o contraseña incorrectos' };
    showAuthError(msgs[e.code] || e.message);
  } finally { btn.disabled = false; btn.textContent = 'Iniciar sesión'; }
}
function showAuthError(msg) { const e = document.getElementById('authError'); e.textContent = msg; e.classList.add('visible'); }
async function doSignOut() { try { await window._fbSignOut(); } catch(e) { showToast('❌ Error al cerrar sesión'); } }

  showSpinner(true);
  try {
    const [editorSnap, conceptsSnap, linksSnap, posSnap] = await Promise.all([
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerEditor', 'state')),
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'concepts')),
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'links')),
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'positions'))
    ]);

    editorState = editorSnap.exists() ? editorSnap.data() : null;
    console.log('[EER-Graph] Estado editor:', editorState ? `${Object.keys(editorState.texts||{}).length} textos` : 'vacío');

    graphConcepts = conceptsSnap.exists() ? (conceptsSnap.data().items || []) : [];
    graphLinks    = linksSnap.exists()    ? (linksSnap.data().items    || []) : [];
    graphPositions= posSnap.exists()      ? (posSnap.data()            || {}) : {};

    if (graphConcepts.length === 0 && canWrite()) {
      console.log('[EER-Graph] Primera vez: pre-poblando conceptos iniciales');
      graphConcepts = INITIAL_CONCEPTS.map(c => ({ ...c, id: crypto.randomUUID() }));
      await saveConceptsToFirebase();
    }

    lastLoadTime = new Date();
    document.getElementById('hdrVer').textContent = 'Actualizado ' + lastLoadTime.toLocaleTimeString('es-AR');

    buildGraph();
  } catch(e) {

    showToast('⚠ Error de conexión — mostrando artículos sin datos de grafo');
    editorState = null; graphConcepts = []; graphLinks = [];

    console.groupEnd();
