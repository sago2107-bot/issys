// ─── BUILD GRAPH DATA ─────────────────────────────────────────────────────
function buildGraph() {
  const order = editorState?.order || RAW_DATA_STATIC.map(a => a.id);
  const metaById = {};
  RAW_DATA_STATIC.forEach(a => { metaById[a.id] = a; });
  // Overrides from artMeta if state available
  if (editorState?.artMeta) Object.entries(editorState.artMeta).forEach(([id, m]) => {
    if (metaById[id]) metaById[id] = { ...metaById[id], ...m };
  });

  // Build titulo color map
  const titulos = [...new Set(RAW_DATA_STATIC.map(a => a.titulo))];
  titulos.forEach((t, i) => { tituloColorMap[t] = TITULO_COLORS[i % TITULO_COLORS.length]; });

  // Type A nodes (articles)
  const artNodes = order.map(id => {
    const meta = metaById[id] || { id, nombre: id, titulo: '—', capitulo: '—', tipo: 'estatuto' };
    const numMatch = meta.nombre.match(/Art[ií]culo\s*(\d+\w*[ºo°]*)/i);
    const numLabel = numMatch ? numMatch[1].replace(/[ºo°]/g,'') : id.replace('a','');
    return {
      id, type: 'article',
      nombre: meta.nombre, titulo: meta.titulo, capitulo: meta.capitulo, tipo: meta.tipo || 'estatuto',
      numLabel,
      flag: editorState?.flags?.[id] || null,
      color: tituloColorMap[meta.titulo] || ISSYS.azul
    };
  });

  // Type B nodes (concepts)
  const conceptNodes = graphConcepts.map(c => ({
    id: c.id, type: 'concept',
    label: c.label, description: c.description, category: c.category,
    color: CAT_COLORS[c.category] || ISSYS.gris
  }));

  allNodes = [...artNodes, ...conceptNodes];

  // Restore positions
  allNodes.forEach(n => {
    if (graphPositions[n.id]) { n.fx = graphPositions[n.id].x; n.fy = graphPositions[n.id].y; }
    else { n.x = undefined; n.y = undefined; n.fx = undefined; n.fy = undefined; }
  });

  // Build edges
  const edges = [];
  const edgeSet = new Set();
  function addEdge(source, target, type, label) {
    const key = [source, target].sort().join('|');
    if (source === target || edgeSet.has(key + '|' + type)) return;
    edgeSet.add(key + '|' + type);
    edges.push({ id: `e_${edges.length}`, source, target, edgeType: type, label: label || '' });
  }

  // Auto edges from htmlTexts
  if (editorState?.htmlTexts) {
    const tmp = document.createElement('div');
    Object.entries(editorState.htmlTexts).forEach(([srcId, html]) => {
      tmp.innerHTML = html;
      tmp.querySelectorAll('[data-ref]').forEach(chip => {
        const tgt = chip.dataset.ref;
        if (tgt) addEdge(srcId, tgt, 'auto');
      });
    });
  }
  // Auto edges from plain text [[artId:texto]]
  if (editorState?.texts) {
    const refReg = /\[\[([^\]:]+):([^\]]+)\]\]/g;
    Object.entries(editorState.texts).forEach(([srcId, raw]) => {
      let m;
      while ((m = refReg.exec(raw)) !== null) addEdge(srcId, m[1], 'auto');
    });
  }
  // capAssoc edges (dashed, reglamento↔estatuto)
  if (editorState?.capAssoc) {
    Object.entries(editorState.capAssoc).forEach(([capKey, artId]) => {
      const reglArt = allNodes.find(n => n.titulo === capKey.split('\n')[0] && n.tipo === 'reglamento');
      if (reglArt && artId) addEdge(reglArt.id, artId, 'capAssoc');
    });
  }
  // Manual edges from Firebase
  graphLinks.forEach(lnk => {
    if (lnk.source && lnk.target) edges.push({ id: lnk.id, source: lnk.source, target: lnk.target, edgeType: 'manual', label: lnk.label || '', dbId: lnk.id });
  });

  allEdges = edges;
  updateStats();
  renderGraph();
}

// ─── STATS ────────────────────────────────────────────────────────────────
function updateStats() {
  const artCount = allNodes.filter(n => n.type === 'article').length;
  const conCount = allNodes.filter(n => n.type === 'concept').length;
  const autoE = allEdges.filter(e => e.edgeType === 'auto').length;
  const manE  = allEdges.filter(e => e.edgeType === 'manual').length;
  const assocE = allEdges.filter(e => e.edgeType === 'capAssoc').length;
  document.getElementById('statsSection').style.display = '';
  document.getElementById('statsContent').innerHTML =
    `Artículos: <b>${artCount}</b><br>Conceptos externos: <b>${conCount}</b><br>` +
    `Refs automáticas: <b>${autoE}</b><br>Vinculaciones: <b>${assocE}</b><br>Manuales: <b>${manE}</b>`;
}

// ─── RENDER GRAPH ─────────────────────────────────────────────────────────
function renderGraph() {
  const svgEl = document.getElementById('graphSvg');
  const wrap  = document.getElementById('canvasWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  d3.select(svgEl).selectAll('g > *').remove();

  svg = d3.select(svgEl);
  g   = d3.select('#graphRoot');
  hullLayer = d3.select('#hullLayer');
  edgeLayer = d3.select('#edgeLayer');
  nodeLayer = d3.select('#nodeLayer');

  // Zoom
  zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', ev => {
    g.attr('transform', ev.transform);
    closeCtxMenu();
  });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.on('dblclick', () => centerGraph());
  svg.on('contextmenu', e => { e.preventDefault(); });

  const nodeById = new Map(allNodes.map(n => [n.id, n]));

  // Prepare visible nodes/edges (apply filters)
  const { visNodes, visEdges } = getVisible();

  // Simulation
  if (simulation) simulation.stop();
  simulation = d3.forceSimulation(visNodes)
    .force('link', d3.forceLink(visEdges).id(d => d.id).distance(d => d.edgeType === 'manual' ? 110 : 80).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-180))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => nodeRadius(d) + 5))
    .alphaDecay(0.03)
    .velocityDecay(0.4);

  // EDGES
  const edgeSel = edgeLayer.selectAll('.edge').data(visEdges, d => d.id)
    .join('line')
    .attr('class', 'edge')
    .attr('stroke', edgeColor)
    .attr('stroke-width', edgeWidth)
    .attr('stroke-dasharray', d => d.edgeType === 'capAssoc' ? '4,3' : null)
    .attr('opacity', edgeOpacity)
    .attr('marker-end', d => d.edgeType === 'manual' ? 'url(#arrow-manual)' : null)
    .on('mouseenter', function(ev, d) {
      if (d.label) showToast(d.label, 1800);
      d3.select(this).attr('stroke-width', edgeWidth(d) + 1).attr('opacity', 1);
    })
    .on('mouseleave', function(ev, d) {
      d3.select(this).attr('stroke-width', edgeWidth(d)).attr('opacity', edgeOpacity(d));
    })
    .on('contextmenu', function(ev, d) {
      if (!canWrite() || d.edgeType !== 'manual') return;
      ev.preventDefault(); ev.stopPropagation();
      ctxEdgeData = d;
      showCtxMenu(ev.clientX, ev.clientY);
    });

  // NODES
  const nodeSel = nodeLayer.selectAll('.node').data(visNodes, d => d.id)
    .join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end',   (ev, d) => {
        if (!ev.active) simulation.alphaTarget(0);
        saveNodePosition(d.id, d.x, d.y);
      })
    )
    .on('click', (ev, d) => {
      ev.stopPropagation();
      if (linkingMode) { handleLinkTarget(d.id); return; }
      selectNode(d.id);
    })
    .on('contextmenu', (ev, d) => {
      ev.preventDefault();
      if (d.fx !== undefined && d.fy !== undefined) { d.fx = undefined; d.fy = undefined; simulation.alphaTarget(0.1).restart(); showToast('Nodo liberado'); }
    })
    .on('mouseenter', (ev, d) => highlightNode(d.id))
    .on('mouseleave', () => clearHighlight());

  // Article circles
  nodeSel.filter(d => d.type === 'article').append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => d.color)
    .attr('stroke', d => FLAG_STROKE[d.flag] || ISSYS.grisCl)
    .attr('stroke-width', 2.5);

  // Concept diamonds (rotated rect)
  nodeSel.filter(d => d.type === 'concept').append('polygon')
    .attr('points', d => { const r = nodeRadius(d); return `0,${-r} ${r},0 0,${r} ${-r},0`; })
    .attr('fill', d => d.color + '33')
    .attr('stroke', d => d.color)
    .attr('stroke-width', 2);

  // Labels
  nodeSel.append('text')
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('fill', d => d.type === 'article' ? '#fff' : d.color)
    .attr('font-size', d => d.type === 'article' ? 9 : 9)
    .attr('font-family', d => d.type === 'article' ? 'JetBrains Mono,monospace' : 'Encode Sans Condensed,sans-serif')
    .attr('font-weight', '600')
    .attr('pointer-events', 'none')
    .text(d => truncLabel(d));

  // Tick
  simulation.on('tick', () => {
    edgeSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx*dx+dy*dy) || 1;
        const r = nodeRadius(d.target) + (d.edgeType === 'manual' ? 8 : 0);
        return d.target.x - dx/dist*r;
      })
      .attr('y2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx*dx+dy*dy) || 1;
        const r = nodeRadius(d.target) + (d.edgeType === 'manual' ? 8 : 0);
        return d.target.y - dy/dist*r;
      });
    nodeSel.attr('transform', d => `translate(${d.x||0},${d.y||0})`);
    if (groupBy !== 'none') drawHulls(visNodes);
  });

  // Hull layer click passthrough
  hullLayer.on('click', () => { if (!linkingMode) { closeDetail(); } });
  svg.on('click', () => { if (!linkingMode) { closeDetail(); clearHighlight(); } });
}

function truncLabel(d) {
  if (d.type === 'article') return d.numLabel || '';
  const lbl = d.label || '';
  return lbl.length > 10 ? lbl.substring(0,9) + '…' : lbl;
}

function nodeRadius(d) {
  const degree = allEdges.filter(e => e.source === d.id || e.target === d.id || e.source?.id === d.id || e.target?.id === d.id).length;
  const base = d.type === 'article' ? 8 : 11;
  return base + Math.min(degree, 8) * 0.8;
}

function edgeColor(d) {
  return d.edgeType === 'auto' ? '#C6C6C6' : d.edgeType === 'capAssoc' ? '#4657A0' : '#59B57E';
}
function edgeWidth(d) { return d.edgeType === 'manual' ? 1.5 : 1; }
function edgeOpacity(d) { return d.edgeType === 'auto' ? 0.5 : d.edgeType === 'capAssoc' ? 0.6 : 0.8; }

// ─── FILTERS ──────────────────────────────────────────────────────────────
function getVisible() {
  const showArts     = document.getElementById('filterArts').checked;
  const showConcepts = document.getElementById('filterConcepts').checked;
  const showFlagNone = document.getElementById('flagNone').checked;
  const showPending  = document.getElementById('flagPending').checked;
  const showReview   = document.getElementById('flagReview').checked;
  const showApproved = document.getElementById('flagApproved').checked;
  const q = (document.getElementById('searchInput').value || '').toLowerCase();

  const visNodes = allNodes.filter(n => {
    if (n.type === 'article') {
      if (!showArts) return false;
      const flag = n.flag || null;
      if (flag === null && !showFlagNone) return false;
      if (flag === 'pending' && !showPending) return false;
      if (flag === 'review' && !showReview) return false;
      if (flag === 'approved' && !showApproved) return false;
      if (q && !n.nombre.toLowerCase().includes(q) && !n.id.toLowerCase().includes(q)) return false;
      return true;
    } else {
      if (!showConcepts) return false;
      if (q && !n.label.toLowerCase().includes(q) && !(n.description||'').toLowerCase().includes(q)) return false;
      return true;
    }
  });
  const visSet = new Set(visNodes.map(n => n.id));
  const visEdges = allEdges.filter(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    return visSet.has(sid) && visSet.has(tid);
  });
  return { visNodes, visEdges };
}

function applyFilters() { renderGraph(); }
function onSearch(v) { renderGraph(); }

// ─── GROUPING (HULLS) ─────────────────────────────────────────────────────
function setGroupBy(val) { groupBy = val; renderGraph(); }

function drawHulls(nodes) {
  const key = groupBy === 'titulo' ? 'titulo' : 'capitulo';
  const groups = d3.group(nodes.filter(n => n.type === 'article' && n[key]), n => n[key]);
  const hullData = [];
  groups.forEach((pts, label) => {
    if (pts.length < 3) return;
    const coords = pts.map(n => [n.x, n.y]);
    const hull = d3.polygonHull(coords);
    if (hull) hullData.push({ label, hull, color: pts[0].color });
  });

  hullLayer.selectAll('.hull-group').data(hullData, d => d.label)
    .join(
      enter => {
        const grp = enter.append('g').attr('class', 'hull-group');
        grp.append('path');
        grp.append('text').attr('class', 'hull-label').attr('font-size', 10).attr('font-weight', 700);
        return grp;
      }
    )
    .each(function(d) {
      const expanded = d.hull.map(([x,y]) => {
        const cx = d.hull.reduce((s,p)=>s+p[0],0)/d.hull.length;
        const cy = d.hull.reduce((s,p)=>s+p[1],0)/d.hull.length;
        const f = 18;
        return [x + (x-cx)/Math.max(Math.abs(x-cx),1)*f, y + (y-cy)/Math.max(Math.abs(y-cy),1)*f];
      });
      d3.select(this).select('path')
        .attr('d', 'M' + expanded.join('L') + 'Z')
        .attr('fill', d.color + '18')
        .attr('stroke', d.color + '55')
        .attr('stroke-width', 1.5);
      const centX = d.hull.reduce((s,p)=>s+p[0],0)/d.hull.length;
      const centY = d.hull.reduce((s,p)=>s+p[1],0)/d.hull.length - 20;
      const shortLabel = d.label.length > 40 ? d.label.substring(0,38)+'…' : d.label;
      d3.select(this).select('text').attr('x', centX).attr('y', centY).attr('text-anchor','middle').text(shortLabel);
    });
  hullLayer.selectAll('.hull-group').filter((d, i, nodes) => !hullData.find(h => h.label === d.label)).remove();
}

// ─── HIGHLIGHT ────────────────────────────────────────────────────────────
function highlightNode(id) {
  const connected = new Set([id]);
  edgeLayer.selectAll('.edge').each(function(d) {
    const sid = typeof d.source === 'object' ? d.source.id : d.source;
    const tid = typeof d.target === 'object' ? d.target.id : d.target;
    if (sid === id || tid === id) { connected.add(sid); connected.add(tid); }
  });
  nodeLayer.selectAll('.node').attr('opacity', d => connected.has(d.id) ? 1 : 0.15);
  edgeLayer.selectAll('.edge').attr('opacity', d => {
    const sid = typeof d.source === 'object' ? d.source.id : d.source;
    const tid = typeof d.target === 'object' ? d.target.id : d.target;
    return (connected.has(sid) && connected.has(tid)) ? edgeOpacity(d) * 1.4 : 0.05;
  });
}
function clearHighlight() {
  nodeLayer.selectAll('.node').attr('opacity', 1);
  edgeLayer.selectAll('.edge').attr('opacity', edgeOpacity);
}

// ─── SELECT NODE (DETAIL PANEL) ──────────────────────────────────────────
function selectNode(id) {
  selectedNodeId = id;
  const node = allNodes.find(n => n.id === id);
  if (!node) return;
  const pnl = document.getElementById('detailPnl');
  pnl.classList.add('open');
  const typeBadge = document.getElementById('detailTypeBadge');
  if (node.type === 'article') {
    typeBadge.textContent = node.tipo === 'reglamento' ? 'Reglamento' : 'Artículo';
    typeBadge.className = 'detail-type-badge badge-art';
    document.getElementById('detailTitle').textContent = node.nombre.replace(/\*+/g,'').trim();
    let meta = '';
    if (node.titulo) meta += `<span style="color:var(--navy2);font-weight:600">${node.titulo}</span>`;
    if (node.capitulo) meta += ` · ${node.capitulo}`;
    document.getElementById('detailMeta').innerHTML = meta;
  } else {
    typeBadge.textContent = node.category ? node.category.charAt(0).toUpperCase() + node.category.slice(1) : 'Concepto';
    typeBadge.className = 'detail-type-badge badge-concept';
    document.getElementById('detailTitle').textContent = node.label;
    document.getElementById('detailMeta').textContent = node.description || '';
  }

  let bodyHtml = '';

  // Flag badge for articles
  if (node.type === 'article' && node.flag) {
    bodyHtml += `<div class="detail-sec">Estado</div><div><span class="flag-badge flag-${node.flag}">${FLAG_LABELS[node.flag]}</span></div>`;
  }

  // Article text
  if (node.type === 'article') {
    const html = editorState?.htmlTexts?.[id] || '';
    const plain = editorState?.texts?.[id] || '';
    if (html || plain) {
      bodyHtml += '<div class="detail-sec">Texto</div>';
      bodyHtml += `<div class="detail-text">${html || esc(plain)}</div>`;
    }
  }

  // Comments
  if (node.type === 'article') {
    const comments = editorState?.comments?.[id] || [];
    const open = comments.filter(c => !c.resolved);
    if (open.length > 0) {
      bodyHtml += `<div class="detail-sec">Comentarios (${open.length})</div>`;
      open.slice(0,5).forEach(c => {
        bodyHtml += `<div class="detail-comment"><div class="detail-comment-meta">${esc(c.author||'?')} · ${c.type||''}</div>${esc(c.text||'')}</div>`;
      });
    }
  }

  // Connected nodes
  const connectedIds = new Set();
  allEdges.forEach(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    if (sid === id) connectedIds.add(tid);
    if (tid === id) connectedIds.add(sid);
  });
  if (connectedIds.size > 0) {
    bodyHtml += `<div class="detail-sec">Conexiones (${connectedIds.size})</div>`;
    [...connectedIds].slice(0,20).forEach(cid => {
      const cn = allNodes.find(n => n.id === cid);
      if (!cn) return;
      const label = cn.type === 'article' ? cn.nombre.replace(/\*+/g,'').trim().substring(0,50) : cn.label;
      const dotColor = cn.type === 'article' ? (cn.color || ISSYS.azul) : (cn.color || ISSYS.gris);
      bodyHtml += `<div class="detail-conn-item" onclick="selectNode('${esc(cid)}')"><div class="conn-dot" style="background:${dotColor}"></div><span>${esc(label)}</span></div>`;
    });
    if (connectedIds.size > 20) bodyHtml += `<div style="font-size:11px;color:var(--muted);padding:4px 8px">+${connectedIds.size-20} más…</div>`;
  }

  bodyHtml += `<div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee"><a href="estatuto_editor.html" target="_blank" style="font-size:11.5px;color:var(--navy2);font-weight:600;text-decoration:none">↗ Abrir editor EER</a></div>`;

  document.getElementById('detailBody').innerHTML = bodyHtml;

  // Actions
  let actHtml = '';
  if (node.type === 'article') {
    actHtml += `<button class="detail-btn detail-btn-blue" onclick="window.open('estatuto_editor.html','_blank')">↗ Ver en editor</button>`;
  }
  if (canWrite()) {
    actHtml += `<button class="detail-btn detail-btn-green" onclick="startLinkMode('${esc(id)}')">+ Agregar relación</button>`;
    if (node.type === 'concept') {
      actHtml += `<button class="detail-btn detail-btn-red" onclick="confirmDeleteConcept('${esc(id)}')">Eliminar concepto</button>`;
    }
  }
  document.getElementById('detailActions').innerHTML = actHtml;

  // Highlight in graph
  highlightNode(id);
}

function closeDetail() {
  document.getElementById('detailPnl').classList.remove('open');
  selectedNodeId = null;
  clearHighlight();
  cancelLinkMode();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── CENTER / ZOOM ────────────────────────────────────────────────────────
function centerGraph() {
  const wrap = document.getElementById('canvasWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(0.8).translate(-W/2, -H/2));
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

// ─── LINKING MODE ─────────────────────────────────────────────────────────
function startLinkMode(sourceId) {
  linkSourceId = sourceId;
  linkingMode = true;
  document.body.classList.add('linking-mode');
  showToast('Hacé click en el nodo destino', 5000, 'linking');
}
function cancelLinkMode() {
  linkingMode = false;
  linkSourceId = null;
  pendingLinkTarget = null;
  document.body.classList.remove('linking-mode');
}
function handleLinkTarget(targetId) {
  if (targetId === linkSourceId) { showToast('No se puede vincular un nodo consigo mismo'); return; }
  pendingLinkTarget = targetId;
  const srcNode = allNodes.find(n => n.id === linkSourceId);
  const tgtNode = allNodes.find(n => n.id === targetId);
  const srcLabel = srcNode ? (srcNode.nombre || srcNode.label || linkSourceId).substring(0,30) : linkSourceId;
  const tgtLabel = tgtNode ? (tgtNode.nombre || tgtNode.label || targetId).substring(0,30) : targetId;
  document.getElementById('linkModalDesc').textContent = `De: "${srcLabel.replace(/\*+/g,'').trim()}"  →  A: "${tgtLabel}"`;
  document.getElementById('linkLabel').value = '';
  document.getElementById('linkModal').classList.add('open');
  document.body.classList.remove('linking-mode');
  linkingMode = false;
}
function closeLinkModal() {
  document.getElementById('linkModal').classList.remove('open');
  cancelLinkMode();
}
async function saveLinkModal() {
  if (!linkSourceId || !pendingLinkTarget) return;
  const label = document.getElementById('linkLabel').value.trim();
  const newLink = { id: crypto.randomUUID(), source: linkSourceId, target: pendingLinkTarget, label, manual: true };
  graphLinks.push(newLink);
  await saveLinksToFirebase();
  buildGraph();
  selectNode(linkSourceId);
  closeLinkModal();
  showToast('✓ Relación creada');
}

// ─── CONTEXT MENU (EDGE DELETE) ───────────────────────────────────────────
function showCtxMenu(x, y) {
  const m = document.getElementById('ctxMenu');
  m.style.left = x + 'px'; m.style.top = y + 'px';
  m.classList.add('open');
}
function closeCtxMenu() { document.getElementById('ctxMenu').classList.remove('open'); ctxEdgeData = null; }
async function deleteEdgeFromMenu() {
  if (!ctxEdgeData) return;
  const dbId = ctxEdgeData.dbId || ctxEdgeData.id;
  graphLinks = graphLinks.filter(l => l.id !== dbId);
  await saveLinksToFirebase();
  buildGraph();
  closeCtxMenu();
  showToast('✓ Relación eliminada');
}

// ─── ADD CONCEPT ──────────────────────────────────────────────────────────
function openAddConceptModal() {
  document.getElementById('conceptLabel').value = '';
  document.getElementById('conceptDesc').value = '';
  document.getElementById('conceptCat').value = 'normativa';
  document.getElementById('conceptModal').classList.add('open');
  setTimeout(() => document.getElementById('conceptLabel').focus(), 100);
}
function closeConceptModal() { document.getElementById('conceptModal').classList.remove('open'); }
async function saveConceptModal() {
  const label = document.getElementById('conceptLabel').value.trim();
  if (!label) { showToast('El label es obligatorio'); return; }
  const desc = document.getElementById('conceptDesc').value.trim();
  const cat  = document.getElementById('conceptCat').value;
  graphConcepts.push({ id: crypto.randomUUID(), label, description: desc, category: cat });
  await saveConceptsToFirebase();
  buildGraph();
  closeConceptModal();
  showToast('✓ Concepto agregado');
}

// ─── DELETE CONCEPT ───────────────────────────────────────────────────────
function confirmDeleteConcept(conceptId) {
  const node = allNodes.find(n => n.id === conceptId);
  document.getElementById('confirmTitle').textContent = 'Eliminar concepto';
  document.getElementById('confirmMsg').textContent = `¿Eliminás el concepto "${node?.label || conceptId}" y todas sus relaciones?`;
  document.getElementById('confirmOkBtn').onclick = () => doDeleteConcept(conceptId);
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('open'); }
async function doDeleteConcept(conceptId) {
  graphConcepts = graphConcepts.filter(c => c.id !== conceptId);
  graphLinks = graphLinks.filter(l => l.source !== conceptId && l.target !== conceptId);
  await Promise.all([saveConceptsToFirebase(), saveLinksToFirebase()]);
  buildGraph();
  closeDetail();
  closeConfirmModal();
  showToast('✓ Concepto eliminado');
}

// ─── SAVE POSITIONS ───────────────────────────────────────────────────────
let posSaveTimer = null;
function saveNodePosition(id, x, y) {
  graphPositions[id] = { x, y };
  clearTimeout(posSaveTimer);
  posSaveTimer = setTimeout(async () => {
    try { await window._fbSetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'positions'), graphPositions); }
    catch(e) { console.warn('Error guardando posiciones:', e); }
  }, 1500);
}

// ─── FIREBASE SAVE HELPERS ───────────────────────────────────────────────
async function saveConceptsToFirebase() {
  try { await window._fbSetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'concepts'), { items: graphConcepts }); }
  catch(e) { showToast('❌ Error guardando conceptos'); console.error(e); }
}
async function saveLinksToFirebase() {
  try { await window._fbSetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'links'), { items: graphLinks }); }
  catch(e) { showToast('❌ Error guardando relaciones'); console.error(e); }
}

// ─── SPINNER / TOAST ──────────────────────────────────────────────────────
function showSpinner(v) { document.getElementById('canvasOverlay').style.display = v ? 'flex' : 'none'; }
let toastTimer;
function showToast(msg, dur = 2200, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// ─── RESIZE ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { if (allNodes.length) renderGraph(); });

    const db   = getFirestore(app);
