<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Conceptos EER (prueba) — ISSyS · Chubut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;600;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Paleta ISSyS BrandBook 2023 */
  --issys-verde:#59B57E;--issys-azul:#4657A0;
  --navy:#4657A0;--navy2:#3a4a88;
  --accent:#59B57E;--accent2:#7dcf9a;
  --bg:#F4F4F4;--white:#fff;
  --border:#C6C6C6;--text:#1A1A1A;--muted:#878787;
  --green:#59B57E;--green-bg:#edf8f2;--green-bd:#9dd8b6;
  --red:#D32F2F;--red-bg:#fdf0ee;--red-bd:#e8a8a0;
  --blue-bg:#ebedf8;--blue:#4657A0;--blue-bd:#a0aacc;
  --warn:#b88a00;--warn-bg:#fdf8ed;--warn-bd:#e8d080;
  --purple:#6a309a;--purple-bg:#f5eeff;--purple-bd:#c8a8e8;
  --font-sans:'Encode Sans Condensed',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --shadow-sm:0 1px 3px rgba(70,87,160,.07);
  --shadow-md:0 4px 16px rgba(70,87,160,.11);
  --shadow-lg:0 8px 32px rgba(70,87,160,.18);
}
body{font-family:var(--font-sans);font-weight:300;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:0 24px;height:66px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 20px rgba(70,87,160,.45);flex-shrink:0;position:sticky;top:0;z-index:100;border-bottom:1.5px solid rgba(89,181,126,.2)}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent 0%,rgba(89,181,126,.6) 30%,rgba(89,181,126,.6) 70%,transparent 100%);pointer-events:none}
.hdr-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.hdr-info{flex:1}
.hdr-title{font-family:var(--font-sans);font-size:15px;font-weight:900;letter-spacing:.4px;color:#fff;line-height:1.2}
.hdr-sub{font-size:11px;opacity:.55;margin-top:3px;font-weight:400;letter-spacing:.1px}
.hdr-btns{display:flex;align-items:center;gap:6px;margin-left:auto}
.hdr-btn{position:relative;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.8);cursor:pointer;transition:all .18s;flex-shrink:0}
.hdr-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff;transform:translateY(-1px)}
.hdr-btn.accent{background:rgba(89,181,126,.18);border-color:rgba(89,181,126,.35);color:var(--accent2)}
.hdr-btn.accent:hover{background:rgba(89,181,126,.28);color:#fff}
.hdr-btn::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid rgba(255,255,255,.1);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s;z-index:1000}
.hdr-btn:hover::after{opacity:1}
.hdr-sep{width:1px;height:28px;background:rgba(255,255,255,.12);margin:0 2px}

/* DROPDOWN */
.hdr-dropdown{position:relative}
.hdr-dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(70,87,160,.2);z-index:500;min-width:200px;overflow:hidden;display:none}
.hdr-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;background:none;border:none;width:100%;text-align:left;white-space:nowrap;transition:background .12s;font-family:var(--font-sans)}
.hdr-dropdown-item svg{flex-shrink:0;opacity:.6}
.hdr-dropdown-item:hover{background:var(--blue-bg);color:var(--navy)}
.hdr-dropdown-item:hover svg{opacity:1}
.hdr-dropdown-sep{height:1px;background:var(--border);margin:3px 0}

/* LAYOUT */
.canvas-wrap{position:relative;width:100%;height:calc(100vh - 66px);overflow:hidden;background:var(--bg)}
#graphSvg{width:100%;height:100%;display:block}
.empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:28px 36px;box-shadow:var(--shadow-md);text-align:center;max-width:340px}
.empty-ico{font-size:36px;margin-bottom:8px}
.empty-title{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:5px}
.empty-desc{font-size:12px;color:var(--muted);line-height:1.6}

/* NAVEGACIÓN / ZOOM */
.graph-controls{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:40}
.gc-zoom{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden}
.gc-pad{display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden}
.gc-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#fff;border:none;color:var(--navy2);cursor:pointer;transition:background .15s}
.gc-btn:hover{background:var(--blue-bg)}
.gc-zoom .gc-btn:first-child{border-bottom:1px solid var(--border)}
.gc-pad-up{grid-area:1/2}
.gc-pad-left{grid-area:2/1}
.gc-pad-center{grid-area:2/2;color:var(--navy)}
.gc-pad-right{grid-area:2/3}
.gc-pad-down{grid-area:3/2}
.gc-btn::after{content:attr(data-tooltip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--navy);color:#fff;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.gc-btn:hover::after{opacity:1}

.node{transition:opacity .2s}
.node circle{cursor:pointer;stroke:#fff;stroke-width:2px}
.node text{pointer-events:none;user-select:none;font-size:10.5px;font-weight:600;fill:var(--text)}
.node.selected circle{stroke:var(--navy);stroke-width:3px}
.node.related circle{stroke:#E8821E;stroke-width:2.5px;stroke-opacity:.85}
.node.linking circle{stroke:var(--accent);stroke-width:3px;stroke-dasharray:3 2}
.node.dim{opacity:.15}

.edge{transition:opacity .2s}
.edge.dim{opacity:.08}
.edge-line{stroke:var(--navy);stroke-opacity:.45;stroke-width:1.8px;cursor:pointer}
.edge-line:hover{stroke:#D32F2F;stroke-opacity:.9}
.edge-label{font-size:9.5px;fill:var(--muted);pointer-events:none;user-select:none}

/* RELATIONS LIST */
.rel-sec-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid #eee}
.rel-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;background:#f8f9fc;margin-bottom:5px;font-size:12px}
.rel-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-item-edit,.rel-item-del{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--muted);font-size:11px;background:none;border:none}
.rel-item-edit:hover{background:var(--blue-bg);color:var(--navy)}
.rel-item-del:hover{background:#fdf0ee;color:#D32F2F}
.rel-empty{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.detail-btn-blue{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#ebedf8;color:var(--navy2);border:1px solid #a0aacc;margin-top:4px}
.detail-btn-blue:hover{background:#dde2f5}

/* DETAIL PANEL */
.detail-pnl{position:absolute;right:0;top:0;bottom:0;width:300px;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(70,87,160,.1);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:50}
.detail-pnl.open{transform:translateX(0)}
.detail-pnl-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);position:relative}
.detail-close{position:absolute;top:12px;right:12px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:#eef0fa;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px}
.detail-cat-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:8px;color:#fff}
.detail-title{font-size:14px;font-weight:900;color:var(--navy);padding-right:20px}
.detail-body{flex:1;overflow-y:auto;padding:14px 18px;font-size:13px;line-height:1.6;color:var(--text)}
.detail-actions{padding:12px 18px;border-top:1px solid var(--border)}
.detail-btn-red{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fdf0ee;color:#D32F2F;border:1px solid #e8a8a0}
.detail-btn-red:hover{background:#fae0dd}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(70,87,160,.45);z-index:2000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:26px 30px;width:420px;max-width:95vw;box-shadow:0 16px 48px rgba(70,87,160,.25)}
.modal-title{font-size:16px;font-weight:900;color:var(--navy);margin-bottom:18px}
.modal-field{margin-bottom:14px}
.modal-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:5px;display:block}
.modal-input,.modal-select,.modal-textarea{width:100%;font-family:var(--font-sans);font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;outline:none;color:var(--text)}
.modal-input:focus,.modal-select:focus,.modal-textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.08)}
.modal-textarea{font-family:var(--font-mono);font-size:12.5px;line-height:1.6;min-height:180px;resize:vertical}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-btn-cancel{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.modal-btn-cancel:hover{background:#f5f5f5}
.modal-btn-confirm{padding:8px 18px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.modal-btn-confirm:hover{background:var(--navy2)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:9000;pointer-events:none;max-width:360px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* AUTH OVERLAY */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(145deg,var(--navy) 0%,#3a4a88 50%,#2d3a70 100%);z-index:9999;display:flex;align-items:center;justify-content:center}
.boot-loader{position:fixed;inset:0;background:linear-gradient(145deg,var(--navy) 0%,#3a4a88 50%,#2d3a70 100%);z-index:9998;display:flex;align-items:center;justify-content:center}
.boot-spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:boot-spin .8s linear infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
.auth-box{background:#fff;border-radius:16px;width:380px;max-width:95vw;box-shadow:0 20px 60px rgba(70,87,160,.5);overflow:hidden}
.auth-header{background:var(--navy);padding:32px 40px 24px;text-align:center;border-bottom:2px solid rgba(89,181,126,.25)}
.auth-header img{width:54px}
.auth-title{font-size:16px;font-weight:900;color:#fff;margin-top:12px;line-height:1.25}
.auth-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:5px}
.auth-body{padding:28px 40px 36px;background:#fff}
.auth-field{margin-bottom:16px}
.auth-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;display:block}
.auth-input{width:100%;font-family:var(--font-sans);font-size:14px;padding:11px 14px;border:1px solid var(--border);border-radius:8px;outline:none;color:var(--text);background:#fff;transition:all .15s}
.auth-input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.1)}
.auth-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.auth-btn:hover{background:#4a9a6a}
.auth-btn:disabled{opacity:.45;cursor:not-allowed}
.auth-error{background:#fdf0ee;color:#D32F2F;border:1px solid #e8a8a0;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;margin-bottom:14px;display:none}
.auth-error.visible{display:block}

/* LECTOR/REVISOR: ocultar controles de edición */
body[data-role="lector"] .role-edit-only,
body[data-role="revisor"] .role-edit-only{display:none!important}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <img src="logo128x128_blanco.png" alt="ISSyS" class="hdr-logo">
  <div class="hdr-info">
    <div class="hdr-title">Mapa de Conceptos EER</div>
    <div class="hdr-sub">ISSyS · Chubut · sincronizado con Firebase</div>
  </div>
  <div class="hdr-btns">
    <button class="hdr-btn" data-tooltip="Volver al Estatuto" onclick="window.location.href='estatuto_editor.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="hdr-sep"></div>
    <button class="hdr-btn" data-tooltip="Centrar grafo" onclick="centerGraph()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></button>
    <button class="hdr-btn accent role-edit-only" id="addConceptBtn" data-tooltip="Agregar concepto" onclick="openAddConceptModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="hdr-btn accent role-edit-only" id="importMdBtn" data-tooltip="Importar Markdown" onclick="openImportMdModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></button>
    <div class="hdr-sep"></div>
    <div class="hdr-dropdown" id="userDropdown">
      <button class="hdr-btn" id="userBtn" data-tooltip="Mi cuenta" onclick="toggleUserDropdown(event)" style="font-size:15px;font-weight:500;letter-spacing:.5px;background:#59B57E;color:#fff">
        <span id="userInitials">??</span>
      </button>
      <div class="hdr-dropdown-menu" id="userDropdownMenu">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);min-width:200px">
          <div id="userMenuName" style="font-size:13px;font-weight:700;color:var(--text)"></div>
          <div id="userMenuEmail" style="font-size:11px;color:var(--muted);margin-top:2px"></div>
        </div>
        <button class="hdr-dropdown-item" onclick="doSignOut()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <svg id="graphSvg">
    <defs>
      <radialGradient id="grad-normativa" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#ebedf8"/><stop offset="100%" stop-color="#4657A0"/>
      </radialGradient>
      <radialGradient id="grad-organismo" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#f5eeff"/><stop offset="100%" stop-color="#6a309a"/>
      </radialGradient>
      <radialGradient id="grad-concepto" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#edf8f2"/><stop offset="100%" stop-color="#59B57E"/>
      </radialGradient>
      <radialGradient id="grad-persona" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#fdf8ed"/><stop offset="100%" stop-color="#b88a00"/>
      </radialGradient>
      <radialGradient id="grad-instrumento" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#e8f5f4"/><stop offset="100%" stop-color="#2d8f8f"/>
      </radialGradient>
      <radialGradient id="grad-entidad_colectiva" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#fdf1ea"/><stop offset="100%" stop-color="#c2410c"/>
      </radialGradient>
      <radialGradient id="grad-otro" cx="35%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#f2f2f2"/><stop offset="100%" stop-color="#878787"/>
      </radialGradient>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--navy)" fill-opacity=".7"/>
      </marker>
    </defs>
    <g id="graphRoot">
      <g id="edgeLayer"></g>
      <g id="nodeLayer"></g>
    </g>
  </svg>

  <!-- NAVEGACIÓN / ZOOM -->
  <div class="graph-controls">
    <div class="gc-zoom">
      <button class="gc-btn" data-tooltip="Acercar" onclick="zoomBy(1.3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <button class="gc-btn" data-tooltip="Alejar" onclick="zoomBy(1/1.3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    </div>
    <div class="gc-pad">
      <button class="gc-btn gc-pad-up" data-tooltip="Subir" onclick="panBy(0,-1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      <button class="gc-btn gc-pad-left" data-tooltip="Ir a la izquierda" onclick="panBy(-1,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <button class="gc-btn gc-pad-center" data-tooltip="Centrar y reiniciar zoom" onclick="centerGraph()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></button>
      <button class="gc-btn gc-pad-right" data-tooltip="Ir a la derecha" onclick="panBy(1,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>

<script type="module">

const firebaseConfig = {

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ─── ESTADO (localStorage como caché + Firestore como fuente compartida) ──
const STORAGE_KEY = 'eerGraphTestConcepts';
const LINKS_KEY   = 'eerGraphTestLinks';
// Paleta pastel ISSyS — { base: color sólido para texto/badge, bg: tono claro, grad: gradiente SVG del nodo }
const CAT_COLORS = {
  normativa: { base:'#4657A0', bg:'#ebedf8', grad:'url(#grad-normativa)' },
  organismo: { base:'#6a309a', bg:'#f5eeff', grad:'url(#grad-organismo)' },
  concepto:  { base:'#59B57E', bg:'#edf8f2', grad:'url(#grad-concepto)' },
  persona:   { base:'#b88a00', bg:'#fdf8ed', grad:'url(#grad-persona)' },
  instrumento: { base:'#2d8f8f', bg:'#e8f5f4', grad:'url(#grad-instrumento)' },
  entidad_colectiva: { base:'#c2410c', bg:'#fdf1ea', grad:'url(#grad-entidad_colectiva)' },
  otro:      { base:'#878787', bg:'#f2f2f2', grad:'url(#grad-otro)' }
};
const CAT_LABELS = { normativa:'Normativa', organismo:'Organismo', concepto:'Concepto', persona:'Persona', instrumento:'Instrumento', entidad_colectiva:'Entidad Colectiva', otro:'Otro' };

const SEED_CONCEPTS = [
  { label: 'Ley 3339', description: 'Ley Orgánica del ISSyS', category: 'normativa' },
  { label: 'Ley 24.241', description: 'Sistema Integrado de Jubilaciones y Pensiones', category: 'normativa' },
  { label: 'LCT', description: 'Ley de Contrato de Trabajo N° 20.744', category: 'normativa' },
  { label: 'ANSES', description: 'Administración Nacional de la Seguridad Social', category: 'organismo' },
  { label: 'Directorio ISSyS', description: 'Órgano de conducción superior del Instituto', category: 'organismo' },
  { label: 'Gerencia General', description: 'Máxima autoridad ejecutiva del ISSyS', category: 'organismo' },
  { label: 'Afiliado activo', description: 'Agente en actividad que aporta al sistema', category: 'concepto' },
  { label: 'Afiliado pasivo', description: 'Beneficiario jubilado o pensionado', category: 'concepto' },
  { label: 'BCRA', description: 'Banco Central de la República Argentina', category: 'organismo' },
  { label: 'Convenio Colectivo', description: 'Acuerdo paritario aplicable al personal', category: 'normativa' },
  { label: 'Escalafón', description: 'Sistema de clasificación y categorización del personal', category: 'concepto' },
  { label: 'Carrera administrativa', description: 'Progresión del agente en el sistema escalafonario', category: 'concepto' }
];

let concepts = loadConcepts();
let links = loadLinks();
let articleLinksByConcept = {}; // conceptId -> [{ artId, label }] — vínculos creados desde el editor
let articleCatalog = []; // [{ id, label }] — catálogo completo de artículos, publicado por el editor
let selectedId = null;
let svg, g, sim, zoomBehavior;
let currentUser = null;
let currentUserProfile = null;
let _editingConceptId = null;
let _editingLinkId = null;
let _nodePos = {}; // id -> {x, y, fixed} — preserva el layout entre renders

function loadConcepts() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function persistConcepts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(concepts));
  pushConceptsToFirebase();
}
function loadLinks() {
  try { return JSON.parse(localStorage.getItem(LINKS_KEY)) || []; }
  catch(e) { return []; }
}
function persistLinks() {
  localStorage.setItem(LINKS_KEY, JSON.stringify(links));
  pushLinksToFirebase();
}

// ─── FIREBASE — sync de conceptos y relaciones (colección eerGraph) ──────
async function pushConceptsToFirebase() {
  if (!window._fbDb) return;
  try {
    await window._fbSetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'concepts'), { items: concepts, _ts: Date.now() });
  } catch(e) { console.warn('Firebase: no se pudieron guardar los conceptos:', e.message); }
}
async function pushLinksToFirebase() {
  if (!window._fbDb) return;
  try {
    await window._fbSetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'links'), { items: links, _ts: Date.now() });
  } catch(e) { console.warn('Firebase: no se pudieron guardar las relaciones:', e.message); }
}
async function loadGraphFromFirebase() {
  if (!window._fbDb) return;
  try {
    const [conceptsSnap, linksSnap] = await Promise.all([
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'concepts')),
      window._fbGetDoc(window._fbDoc(window._fbDb, 'eerGraph', 'links'))
    ]);
    if (conceptsSnap.exists() && Array.isArray(conceptsSnap.data().items)) {
      concepts = conceptsSnap.data().items;
    } else if (canEdit() && !concepts.length) {
      concepts = SEED_CONCEPTS.map(c => ({ id: crypto.randomUUID(), ...c }));
      await pushConceptsToFirebase();
    }
    if (linksSnap.exists() && Array.isArray(linksSnap.data().items)) {
      links = linksSnap.data().items;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(concepts));
    localStorage.setItem(LINKS_KEY, JSON.stringify(links));
    await loadArticleLinksFromEditor();
    renderGraph();
    showToast('☁️ Datos cargados desde Firebase');
    const qpNode = new URLSearchParams(location.search).get('node');
    if (qpNode) {
      const c = concepts.find(c => c.id === qpNode);
      if (c) setTimeout(() => openDetail(c), 300);
    }
  } catch(e) {
    console.warn('Firebase: no se pudo cargar el grafo, usando datos locales:', e.message);
    showToast('⚠️ No se pudo conectar a Firebase — usando datos locales');
  }
}

// ─── VÍNCULOS CON ARTÍCULOS DEL ESTATUTO (editor) ──────────────────────────
// El editor (estatuto_editor.html) guarda en `eerEditor/state.graphLinks` el
// vínculo artículo → nodos del grafo, y publica en `eerEditor/state.articleCatalog`
// un catálogo liviano { id, label } de todos los artículos — lo leemos en modo
// solo-lectura para mostrar qué artículo referencia a cada nodo y para poder
// elegir un artículo cualquiera al asociarlo a una relación.
async function loadArticleLinksFromEditor() {
  articleLinksByConcept = {};
  articleCatalog = [];
  if (!window._fbDb) return;
  try {
    const snap = await window._fbGetDoc(window._fbDoc(window._fbDb, 'eerEditor', 'state'));
    if (snap.exists()) {
      const data = snap.data();
      const graphLinks = data.graphLinks || {};
      Object.entries(graphLinks).forEach(([artId, info]) => {
        (info.conceptIds || []).forEach(cid => {
          if (!articleLinksByConcept[cid]) articleLinksByConcept[cid] = [];
          articleLinksByConcept[cid].push({ artId, label: info.label || artId });
        });
      });
      if (Array.isArray(data.articleCatalog)) articleCatalog = data.articleCatalog;
    }
  } catch(e) {
    console.warn('No se pudieron cargar los vínculos de artículos del editor:', e.message);
  }
}
function populateLinkArticleDatalist() {
  document.getElementById('linkArticleDatalist').innerHTML =
    articleCatalog.map(a => `<option value="${escapeHtml(a.label)}">`).join('');
}
function renderArticleLinks(conceptId) {
  const box = document.getElementById('detailArticleLinks');
  const arts = articleLinksByConcept[conceptId] || [];
  if (!arts.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="rel-sec-title">Artículo vinculado</div>` + arts.map(a =>
    `<div class="rel-item"><span class="rel-item-label">📄 ${escapeHtml(a.label)}</span>
      <button class="rel-item-edit" title="Abrir en el editor" onclick="window.open('estatuto_editor.html?art=${a.artId}','_blank')">↗</button>
    </div>`).join('');
}

// ─── MODAL: AGREGAR / EDITAR CONCEPTO ───────────────────────────────────────
function openAddConceptModal() {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  _editingConceptId = null;
  document.getElementById('conceptModalTitle').textContent = 'Agregar concepto';
  document.getElementById('conceptModalConfirmBtn').textContent = 'Agregar';
  document.getElementById('conceptLabel').value = '';
  document.getElementById('conceptDesc').value = '';
  document.getElementById('conceptCat').value = 'normativa';
  document.getElementById('conceptModal').classList.add('open');
  setTimeout(() => document.getElementById('conceptLabel').focus(), 50);
}
function openEditConceptModal(id) {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  const c = concepts.find(c => c.id === id);
  if (!c) return;
  _editingConceptId = id;
  document.getElementById('conceptModalTitle').textContent = 'Editar concepto';
  document.getElementById('conceptModalConfirmBtn').textContent = 'Guardar';
  document.getElementById('conceptLabel').value = c.label;
  document.getElementById('conceptDesc').value = c.description || '';
  document.getElementById('conceptCat').value = c.category;
  document.getElementById('conceptModal').classList.add('open');
  setTimeout(() => document.getElementById('conceptLabel').focus(), 50);
}
function closeConceptModal() { document.getElementById('conceptModal').classList.remove('open'); _editingConceptId = null; }
function saveConceptModal() {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  const label = document.getElementById('conceptLabel').value.trim();
  if (!label) { showToast('El label es obligatorio'); return; }
  const description = document.getElementById('conceptDesc').value.trim();
  const category = document.getElementById('conceptCat').value;
  if (_editingConceptId) {
    const c = concepts.find(c => c.id === _editingConceptId);
    if (!c) { closeConceptModal(); return; }
    Object.assign(c, { label, description, category });
  } else {
    concepts.push({ id: crypto.randomUUID(), label, description, category });
  }
  const wasEditing = !!_editingConceptId;
  const editedId = _editingConceptId;
  persistConcepts();
  closeConceptModal();
  renderGraph();
  if (wasEditing && selectedId === editedId) openDetail(concepts.find(c => c.id === editedId));
  if (wasEditing) { showToast('✓ Concepto actualizado'); return; }
  showToast('✓ Concepto agregado');
}

// ─── DETALLE / ELIMINAR ────────────────────────────────────────────────────
function openDetail(c) {
  selectedId = c.id;
  const catColor = CAT_COLORS[c.category] || CAT_COLORS.otro;
  document.getElementById('detailCatBadge').textContent = CAT_LABELS[c.category] || c.category;
  document.getElementById('detailCatBadge').style.background = `linear-gradient(135deg, ${catColor.bg}, ${catColor.base})`;
  document.getElementById('detailTitle').textContent = c.label;
  document.getElementById('detailDesc').textContent = c.description || '(sin descripción)';
  document.getElementById('detailPnl').classList.add('open');
  renderArticleLinks(c.id);
  renderRelList();
  updateSelectionHighlight();
}
function closeDetail() {
  selectedId = null;
  document.getElementById('detailPnl').classList.remove('open');
  updateSelectionHighlight();
}
function deleteSelectedConcept() {
  if (!selectedId || !canEdit()) return;
  const id = selectedId;
  concepts = concepts.filter(c => c.id !== id);
  links = links.filter(l => l.source !== id && l.target !== id);
  persistConcepts();
  persistLinks();
  closeDetail();
  renderGraph();
  showToast('✓ Concepto eliminado');
}

// ─── RELACIONES ─────────────────────────────────────────────────────────
function renderRelList() {
  const list = document.getElementById('relList');
  const rel = links.filter(l => l.source === selectedId || l.target === selectedId);
  if (!rel.length) { list.innerHTML = '<div class="rel-empty">Sin relaciones todavía.</div>'; return; }
  list.innerHTML = rel.map(l => {
    const isSource = l.source === selectedId;
    const otherId = isSource ? l.target : l.source;
    const other = concepts.find(c => c.id === otherId);
    const arrow = isSource ? '→' : '←';
    const lbl = arrow + ' ' + (other?.label || '?') + (l.label ? ` (${l.label})` : '');
    const artChip = l.articleId
      ? `<button class="rel-item-edit" title="Abrir ${escapeHtml(l.articleLabel||'')} en el editor" onclick="window.open('estatuto_editor.html?art=${l.articleId}','_blank')">📄</button>`
      : '';
    const actions = canEdit()
      ? `<button class="rel-item-edit" onclick="openEditLinkModal('${l.id}')" title="Editar etiqueta">✎</button><button class="rel-item-del" onclick="deleteLink('${l.id}')" title="Eliminar">✕</button>`
      : '';
    return `<div class="rel-item"><span class="rel-item-label">${escapeHtml(lbl)}</span>${artChip}${actions}</div>`;
  }).join('');
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function openLinkModal() {
  if (!selectedId || !canEdit()) return;
  const sel = document.getElementById('linkTarget');
  const existing = concepts.filter(c => c.id !== selectedId)
    .map(c => `<option value="${c.id}">${escapeHtml(c.label)}</option>`).join('');
  sel.innerHTML = `<option value="__new__">+ Crear nuevo concepto…</option>` + existing;
  sel.selectedIndex = existing ? 1 : 0; // por defecto, vincular a uno existente si hay
  _editingLinkId = null;
  document.getElementById('linkModalTitle').textContent = 'Vincular conceptos';
  document.getElementById('linkModalConfirmBtn').textContent = 'Vincular';
  document.getElementById('linkTargetField').style.display = '';
  document.getElementById('linkTargetReadonly').style.display = 'none';
  document.getElementById('linkLabel').value = '';
  document.getElementById('linkArticle').value = '';
  document.getElementById('linkNewLabel').value = '';
  document.getElementById('linkNewDesc').value = '';
  document.getElementById('linkNewCat').value = 'concepto';
  populateLinkArticleDatalist();
  toggleLinkNewConceptFields();
  document.getElementById('linkModal').classList.add('open');
}
function toggleLinkNewConceptFields() {
  const isNew = document.getElementById('linkTarget').value === '__new__';
  document.getElementById('linkNewConceptFields').style.display = isNew ? '' : 'none';
  if (isNew) setTimeout(() => document.getElementById('linkNewLabel')?.focus(), 50);
}
function openEditLinkModal(linkId) {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  const l = links.find(l => l.id === linkId);
  if (!l) return;
  const otherId = l.source === selectedId ? l.target : l.source;
  const other = concepts.find(c => c.id === otherId);
  _editingLinkId = linkId;
  document.getElementById('linkModalTitle').textContent = 'Editar relación';
  document.getElementById('linkModalConfirmBtn').textContent = 'Guardar';
  document.getElementById('linkTargetField').style.display = 'none';
  document.getElementById('linkNewConceptFields').style.display = 'none';
  document.getElementById('linkTargetReadonly').style.display = '';
  const isSource = l.source === selectedId;
  document.getElementById('linkTargetReadonlyText').textContent = (isSource ? '→ ' : '← ') + (other?.label || '?');
  document.getElementById('linkLabel').value = l.label || '';
  document.getElementById('linkArticle').value = l.articleLabel || '';
  populateLinkArticleDatalist();
  document.getElementById('linkModal').classList.add('open');
  setTimeout(() => document.getElementById('linkLabel').focus(), 50);
}
function closeLinkModal() { document.getElementById('linkModal').classList.remove('open'); _editingLinkId = null; }
// Resuelve el texto tipeado/elegido en el campo "Artículo asociado" contra el
// catálogo cargado desde el editor. Devuelve null si el campo está vacío, o
// false si el texto no coincide con ningún artículo del catálogo.
function _resolveLinkArticle() {
  const input = document.getElementById('linkArticle').value.trim();
  if (!input) return null;
  const match = articleCatalog.find(a => a.label === input);
  return match || false;
}
function saveLinkModal() {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  const label = document.getElementById('linkLabel').value.trim();
  const articleMatch = _resolveLinkArticle();
  if (articleMatch === false) { showToast('⚠️ Seleccioná un artículo de la lista (o dejá el campo vacío)'); return; }
  if (_editingLinkId) {
    const l = links.find(l => l.id === _editingLinkId);
    if (!l) { closeLinkModal(); return; }
    l.label = label;
    l.articleId = articleMatch ? articleMatch.id : null;
    l.articleLabel = articleMatch ? articleMatch.label : '';
    persistLinks();
    closeLinkModal();
    renderRelList();
    renderGraph();
    showToast('✓ Relación actualizada');
    return;
  }
  let target = document.getElementById('linkTarget').value;
  if (!target) return;
  let createdNew = false;
  if (target === '__new__') {
    const newLabel = document.getElementById('linkNewLabel').value.trim();
    if (!newLabel) { showToast('⚠️ Ingresá un nombre para el nuevo concepto'); return; }
    const newConcept = {
      id: crypto.randomUUID(),
      label: newLabel,
      description: document.getElementById('linkNewDesc').value.trim(),
      category: document.getElementById('linkNewCat').value
    };
    concepts.push(newConcept);
    persistConcepts();
    target = newConcept.id;
    createdNew = true;
  }
  // Las relaciones son direccionales (source → target): se permite que también
  // exista la inversa (target → source) como una relación distinta, solo se
  // bloquea crear dos veces la misma dirección exacta.
  const exists = !createdNew && links.some(l => l.source === selectedId && l.target === target);
  if (exists) { showToast('Ya existe esa relación en esta dirección'); return; }
  links.push({
    id: crypto.randomUUID(), source: selectedId, target, label,
    articleId: articleMatch ? articleMatch.id : null,
    articleLabel: articleMatch ? articleMatch.label : ''
  });
  persistLinks();
  closeLinkModal();
  renderRelList();
  renderGraph();
  showToast(createdNew ? '✓ Concepto y relación creados' : '✓ Relación creada');
}
function deleteLink(linkId) {
  if (!canEdit()) return;
  links = links.filter(l => l.id !== linkId);
  persistLinks();
  renderRelList();
  renderGraph();
  showToast('✓ Relación eliminada');
}

// ─── IMPORTAR MARKDOWN ──────────────────────────────────────────────────────
// El encabezado H1 (#) ancla el concepto principal de la sección. Cada
// referencia [[Texto]] en párrafos o viñetas se vincula a ese concepto.
// Un encabezado H2-H6 (##) no crea nodo: su texto se usa como etiqueta de
// las relaciones creadas hasta el próximo encabezado.
function openImportMdModal() {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  document.getElementById('importMdText').value = '';
  document.getElementById('importMdCat').value = 'concepto';
  document.getElementById('importMdModal').classList.add('open');
  setTimeout(() => document.getElementById('importMdText').focus(), 50);
}
function closeImportMdModal() { document.getElementById('importMdModal').classList.remove('open'); }

function mdCleanLabel(s) { return s.replace(/^[*_`~]+|[*_`~]+$/g, '').trim(); }
function mdFindOrCreateConcept(label, category) {
  const norm = label.toLowerCase();
  const existing = concepts.find(c => c.label.trim().toLowerCase() === norm);
  if (existing) return { concept: existing, created: false };
  const concept = { id: crypto.randomUUID(), label, description: '', category };
  concepts.push(concept);
  return { concept, created: true };
}
function mdLinkExists(aId, bId) {
  return links.some(l => (l.source === aId && l.target === bId) || (l.source === bId && l.target === aId));
}

function importMarkdownToGraph() {
  if (!canEdit()) { showToast('No tenés permiso para editar el grafo'); return; }
  const raw = document.getElementById('importMdText').value;
  const category = document.getElementById('importMdCat').value;
  if (!raw.trim()) { showToast('Pegá texto en formato Markdown para importar'); return; }

  let mainConcept = null, relLabel = '';
  let newConcepts = 0, newLinks = 0, refsFound = 0;

  for (const rawLine of raw.split('\n')) {
    const line = rawLine.replace(/\r$/, '');
    if (!line.trim()) continue;

    const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
    if (headingMatch) {
      const level = headingMatch[1].length;
      const text = mdCleanLabel(headingMatch[2].replace(/:\s*$/, ''));
      if (level === 1) {
        const { concept, created } = mdFindOrCreateConcept(text, category);
        if (created) newConcepts++;
        mainConcept = concept;
        relLabel = '';
      } else {
        relLabel = text;
      }
      continue;
    }

    for (const m of line.matchAll(/\[\[([^\]]+)\]\]/g)) {
      const label = mdCleanLabel(m[1]);
      if (!label) continue;
      refsFound++;
      const { concept: node, created } = mdFindOrCreateConcept(label, category);
      if (created) newConcepts++;
      if (mainConcept && mainConcept.id !== node.id && !mdLinkExists(mainConcept.id, node.id)) {
        links.push({ id: crypto.randomUUID(), source: mainConcept.id, target: node.id, label: relLabel });
        newLinks++;
      }
    }
  }

  if (!mainConcept && !refsFound) { showToast('No se encontró ningún encabezado # ni referencia [[...]] en el texto'); return; }
  if (mainConcept && !refsFound) { showToast('Se creó el concepto principal pero no se encontraron referencias [[...]] para vincular'); }

  persistConcepts();
  persistLinks();
  closeImportMdModal();
  renderGraph();
  showToast(`✓ Importado: ${newConcepts} concepto(s) nuevo(s), ${newLinks} relación(es) nueva(s)`);
}

// ─── TEXTO ADAPTADO AL NODO ─────────────────────────────────────────────
function nodeRadius(label) {
  const len = (label || '').length;
  if (len <= 10) return 34;
  if (len <= 18) return 40;
  if (len <= 28) return 46;
  return 52;
}
function wrapLabel(label, maxChars) {
  const words = label.split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function wrapNodeLabel(label, r) {
  const maxChars = Math.max(7, Math.round(r * 0.3));
  const maxLines = 3;
  let lines = wrapLabel(label, maxChars);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    const last = lines[maxLines - 1];
    lines[maxLines - 1] = last.length > 2 ? last.slice(0, last.length - 1) + '…' : last + '…';
  }
  return lines;
}

// ─── GRAFO (d3 force, solo nodos de concepto) ──────────────────────────────
function renderGraph() {
  document.getElementById('emptyState').style.display = concepts.length ? 'none' : 'block';

  const svgEl = document.getElementById('graphSvg');
  const wrap  = document.getElementById('canvasWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  svg = d3.select(svgEl);
  g   = d3.select('#graphRoot');
  const nodeLayer = d3.select('#nodeLayer');
  const edgeLayer = d3.select('#edgeLayer');

  if (!zoomBehavior) {
    zoomBehavior = d3.zoom()
      .scaleExtent([0.25, 3])
      .filter(ev => !ev.target.closest('.node'))
      .on('zoom', ev => g.attr('transform', ev.transform));
    svg.call(zoomBehavior);
  }
  // Click en un área vacía del canvas (no sobre un nodo) deselecciona el nodo actual
  svg.on('click', ev => { if (ev.target === svgEl) closeDetail(); });

  const nodes = concepts.map(c => {
    const n = { ...c, r: nodeRadius(c.label) };
    const pos = _nodePos[c.id];
    if (pos) {
      n.x = pos.x; n.y = pos.y;
      if (pos.fixed) { n.fx = pos.x; n.fy = pos.y; }
    }
    return n;
  });
  const edges = links
    .filter(l => nodes.some(n => n.id === l.source) && nodes.some(n => n.id === l.target))
    .map(l => ({ ...l }));

  if (sim) sim.stop();
  sim = d3.forceSimulation(nodes)
    .force('charge', d3.forceManyBody().strength(-230))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(d => d.r + 22))
    .force('link', d3.forceLink(edges).id(d => d.id).distance(165).strength(0.6))
    .on('tick', ticked);

  const edgeSel = edgeLayer.selectAll('g.edge').data(edges, d => d.id);
  edgeSel.exit().remove();
  const edgeEnter = edgeSel.enter().append('g').attr('class', 'edge');
  edgeEnter.append('line').attr('class', 'edge-line').attr('marker-end', 'url(#arrow)');
  edgeEnter.append('text').attr('class', 'edge-label').attr('text-anchor', 'middle');

  const allEdgeSel = edgeLayer.selectAll('g.edge');
  allEdgeSel.select('text').text(d => (d.label || '') + (d.articleId ? ' 📄' : ''));
  allEdgeSel.select('line').on('click', (ev, d) => {
    if (canEdit() && confirm('¿Eliminar esta relación?')) deleteLink(d.id);
  });

  const nodeSel = nodeLayer.selectAll('g.node').data(nodes, d => d.id);
  nodeSel.exit().remove();
  const nodeEnter = nodeSel.enter().append('g').attr('class', 'node');
  nodeEnter.append('circle').attr('r', 34);
  nodeEnter.append('text').attr('text-anchor', 'middle');

  const allNodeSel = nodeLayer.selectAll('g.node');
  allNodeSel.select('circle').attr('r', d => d.r).attr('fill', d => (CAT_COLORS[d.category] || CAT_COLORS.otro).grad);
  allNodeSel.select('text').attr('fill', '#fff').each(function(d) {
    const lines = wrapNodeLabel(d.label, d.r);
    const lineHeight = 11;
    const startDy = -((lines.length - 1) / 2) * lineHeight + 4;
    const sel = d3.select(this);
    sel.selectAll('tspan').remove();
    lines.forEach((line, i) => {
      sel.append('tspan').attr('x', 0).attr('dy', i === 0 ? startDy : lineHeight).text(line);
    });
  });
  allNodeSel.on('click', (ev, d) => {
    ev.stopPropagation();
    if (d.id === selectedId) closeDetail(); else openDetail(d);
  });
  allNodeSel.call(d3.drag()
    .on('start', (ev, d) => { d.fx = d.x; d.fy = d.y; })
    .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; sim.alpha(0.3).restart(); })
    .on('end', (ev, d) => { _nodePos[d.id] = { x: d.fx, y: d.fy, fixed: true }; }));

  function ticked() {
    nodes.forEach(d => { _nodePos[d.id] = { x: d.x, y: d.y, fixed: d.fx != null }; });
    nodeLayer.selectAll('g.node').attr('transform', d => `translate(${d.x},${d.y})`);
    edgeLayer.selectAll('g.edge').select('line')
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const len = Math.hypot(dx, dy) || 1;
        return d.target.x - (dx / len) * (d.target.r + 4);
      })
      .attr('y2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const len = Math.hypot(dx, dy) || 1;
        return d.target.y - (dy / len) * (d.target.r + 4);
      });
    edgeLayer.selectAll('g.edge').select('text')
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2 - 4);
  }

  updateSelectionHighlight();
}

// Resalta el nodo seleccionado y sus relacionados sin recalcular el layout
function updateSelectionHighlight() {
  const relatedIds = new Set();
  if (selectedId) {
    links.forEach(l => {
      if (l.source === selectedId) relatedIds.add(l.target);
      if (l.target === selectedId) relatedIds.add(l.source);
    });
  }
  d3.select('#nodeLayer').selectAll('g.node')
    .classed('selected', d => d.id === selectedId)
    .classed('related', d => relatedIds.has(d.id))
    .classed('dim', d => !!selectedId && d.id !== selectedId && !relatedIds.has(d.id));
  d3.select('#edgeLayer').selectAll('g.edge')
    .classed('dim', d => !!selectedId && d.source.id !== selectedId && d.target.id !== selectedId);
}

function centerGraph() {
  if (sim) sim.alpha(1).restart();
  if (svg && zoomBehavior) svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
}

function zoomBy(factor) {
  if (svg && zoomBehavior) svg.transition().duration(200).call(zoomBehavior.scaleBy, factor);
}

function panBy(dx, dy) {
  if (svg && zoomBehavior) svg.transition().duration(200).call(zoomBehavior.translateBy, dx * 120, dy * 120);
}

window.addEventListener('resize', () => renderGraph());

// ─── TOAST ──────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, dur = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// ─── AUTH ───────────────────────────────────────────────────────────────
function canEdit() { return currentUserProfile && ['admin','editor'].includes(currentUserProfile.role); }

function initAuth() {
  window._fbOnAuthChanged(async user => {
    const bootLoader = document.getElementById('authBootLoader');
    if (bootLoader) bootLoader.style.display = 'none';
    if (user) {
      currentUser = user;
      try {
        const snap = await window._fbGetDoc(window._fbDoc(window._fbDb, 'users', user.uid));
        if (snap.exists()) {
          currentUserProfile = snap.data();
        } else {
          const usersSnap = await window._fbFirestore.getDocs(window._fbFirestore.collection(window._fbDb, 'users'));
          const role = usersSnap.empty ? 'admin' : 'lector';
          currentUserProfile = { email: user.email, name: user.email, role, active: true, createdAt: Date.now() };
          await window._fbSetDoc(window._fbDoc(window._fbDb, 'users', user.uid), currentUserProfile);
        }
      } catch(e) {
        console.error('Error cargando perfil:', e);
        currentUserProfile = { email: user.email, name: user.email, role: 'lector', active: true };
      }
      if (currentUserProfile.active === false) {
        showToast('❌ Tu cuenta está desactivada');
        await doSignOut();
        return;
      }
      document.getElementById('authOverlay').style.display = 'none';
      document.body.setAttribute('data-role', currentUserProfile.role || 'lector');
      updateUserBadge();
      await loadGraphFromFirebase();
    } else {
      currentUser = null;
      currentUserProfile = null;
      document.getElementById('userDropdownMenu').style.display = 'none';
      document.getElementById('authOverlay').style.display = 'flex';
    }
  });
}

async function doSignIn() {
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPassword').value;
  const btn   = document.getElementById('authBtn');
  const err   = document.getElementById('authError');
  if (!email || !pass) { showAuthError('Completá email y contraseña'); return; }
  btn.disabled = true; btn.textContent = 'Iniciando…';
  err.classList.remove('visible');
  try {
    await window._fbSignIn(email, pass);
  } catch(e) {
    const msgs = {
      'auth/user-not-found': 'Usuario no encontrado',
      'auth/wrong-password': 'Contraseña incorrecta',
      'auth/invalid-email': 'Email inválido',
      'auth/too-many-requests': 'Demasiados intentos. Esperá unos minutos.',
      'auth/invalid-credential': 'Email o contraseña incorrectos'
    };
    showAuthError(msgs[e.code] || e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
}
function showAuthError(msg) {
  const e = document.getElementById('authError');
  e.textContent = msg; e.classList.add('visible');
}
async function doSignOut() {
  try { await window._fbSignOut(); closeAllDropdowns(); }
  catch(e) { showToast('❌ Error al cerrar sesión'); }
}
function updateUserBadge() {
  const p = currentUserProfile;
  const name = (p.name || p.email).trim();
  document.getElementById('userMenuName').textContent = name;
  document.getElementById('userMenuEmail').textContent = p.email;
  const words = name.split(/\s+/);
  const initials = words.length >= 2
    ? (words[0][0] + words[words.length - 1][0]).toUpperCase()
    : words[0].substring(0, 2).toUpperCase();
  document.getElementById('userInitials').textContent = initials;
}

function toggleUserDropdown(e) {
  e.stopPropagation();
  const m = document.getElementById('userDropdownMenu');
  const isOpen = m.style.display === 'block';
  closeAllDropdowns();
  if (!isOpen) m.style.display = 'block';
}
function closeAllDropdowns() {
  document.getElementById('userDropdownMenu').style.display = 'none';
}
document.addEventListener('click', () => closeAllDropdowns());

// ─── BOOT ───────────────────────────────────────────────────────────────
renderGraph();
</script>
