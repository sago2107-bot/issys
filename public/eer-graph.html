<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Conceptos EER — ISSyS · Chubut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;600;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --issys-verde:#59B57E;--issys-azul:#4657A0;--issys-gris:#878787;--issys-gris-cl:#C6C6C6;--issys-amarillo:#F9D76B;
  --navy:#4657A0;--navy2:#3a4a88;--navy3:#5566b8;
  --accent:#59B57E;--accent2:#7dcf9a;
  --bg:#F4F4F4;--white:#fff;
  --border:#C6C6C6;--text:#1A1A1A;--muted:#878787;
  --green:#59B57E;--green-bg:#edf8f2;--green-bd:#9dd8b6;
  --red:#D32F2F;--red-bg:#fdf0ee;--red-bd:#e8a8a0;
  --blue-bg:#ebedf8;--blue:#4657A0;--blue-bd:#a0aacc;
  --warn:#b88a00;--warn-bg:#fdf8ed;--warn-bd:#e8d080;
  --purple:#6a309a;--purple-bg:#f5eeff;--purple-bd:#c8a8e8;
  --font-serif:'Lora',Georgia,serif;
  --font-sans:'Encode Sans Condensed',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --shadow-sm:0 1px 3px rgba(70,87,160,.07);
  --shadow-md:0 4px 16px rgba(70,87,160,.11);
  --shadow-lg:0 8px 32px rgba(70,87,160,.18);
}
body{font-family:var(--font-sans);font-weight:300;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 20px rgba(70,87,160,.45);position:relative;z-index:100;border-bottom:1.5px solid rgba(89,181,126,.2);flex-shrink:0}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent 0%,rgba(89,181,126,.6) 30%,rgba(89,181,126,.6) 70%,transparent 100%);pointer-events:none}
.hdr-logo{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.hdr-info{flex:1}
.hdr-title{font-family:var(--font-sans);font-size:14px;font-weight:900;letter-spacing:.4px;color:#fff;line-height:1.2}
.hdr-sub{font-size:10px;opacity:.5;margin-top:2px;font-weight:300}
.hdr-btns{display:flex;align-items:center;gap:5px;margin-left:auto}
.hdr-btn{position:relative;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:7px;color:rgba(255,255,255,.8);cursor:pointer;transition:all .18s;flex-shrink:0;font-family:var(--font-sans)}
.hdr-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff}
.hdr-btn.accent{background:rgba(89,181,126,.18);border-color:rgba(89,181,126,.35);color:var(--accent2)}
.hdr-btn::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid rgba(255,255,255,.1);color:#fff;padding:4px 9px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s;z-index:200}
.hdr-btn:hover::after{opacity:1}
.hdr-sep{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 2px}
.hdr-ver{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.3);white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block}

/* USER DROPDOWN */
.hdr-user-wrap{position:relative}
.hdr-avatar{width:36px;height:36px;border-radius:50%;background:rgba(89,181,126,.25);border:1.5px solid rgba(89,181,126,.4);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer;flex-shrink:0;font-family:var(--font-sans)}
.hdr-dropdown{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:200px;overflow:hidden;z-index:500;display:none}
.hdr-dropdown.open{display:block}
.hdr-dropdown-profile{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.hdr-dropdown-item{width:100%;display:flex;align-items:center;gap:9px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--text);background:none;border:none;cursor:pointer;font-family:var(--font-sans);text-align:left;transition:background .12s}
.hdr-dropdown-item:hover{background:var(--blue-bg);color:var(--navy2)}
.hdr-dropdown-item.danger{color:var(--red)}
.hdr-dropdown-item.danger:hover{background:var(--red-bg)}

/* ROLE BADGE */
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;line-height:1.7;font-family:var(--font-sans)}
.role-admin{background:rgba(106,48,154,.12);color:var(--purple);border:1px solid var(--purple-bd)}
.role-editor{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.role-revisor{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.role-lector{background:#eeeeee;color:var(--muted);border:1px solid var(--border)}

/* LAYOUT */
.app{display:flex;height:calc(100vh - 56px)}

/* LEFT PANEL */
.left-pnl{width:272px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.left-pnl-inner{flex:1;overflow-y:auto;padding:12px 14px 16px}
.left-pnl-inner::-webkit-scrollbar{width:4px}
.left-pnl-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.pnl-section{margin-bottom:14px}
.pnl-sec-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid #eee}
.search-box{display:flex;align-items:center;gap:7px;background:#f5f6fa;border:1px solid var(--border);border-radius:7px;padding:7px 10px;transition:all .15s}
.search-box:focus-within{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.08)}
.search-box svg{color:var(--muted);flex-shrink:0}
.search-input{border:none;outline:none;background:transparent;font-size:13px;flex:1;min-width:0;font-family:var(--font-sans);color:var(--text)}
.search-input::placeholder{color:var(--muted)}
.filter-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);padding:3px 0;cursor:pointer;user-select:none}
.filter-row input[type=checkbox]{accent-color:var(--navy);cursor:pointer;width:13px;height:13px;flex-shrink:0}
.radio-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);padding:3px 0;cursor:pointer;user-select:none}
.radio-row input[type=radio]{accent-color:var(--navy);cursor:pointer;width:13px;height:13px;flex-shrink:0}
.left-pnl-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.pnl-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid;font-family:var(--font-sans)}
.pnl-btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.pnl-btn-primary:hover{background:var(--navy2)}
.pnl-btn-secondary{background:var(--blue-bg);color:var(--navy2);border-color:var(--blue-bd)}
.pnl-btn-secondary:hover{background:#dde2f5}
.pnl-btn:disabled{opacity:.45;cursor:not-allowed}

/* CANVAS */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#graphSvg{width:100%;height:100%;display:block;cursor:default}
.canvas-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.spinner-box{background:#fff;border-radius:12px;padding:28px 36px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;gap:12px;font-family:var(--font-sans);color:var(--muted);font-size:13px}
.spinner-ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
.empty-state{background:#fff;border-radius:12px;padding:28px 36px;box-shadow:var(--shadow-md);text-align:center;max-width:360px}
.empty-ico{font-size:40px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;font-family:var(--font-sans)}
.empty-desc{font-size:12px;color:var(--muted);line-height:1.6}

/* DETAIL PANEL */
.detail-pnl{width:360px;flex-shrink:0;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;position:absolute;right:0;top:0;bottom:0;z-index:50;box-shadow:-4px 0 20px rgba(70,87,160,.1)}
.detail-pnl.open{transform:translateX(0)}
.detail-pnl-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5;flex-shrink:0}
.detail-close{position:absolute;top:12px;right:12px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:6px;cursor:pointer;color:var(--navy2);transition:all .15s;font-size:13px}
.detail-close:hover{background:#dde2f5}
.detail-type-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:8px;font-family:var(--font-sans)}
.badge-art{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.badge-concept{background:#eeeeee;color:var(--muted);border:1px solid var(--border)}
.detail-title{font-size:14px;font-weight:900;color:var(--navy);line-height:1.35;padding-right:20px}
.detail-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.detail-body{flex:1;overflow-y:auto;padding:14px 18px}
.detail-body::-webkit-scrollbar{width:4px}
.detail-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.detail-sec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid #eee}
.detail-text{font-family:var(--font-serif);font-size:13px;line-height:1.75;color:var(--text);max-height:200px;overflow-y:auto}
.detail-text::-webkit-scrollbar{width:3px}
.detail-text::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.flag-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;line-height:1.7}
.flag-pending{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.flag-review{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.flag-approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.detail-conn-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .12s;font-size:12.5px}
.detail-conn-item:hover{background:var(--blue-bg)}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.detail-comment{padding:8px 10px;background:#f8f9fc;border-radius:7px;border-left:2.5px solid var(--border);margin-bottom:6px;font-size:12px;line-height:1.5}
.detail-comment-meta{font-size:10px;color:var(--muted);margin-bottom:3px}
.detail-actions{padding:12px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.detail-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid;font-family:var(--font-sans);width:100%;justify-content:center}
.detail-btn-blue{background:var(--blue-bg);color:var(--navy2);border-color:var(--blue-bd)}
.detail-btn-blue:hover{background:#dde2f5}
.detail-btn-green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.detail-btn-green:hover{background:#d5f2e3}
.detail-btn-red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.detail-btn-red:hover{background:#fae0dd}
.detail-btn:disabled{opacity:.4;cursor:not-allowed}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font-sans);opacity:0;transition:all .3s;z-index:9000;pointer-events:none;max-width:360px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.linking{background:var(--issys-verde);color:#fff}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(70,87,160,.45);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:26px 30px;width:460px;max-width:95vw;box-shadow:0 16px 48px rgba(70,87,160,.25)}
.modal-title{font-size:16px;font-weight:900;color:var(--navy);margin-bottom:18px;font-family:var(--font-sans)}
.modal-field{margin-bottom:14px}
.modal-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:5px;display:block}
.modal-input{width:100%;font-family:var(--font-sans);font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;outline:none;color:var(--text);transition:all .15s}
.modal-input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.08)}
.modal-select{width:100%;font-family:var(--font-sans);font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;outline:none;color:var(--text);background:#fff;transition:all .15s;cursor:pointer}
.modal-select:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.08)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-btn-cancel{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .12s}
.modal-btn-cancel:hover{background:#f5f5f5}
.modal-btn-confirm{padding:8px 18px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .12s}
.modal-btn-confirm:hover{background:var(--navy2)}
.modal-btn-danger{background:var(--red);border-color:var(--red)}
.modal-btn-danger:hover{background:#b71c1c}

/* CONTEXT MENU */
.ctx-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lg);z-index:3000;overflow:hidden;display:none}
.ctx-menu.open{display:block}
.ctx-item{padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .12s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--blue-bg);color:var(--navy2)}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger:hover{background:var(--red-bg)}

/* AUTH OVERLAY */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(145deg,var(--navy) 0%,#3a4a88 50%,#2d3a70 100%);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:#fff;border-radius:16px;width:380px;max-width:95vw;box-shadow:0 20px 60px rgba(70,87,160,.5);overflow:hidden}
.auth-header{background:var(--navy);padding:28px 40px 20px;text-align:center;border-bottom:2px solid rgba(89,181,126,.25)}
.auth-header img{width:65px}
.auth-title{font-family:var(--font-serif);font-size:16px;font-weight:700;color:#fff;margin-top:10px;line-height:1.25}
.auth-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px}
.auth-body{padding:24px 40px 32px;background:#ffffff}
.auth-field{margin-bottom:14px}
.auth-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px;display:block;font-family:var(--font-sans)}
.auth-input{width:100%;font-family:var(--font-sans);font-size:14px;padding:10px 13px;border:1px solid var(--border);border-radius:8px;outline:none;color:var(--text);background:#fff;transition:all .15s}
.auth-input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(70,87,160,.1)}
.auth-btn{width:100%;padding:11px;background:var(--issys-verde);color:#fff;border:none;border-radius:4px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.auth-btn:hover{background:#4a9a6a}
.auth-btn:disabled{opacity:.45;cursor:not-allowed}
.auth-error{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;margin-bottom:12px;display:none;font-family:var(--font-sans)}
.auth-error.visible{display:block}

/* GRAPH SVG */
.node circle,.node polygon,.node rect{cursor:pointer;transition:opacity .2s}
.node text{pointer-events:none;user-select:none}
.edge{cursor:pointer}
.hull-group path{pointer-events:none}
.hull-label{pointer-events:none;user-select:none;font-family:var(--font-sans);fill:var(--navy);opacity:.55}
body.linking-mode{cursor:crosshair!important}
body.linking-mode *{cursor:crosshair!important}
body.linking-mode .detail-pnl *{cursor:default!important}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <img src="logo128x128_blanco.png" alt="ISSyS" class="hdr-logo">
  <div class="hdr-info">
    <div class="hdr-title">Mapa de Conceptos EER</div>
    <div class="hdr-sub">ISSyS · Chubut · <span id="hdrVer">cargando…</span></div>
  </div>
  <div class="hdr-btns">
    <button class="hdr-btn" data-tooltip="Recargar datos" onclick="reloadData()" id="reloadBtn">
      <svg id="reloadIco" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button class="hdr-btn" data-tooltip="Centrar grafo" onclick="centerGraph()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button class="hdr-btn" data-tooltip="Pantalla completa" onclick="toggleFullscreen()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <div class="hdr-sep"></div>
    <div class="hdr-user-wrap">
      <div class="hdr-avatar" id="userAvatar" onclick="toggleUserDropdown()">?</div>
      <div class="hdr-dropdown" id="userDropdown">
        <div class="hdr-dropdown-profile">
          <div id="userMenuName" style="font-size:13px;font-weight:700;color:var(--text)"></div>
          <div id="userMenuEmail" style="font-size:11px;color:var(--muted);margin-top:1px"></div>
          <div id="userMenuRole" class="role-badge" style="margin-top:5px"></div>
        </div>
        <button class="hdr-dropdown-item danger" onclick="closeUserDropdown();doSignOut()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>

<!-- APP LAYOUT -->
<div class="app">

  <!-- LEFT PANEL -->
  <aside class="left-pnl">
    <div class="left-pnl-inner">
      <!-- Search -->
      <div class="pnl-section">
        <div class="search-box">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="searchInput" placeholder="Buscar nodo…" oninput="onSearch(this.value)">
        </div>
      </div>
      <!-- Filters -->
      <div class="pnl-section">
        <div class="pnl-sec-title">Mostrar</div>
        <label class="filter-row"><input type="checkbox" id="filterArts" checked onchange="applyFilters()"> Artículos EER</label>

NDICIONES PARA EL INGRESO", "nombre": "Artículo 17º: REQUISITOS PARA EL INGRESO Y DESIGNACIÓN. Una vez finalizado el proceso de selección y previo al dictado del acto administrativo de designación, el postulante seleccionado deberá cumplim", "texto": "- Constancia de Caja de Ahorro en el Banco del Chubut S.A.\n\n- Certificado de aptitud psicofísica emitido por el Contralor Médico del ISSyS (Art. 14º inc. k, Ley XVIII- Nº 32).\n\n- Declaración Jurada de Incompatibilidad de Cargos, en cumplimiento del Art. 67º de la Constitución de la Provincia del Chubut y Art. 20º de la Ley I Nº 231 de Ética Pública.\n\n- Declaración Jurada sobre condición de beneficiario de jubilación, pensión o retiro (Nacional, Provincial o Municipal), conforme Art. 14º inc. j) de la Ley XVIII Nº 32.\n\n- Constancia de pago de la Cuota de Ingreso al sistema previsional (Art. 14 inc. i de la Ley XVIII Nº 32).\n\n- Certificación de servicios prestados en organismos públicos o privados.\n\n- Declaración Jurada de cargas de familia, adjuntando la documentación civil que acredite el vínculo (DNI de convivientes, Actas de Matrimonio, Nacimiento o Certificados de Convivencia).\n\nToda la documentación presentada estará sujeta a verificación de autenticidad. El falseamiento de cualquier dato u omisión de información será causal de exclusión automática del proceso de selección o de revocación del acto de designación por vicio en la causa.\n\n- Proceso de selección para el ingreso"}, {"id": "a11", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO I: CONDICIONES PARA EL INGRESO", "nombre": "Artículo 18º PRIORIDAD POR ENLACE FAMILIAR. En caso de fallecimiento de un agente que se encontrare en actividad en la Planta Permanente, el Instituto reconocerá un derecho de prioridad para el ingres", "texto": "Para el ejercicio de este derecho, los beneficiarios deberán cumplir indefectiblemente con los siguientes requisitos:\n\n- Idoneidad: Aprobar el proceso de selección y los exámenes de idoneidad técnica previstos para el cargo.\n\n- Mérito: En caso de igualdad de puntaje en el orden de mérito con otros postulantes externos, la prioridad será otorgada al familiar directo del agente fallecido.\n\n- Requisitos Generales: Cumplir con la totalidad de los requisitos de inscripción e ingreso establecidos en los Artículos 16º y 17º de este Estatuto.\n\n- Limitación de Beneficios: No ser beneficiario de pensión derivada del fallecimiento del agente, ni poseer otro cargo público o beneficio previsional de cualquier naturaleza.\n\n- Rango de Ingreso: La designación se efectuará exclusivamente en el Rango Inicial del Agrupamiento para el cual haya acreditado idoneidad. Plazo de solicitud (ej. 1 año)\n\nPrioridad por enlace familiar"}, {"id": "a12", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO I: CONDICIONES PARA EL INGRESO", "nombre": "Artículo 19º: PERIODO DE PRUEBA Y ESTABILIDAD* Toda designación en la Planta Permanente del Instituto tendrá carácter condicional durante los primeros DOCE (12) meses de servicio efectivo, conforme al", "texto": "Durante este lapso, el agente deberá acreditar su aptitud técnica y moral para el desempeño del cargo. La estabilidad definitiva prevista en el Artículo 14 bis de la Constitución Nacional se adquirirá automáticamente una vez cumplido el plazo de doce (12) meses, salvo que la autoridad competente, mediante resolución fundada y previa evaluación de desempeño desfavorable, disponga la revocación de la designación antes del vencimiento de dicho período.\n\nPeríodo de prueba"}, {"id": "a13", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO II. CARRERA ADMINISTRATIVA", "nombre": "Artículo 22º: TRASLADO* El agente que goce de estabilidad en la Planta Permanente podrá ser trasladado de su lugar de trabajo a un cargo vacante de igual categoría y con similares requisitos de idonei", "texto": "- Temporalidad: Para solicitar o disponer un traslado, se requerirá con carácter general un mínimo de tres (3) años de desempeño efectivo en el lugar de trabajo actual, salvo las excepciones previstas en la reglamentación.\n\n- Traslado a solicitud del agente: Podrá fundamentarse en razones de salud, integración familiar o motivos personales. En caso de razones de salud del agente o su grupo familiar, será obligatoria la intervención del Contralor Médico del Instituto.\n\n- Protección de la Unidad Familiar: El personal no podrá ser trasladado contra su voluntad cuando la medida produzca el desmembramiento del núcleo familiar o altere gravemente sus condiciones de vida de forma injustificada.\n\n- Perspectiva de Género y Protección Integral: Se garantizará el traslado inmediato y prioritario de las agentes víctimas de violencia (conforme Ley I Nº 635), priorizando su seguridad y la de su grupo familiar por sobre los requisitos de antigüedad o vacante previa.\n\n- Traslado por Razones de Servicio: Los traslados dispuestos por el Instituto deberán ser fundados por la Gerencia General, garantizando el consentimiento del agente si la medida implica cambio de residencia, salvo situaciones de emergencia operativa debidamente justificadas.\n\n- Traslado"}, {"id": "a14", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO II. CARRERA ADMINISTRATIVA", "nombre": "Artículo 23º: REASIGNACION DE FUNCIONES*  Se entiende por reasignación de funciones el acto administrativo mediante el cual un agente es reubicado en un puesto o tarea diferente dentro de la misma sed", "texto": "- Condiciones: La reasignación debe efectuarse dentro de la misma categoría y agrupamiento de revista del agente, respetando su nivel remunerativo.\n\n- Fundamento: Será dispuesta por la autoridad competente en virtud de necesidades del servicio, razones organizativas o para optimizar la eficiencia administrativa.\n\n- Límite: La reasignación no podrá ser utilizada como sanción disciplinaria encubierta ni implicar un menoscabo moral o una alteración sustancial de la naturaleza de las tareas que definen el agrupamiento del agente.\n\n- Reasignación de funciones"}, {"id": "a15", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO II. CARRERA ADMINISTRATIVA", "nombre": "Artículo 24º - PROMOCIÓN* La promoción consiste en el progreso horizontal del agente dentro de su agrupamiento mediante el acceso a rangos superiores. Es un derecho basado en la idoneidad, el desempeñ", "texto": "- Requisitos: Para acceder a la promoción, el agente deberá acreditar la antigüedad mínima en el rango que fije la reglamentación, poseer legajo disciplinario hábil y aprobar las instancias de evaluación de idoneidad.\n\n- Excepción por Transitoriedad: Para el primer proceso de promoción tras la vigencia de este Estatuto, se aplicará el régimen especial de antigüedad previsto en las Disposiciones Transitorias.\n\n- Suficiencia Presupuestaria: El otorgamiento de promociones estará sujeto a la disponibilidad financiera del Instituto. Quienes aprueben la evaluación y no accedan por falta de cupo, mantendrán prioridad para el ejercicio siguiente sin necesidad de nueva evaluación.\n\n- Reglamentación Promoción"}, {"id": "a16", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO II. CARRERA ADMINISTRATIVA", "nombre": "Artículo 25º: ASCENSO. El ascenso consiste en la cobertura de cargos vacantes de mayor nivel jerárquico dentro de la estructura orgánica del Instituto. Representa la progresión vertical del agente en ", "texto": "- Mecanismo de Selección: El ascenso se producirá exclusivamente mediante concurso de antecedentes y oposición, garantizando la igualdad de oportunidades, la transparencia y la idoneidad.\n\n- Carácter de la Convocatoria: Los concursos para ascensos serán inicialmente de carácter interno, destinados al personal de Planta Permanente. En caso de declararse desierto, el Instituto podrá disponer un llamado externo.\n\n- Idoneidad: La reglamentación establecerá los requisitos de formación, antigüedad y evaluación técnica necesarios para cada nivel jerárquico.\n\n- Reglamentación Ascenso"}, {"id": "a17", "titulo": "TITULO II: RELACIONES LABORABLES", "capitulo": "CAPÍTULO II. CARRERA ADMINISTRATIVA", "nombre": "Artículo 26º: REAGRUPAMIENTO. Se entiende por reagrupamiento el pase de un agente de un agrupamiento a otro distinto", "texto": "- El reagrupamiento podrá ser solicitado por el agente cuando acredite haber obtenido un título habilitante o formación académica superior relacionada con las funciones del agrupamiento al que aspira.\n\n- El cambio de agrupamiento no será automático por la sola presentación del título. El agente deberá someterse a las instancias de evaluación de conocimientos técnicos y aptitudes que fije la reglamentación para garantizar su competencia en el nuevo escalafón.\n\n- El reagrupamiento se producirá en la categoría de revista inicial del agrupamiento al que se aspira, o en la categoría que determine la reglamentación conforme a la equivalencia de méritos.\n\n- Reglamentación Reagrupamiento"}, {"id": "a18", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO I - GENERALIDADES", "nombre": "Artículo 27º: DERECHOS* Los agentes que se incorporen a la Planta Permanente del Instituto de Seguridad Social y Seguros, una vez cumplimentados los requisitos de ingreso y el período de prueba, gozar", "texto": "- De la Estabilidad y Carrera:\n\n- Estabilidad: Derecho a conservar el cargo, el rango y la localidad de revista, una vez obtenida la confirmación según el Artículo 19º de este Estatuto.\n\n- Carrera Administrativa: Derecho a la promoción y ascenso, basados en la idoneidad y el mérito, conforme a los mecanismos de evaluación previstos.\n\n- Reincorporación: Derecho a ser reintegrado al servicio activo en los casos previstos por la normativa vigente o por revocación de medidas administrativas.\n\n- Capacitación: Acceso a programas de formación, actualización y perfeccionamiento gestionados o administrados por el Instituto para el desarrollo profesional.\n\n- De la Retribución y Beneficios Económicos:\n\n- Justa Retribución: Percibir el haber correspondiente a su categoría y rango, Sueldo Anual Complementario, asignaciones familiares y bonificaciones vigentes.\n\n- Compensaciones: Derecho al cobro de horas extraordinarias, suplementos por servicios especiales y adicionales definidos por la normativa técnica.\n\n- Régimen Previsional: Acceso a los beneficios de jubilación y seguridad social de acuerdo con la Ley XVIII Nº 32.\n\n- De las Condiciones de Trabajo y Bienestar:\n\n- Seguridad e Higiene: Prestación de servicios en ambientes saludables, contando con los elementos de protección personal (EPP) y medidas de medicina del trabajo adecuadas a su función.\n\n- Asistencia Social: Cobertura sanitaria y social para el agente y sus derechohabientes.\n\n- Espacios de Bienestar: Acceso a áreas de refrigerio y descanso dentro de las dependencias donde se desempeñen las funciones, provistas por el Instituto.\n\n- Asueto Institucional: Goce de asueto administrativo el día 20 de noviembre en conmemoración de la \"Creación del ISSyS\". Si resultare inhábil, se trasladará al primer día hábil posterior.\n\n- De las Libertades y Garantías Jurídicas:\n\n- Debido Proceso: Derecho a un régimen disciplinario objetivo que garantice el derecho de defensa y la interposición de recursos administrativos.\n\n- Sumario Previo: Garantía de sumario administrativo para toda sanción que implique una suspensión mayor a diez (10) días.\n\n- Libertad de Conciencia y Asociación: Derecho a la libre agremiación, asociación y plena libertad de pensamiento, religión y opinión política, siempre que su ejercicio no interfiera con la naturaleza del servicio.\n\n- Derechos Políticos: Derecho a postularse a cargos electivos conforme a las Constituciones Nacional, Provincial y Cartas Orgánicas Municipales.\n\n- Información Pública: Derecho de acceso a la información pública institucional bajo los principios de transparencia.\n\n- Egreso:\n\n- Renuncia: Derecho a concluir la relación de empleo mediante la renuncia. El acto administrativo de aceptación podrá ser diferido o supeditado a la inexistencia o finalización de procesos sumarios en curso, conforme lo determine la reglamentación.\n\n- Reglamentación Renuncia"}, {"id": "a19", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO I - GENERALIDADES", "nombre": "Artículo 28º: DERECHOS PLANTA TEMPORARIA y POLÍTICA* Los agentes que pertenezcan a la Planta Temporaria y Política del Instituto, gozarán de los derechos enumerados en el Artículo 27º, con las siguien", "texto": "- Exclusiones: No gozarán de los derechos de Estabilidad, Carrera Administrativa (Promoción y Ascenso), ni Reincorporación Activa, dada la naturaleza transitoria o de confianza de su designación.\n\n- Régimen de Licencias: En cuanto al derecho de licencias (Inc. 10 del Art. 27º), se regirán exclusivamente por lo establecido en el Capítulo específico de Licencias o lo que determine su contrato de locación de servicios en particular.\n\n- Debido Proceso: Conservan el derecho al debido proceso y a la interposición de recursos, pero su desvinculación no requerirá sumario previo salvo que se invoque una causa disciplinaria que afecte su buen nombre y honor."}, {"id": "a20", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO I - GENERALIDADES", "nombre": "Artículo 29º: CONSERVACIÓN DE DERECHOS* El personal de Planta Permanente mantendrá su estabilidad y el derecho a la retención de su cargo y categoría de revista cuando fuera designado para desempeñar ", "texto": "- Participación en Carrera: La situación de retención de cargo no impedirá al agente participar en los procesos de promoción y concursos de ascenso, siempre que cumplimente los requisitos de idoneidad y legajo exigidos.\n\n- Obligación de Asunción Efectiva: En caso de resultar adjudicatario de un ascenso o promoción, el agente tendrá la obligación de asumir el cargo y/o rango de manera efectiva para que el beneficio se perfeccione.\n\n- Caducidad por Inasunción: Si el agente optara por permanecer en la función política o gremial y no tomara posesión efectiva de su nuevo destino dentro de los plazos que fije la reglamentación, la adjudicación caducará de pleno derecho, permaneciendo el agente en su situación de revista anterior sin derecho a reclamo de diferencias salariales ni reserva del nuevo cargo.\n\n- Reglamentación Conservación de Derechos"}, {"id": "a21", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO I - GENERALIDADES", "nombre": "Artículo 30º: JORNADA LABORAL* La jornada normal de labor para el personal del Instituto será de treinta y cinco (35) horas semanales, a razón de siete (7) horas diarias, de lunes a viernes.", "texto": "- Turnos Habituales: La prestación del servicio se cumplirá ordinariamente en los siguientes turnos:\n\n- Turno Mañana: De 07:00 a 14:00 horas.\n\n- Turno Tarde: De 13:00 a 20:00 horas.\n\n- Flexibilidad y Sedes Externas: La Gerencia General queda facultada para establecer horarios diferenciales, turnos rotativos o regímenes de jornada partida para el personal desempeñado en Delegaciones, dependencias operativas o áreas que, por la naturaleza de su función, requieran una cobertura horaria distinta a la habitual.\n\n- Personal Hotelero: El régimen horario del personal encuadrado en el Agrupamiento Hotelero se regirá por las disposiciones específicas establecidas en el capítulo correspondiente de este Estatuto, atendiendo a las particularidades de la actividad.\n\n- Descanso de Refrigerio: Dentro de la jornada laboral, el personal dispondrá de una pausa de veinte (20) minutos destinada a refrigerio, la cual deberá ser coordinada por el superior jerárquico para no afectar la atención al público ni la continuidad del servicio."}, {"id": "a22", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO I - GENERALIDADES", "nombre": "Artículo 31º: PERMISOS DE SALIDA* El personal podrá ser autorizado a ausentarse de su puesto de trabajo durante la jornada laboral por razones particulares, oficiales o excepcionales.", "texto": "- Autorización: La concesión de estos permisos es facultad del personal jerárquico responsable del área o de quien lo reemplace, siempre que la ausencia no afecte la normal prestación del servicio.\n\n- Responsabilidad: El agente autorizado deberá registrar obligatoriamente su salida y retorno mediante el sistema de control vigente. La omisión de este registro será considerada abandono de servicio.\n\n- Compensación: Las salidas de carácter particular generan la obligación de reposición horaria, conforme lo determine la reglamentación.\n\n- Reglamentación Jornada Laboral, Horarios, Control De Asistencia y Permiso de Salida"}, {"id": "a23", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO II - LICENCIAS", "nombre": "Artículo 33º. ENUMERACIÓN: Las licencias son:", "texto": "a) Licencia Anual Reglamentaria\n\nb) Licencia Por Enfermedad\n\nc) Licencias Por Examen\n\nd) Licencia Por Actividades Culturales\n\ne) Licencia Por Actividades Deportivas\n\nf) Licencia Por Atención De Familiar Enfermo\n\ng) Licencia Por Fallecimiento De Familiar\n\nh) Licencia Por Matrimonio\n\ni) Licencia Por Matrimonio De Hijo/A.\n\nj) Licencia Por Maternidad\n\nk) Licencia Por Paternidad\n\nl) Licencia Por Adopción\n\nll) Licencia Por Asuntos Particulares\n\nm) Licencia Extraordinaria Sin Goce De Haberes\n\nn) Licencia Por Desempeño en Cargo Político y/o Gremial\n\no) Donación De Sangre\n\np) Licencia Larga Evolución Por Enfermedad Profesional\n\nq) Licencia Por Violencia De Genero\n\nr) Asueto Y Feriado Nacional, Provincial Y Municipal\n\na) LICENCIA ANUAL REGLAMENTARIA El agente tiene derecho a un descanso anual remunerado por año vencido. La duración de la licencia se rinde por días hábiles, según la antigüedad acreditada al 31 de diciembre del año de devengamiento:\n\n- 1 año: 14 días hábiles.\n\n- 2 a 4 años: 18 días hábiles.\n\n- 5 a 6 años: 22 días hábiles.\n\n- 7 a 10 años: 24 días hábiles.\n\n- 11 a 15 años: 26 días hábiles.\n\n- 16 a 20 años: 28 días hábiles.\n\n- 21 a 25 años: 30 días hábiles.\n\n- 26 a 30 años: 32 días hábiles.\n\n- Más de 30 años: 35 días hábiles.\n\nPara acceder a este beneficio, los agentes deben acreditar al menos seis (6) meses de actividad al 31 de diciembre del año de devengamiento, otorgándose en caso contrario el proporcional al tiempo trabajado.\n\nLa licencia deberá ser usufructuada entre el 15 de diciembre del año de devengamiento y el 30 de diciembre del año siguiente, admitiéndose su fraccionamiento en hasta tres (3) períodos con un mínimo de cinco (5) días por cada uno. Aquellas licencias o fracciones no utilizadas al vencimiento de dicho plazo caducarán de pleno derecho, excepto cuando el usufructo hubiera sido interrumpido por razones imperiosas de servicio o suspendido por enfermedad (propia o de familiar), accidente laboral, fallecimiento de familiares directos, maternidad, paternidad o adopción..\n\nNo se admitirá la compensación económica de la licencia, salvo en los casos de extinción de la relación laboral, donde el agente tendrá derecho al cobro de hasta un máximo de dos (2) períodos completos anteriores y el proporcional en curso, liquidados a la remuneración vigente al momento del cese.\n\nPara determinar la duración del beneficio, se reconocerá la antigüedad previa en entidades públicas y privadas debidamente acreditada.\n\n\nb) LICENCIA POR ENFERMEDAD. Se entiende por Licencia por Enfermedad el derecho del agente a ausentarse temporalmente de su puesto de trabajo debido a una afección de salud que le impida el cumplimiento de sus funciones. El goce de esta licencia se divide según su duración y complejidad en:\n\n- Corta Evolución: Se otorgarán hasta treinta (30) días corridos por año calendario, continuos o alternados. Los primeros veinte (20) días se liquidarán con goce íntegro de haberes y los diez (10) días restantes al cincuenta por ciento (50%). "}, {"id": "a24", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO III - OBLIGACIONES Y PROHIBICIONES", "nombre": "Artículo 34º: OBLIGACIONES. El personal del Instituto debe cumplir de manera rigurosa las siguientes obligaciones:", "texto": "- Prestar servicio en forma regular y continua dentro del horario general o especial que, de acuerdo a la naturaleza de los servicios, se determine, poniendo toda su capacidad, dedicación y diligencia para el mejor desempeño y perfeccionamiento del Organismo.\n\n- Obedecer las órdenes del superior jerárquico, siempre que estas emanen de autoridad con jurisdicción y competencia, se refieran al servicio y sean reglamentariamente lícitas.\n\n- Mantener estricta reserva sobre los asuntos del servicio que por su naturaleza o por disposiciones especiales así lo requieran.\n\n- Cuidar los bienes del Instituto, velando por la economía del material y la debida conservación de los elementos confiados a su custodia, utilización o examen.\n\n- Observar en el servicio una conducta decorosa y digna, acorde a la función pública.\n\n- Proceder con cortesía, diligencia y ecuanimidad en el trato con el público.\n\n- Mantener vínculos cordiales, demostrar espíritu de cooperación, solidaridad y respeto para con los demás agentes del Instituto.\n\n- Cumplir los cursos de capacitación, perfeccionamiento y exámenes de competencia que se dispongan con la finalidad de optimizar el servicio.\n\n- Dar cuenta por la vía jerárquica correspondiente de toda irregularidad administrativa que llegare a su conocimiento.\n\n- Cumplir con los plazos y condiciones de permanencia en el cargo establecidos en el presente Estatuto para los casos de presentación de renuncia.\n\n- Excusarse de intervenir en todo asunto en el que su actuación pueda originar interpretaciones de parcialidad o concurra una incompatibilidad moral.\n\n- Declarar bajo juramento los cargos oficiales que desempeñe.\n\n- Declarar los servicios prestados y oficialmente certificados ante otros organismos para su cómputo y acreditación de derechos.\n\n- Consignar un domicilio legal ante el Instituto y mantenerlo actualizado, el cual subsistirá a todos los efectos legales mientras no sea formalmente modificado.\n\n- Declarar en las informaciones y sumarios administrativos ordenados por autoridad competente, siempre que no existieran impedimentos legales para hacerlo.\n\n- Requerir autorización previa y expresa de la superioridad para difundir por cualquier medio informes referentes al servicio o al Organismo.\n\n- Garantizar la equidad de género y la no discriminación en todas las tareas, comunicaciones y acciones realizadas en el ámbito laboral.\n\n- Utilizar vestimenta adecuada a la función y mantener una imagen decorosa durante la jornada de servicio."}, {"id": "a25", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO III - OBLIGACIONES Y PROHIBICIONES", "nombre": "Artículo 35º: PROHIBICIONES. Se prohíbe a todo agente del Instituto:", "texto": "- Percibir estipendios o recompensas ajenas a las normas vigentes, así como aceptar dádivas u obsequios ofrecidos en virtud de sus funciones o como retribución de actos inherentes a ellas.\n\n- Arrogarse atribuciones o funciones que no le correspondan legalmente.\n\n- Ser directa o indirectamente proveedor o contratista del Instituto de Seguridad Social y Seguros.\n\n- Retirar, ocultar o usar indebidamente elementos, equipos o documentos propiedad del Organismo.\n\n- Hacer circular o promover listas de suscripciones dentro del Instituto, salvo aquellas que cumplan un fin social y cuenten con autorización expresa de la superioridad.\n\n- Promover o aceptar homenajes y cualquier otro acto que implique sumisión o manifiesta obsecuencia hacia los superiores jerárquicos.\n\n- Usar las prerrogativas del cargo, el tiempo de servicio o los recursos del Instituto para realizar proselitismo político, gremial o sindical.\n\n- Patrocinar trámites o gestiones administrativas de terceros, se encuentren o no oficialmente a su cargo, dentro del ámbito del Instituto.\n\n- Difundir por cualquier medio información no oficializada o documentos internos que expongan cuestiones sensibles o privadas del Instituto y sus afiliados."}, {"id": "a26", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO IV - ACTIVIDAD, ANTIGÜEDAD, CALIFICACIÓN, RENUNCIA Y REINCORPORACIÓN", "nombre": "Artículo 36º: SITUACIÓN DEL PERSONAL. El agente podrá hallarse en alguna de las siguientes situaciones:", "texto": "- ACTIVIDAD: cuando preste servicios efectivos, se encuentre en uso de licencia con goce íntegro de haberes, haya sido incorporado a las Fuerzas Armadas por convocatoria especial, o se encuentre en uso de licencia por enfermedad sin goce de haberes.\n\n- INACTIVIDAD: cuando el agente se encuentre en uso de licencia extraordinaria sin goce de haberes por motivos particulares o sea sancionado con suspensión disciplinaria mayor a los treinta (30) días corridos."}, {"id": "a27", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO IV - ACTIVIDAD, ANTIGÜEDAD, CALIFICACIÓN, RENUNCIA Y REINCORPORACIÓN", "nombre": "Artículo 38º: CALIFICACIÓN. El Instituto implementará anualmente un sistema de calificación del personal, el cual deberá meritar los siguientes aspectos:", "texto": "- La idoneidad técnica y profesional en el desempeño de las tareas asignadas al cargo.\n\n- La conducta personal y la contracción al trabajo demostrada durante el período evaluado.\n\n- El cumplimiento de los regímenes de asistencia y puntualidad.\n\n- Las aptitudes y potencial para el ejercicio de cargos de mayor jerarquía o responsabilidad."}, {"id": "a28", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO IV - ACTIVIDAD, ANTIGÜEDAD, CALIFICACIÓN, RENUNCIA Y REINCORPORACIÓN", "nombre": "Artículo 39º: RENUNCIA. El personal tiene derecho a concluir la relación laboral mediante la presentación de su renuncia, bajo las siguientes condiciones:", "texto": "- El acto administrativo de aceptación de la renuncia deberá dictarse dentro de los treinta (30) días corridos contados a partir de su recepción oficial en el Departamento de Recursos Humanos.\n\n- El agente tiene la obligación de continuar prestando servicios hasta el vencimiento del citado plazo, salvo que la renuncia sea aceptada con anterioridad o que medie autorización expresa de la superioridad para cesar en sus funciones."}, {"id": "a29", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO IV - ACTIVIDAD, ANTIGÜEDAD, CALIFICACIÓN, RENUNCIA Y REINCORPORACIÓN", "nombre": "Artículo 40º: RENUNCIA CON PROCESO PENDIENTE. En los casos en que el agente se encuentre vinculado a procesos de investigación o procesos judiciales:", "texto": "- No se aceptará la renuncia de aquel agente que se encuentre sometido a sumario administrativo o proceso penal vinculado a sus funciones, hasta tanto recaiga resolución definitiva en las actuaciones respectivas.\n\n- En tales supuestos, la Presidencia del Instituto podrá autorizar al agente a cesar en la prestación de sus tareas habituales, perdiendo este el derecho a percibir contraprestación alguna, haberes o beneficios a partir de la fecha efectiva de dicho cese."}, {"id": "a30", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO IV - ACTIVIDAD, ANTIGÜEDAD, CALIFICACIÓN, RENUNCIA Y REINCORPORACIÓN", "nombre": "Artículo 41º: REINCORPORACIÓN. El personal que haya cesado en sus funciones por invalidez podrá solicitar su reincorporación al servicio conforme a las siguientes reglas:", "texto": "- La solicitud procederá cuando desaparezcan las causas que motivaron la invalidez y se produzca la limitación o cese del beneficio previsional por parte de la autoridad competente.\n\n- El agente será reincorporado en tareas compatibles con su aptitud psicofísica actual, en un puesto de igual categoría al que ocupaba al momento de su desvinculación."}, {"id": "a31", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 42º: PRINCIPIO DE LEGALIDAD. El personal del Instituto no podrá ser sancionado disciplinariamente ni privado de su empleo sino por las causas y procedimientos determinados en este Estatuto. L", "texto": "- Correctivas: consistentes en apercibimiento y suspensiones de hasta treinta (30) días corridos.\n\n- Expulsivas: consistentes en cesantía y exoneración.\n\nToda sanción debe aplicarse mediante Resolución fundada que contenga una clara exposición de los hechos, la indicación de las causas y el encuadramiento legal de la conducta."}, {"id": "a32", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 43º: SANCIONES CORRECTIVAS. Son causas para la aplicación de sanciones disciplinarias de tipo correctivo:", "texto": "- El incumplimiento del horario de trabajo fijado por las disposiciones vigentes.\n\n- La inasistencia injustificada que no exceda de cinco (5) días continuos o diez (10) días discontinuos por año calendario.\n\n- Las faltas de respeto hacia superiores, compañeros, subordinados o hacia el público.\n\n- La negligencia en el cumplimiento de las tareas o funciones, acreditada mediante informe del superior inmediato donde se detallen los incumplimientos."}, {"id": "a33", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 44º: INCUMPLIMIENTO DE HORARIO. El incumplimiento de horario se configura cuando el agente se presente pasada la hora de ingreso o se retire antes de la salida, bajo las siguientes reglas:", "texto": "- Se establece una tolerancia máxima diaria de cinco (5) minutos para la iniciación o finalización de la jornada.\n\n- Se permite un máximo de cinco (5) incumplimientos mensuales que sumados no superen sesenta (60) minutos; superados estos límites, se aplicará la escala sancionatoria.\n\n- Si los incumplimientos exceden diez (10) veces o noventa (90) minutos al mes, se computará una sanción por cada nuevo incumplimiento adicional.\n\n- La escala de sanciones por año calendario será:\n\n- 1ra vez, apercibimiento;\n\n- 2da y 3ra vez, un (1) día de suspensión;\n\n- 4ta a 6ta vez, dos (2) días;\n\n- 7ma a 9na vez, tres (3) días;\n\n- 10ma y 11va vez, cuatro (4) días;\n\n- 12va vez, cinco (5) días.\n\n- A partir de la 13va vez, se considerará causal de cesantía."}, {"id": "a34", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 45º: INASISTENCIAS INJUSTIFICADAS. Cuando el agente incurra en inasistencias injustificadas se aplicarán las siguientes sanciones progresivas por año calendario:", "texto": "- Primera vez, apercibimiento;\n\n- segunda vez, un (1) día de suspensión;\n\n- tercera y cuarta vez, dos (2) días;\n\n- quinta y sexta vez, tres (3) días;\n\n- séptima y octava vez, cuatro (4) días;\n\n- novena vez, cinco (5) días;\n\n- décima vez, seis (6) días;\n\n- La undécima inasistencia injustificada facultará la aplicación de la sanción de cesantía.\n\nEstas ausencias se sancionarán sin perjuicio del descuento de haberes por los días no trabajados. Las suspensiones se cumplirán a partir del día hábil siguiente a la notificación."}, {"id": "a35", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 47º: CAUSALES DE CESANTÍA. Se podrá sancionar con cesantía en los siguientes supuestos:", "texto": "- Inasistencias injustificadas que excedan los cinco (5) días continuos o diez (10) discontinuos en el año.\n\n- Acumulación de treinta (30) días de suspensión disciplinaria en los doce (12) meses anteriores.\n\n- Abandono del servicio sin causa justificada, previa intimación fehaciente.\n\n- Faltas reiteradas en el cumplimiento de tareas o falta grave de respeto al superior.\n\n- Incumplimiento o quebrantamiento reiterado de las obligaciones y prohibiciones establecidas en este Estatuto.\n\n- Incumplimiento intencional de órdenes lícitamente impartidas.\n\n- Acumulación de cargos incompatibles\n\n- Condena por delito doloso incompatible con la función."}, {"id": "a36", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 48º: CAUSALES DE EXONERACIÓN. Son causas de exoneración:", "texto": "- Sentencia condenatoria dictada respecto a delitos contra la Seguridad de la Nación, los Poderes Públicos, la Administración Pública o la fe pública.\n\n- Falta grave que perjudique materialmente al Instituto de manera intencional o por negligencia inexcusable."}, {"id": "a37", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPITULO V - RÉGIMEN DISCIPLINARIO", "nombre": "Artículo 49º: GARANTÍAS DEL PROCEDIMIENTO. Todo proceso disciplinario deberá garantizar:", "texto": "- El respeto a las reglas de causalidad, proporcionalidad, oportunidad y no duplicación de sanciones (non bis in idem).\n\n- El derecho de defensa del agente previo a la imposición de cualquier sanción.\n\n- La publicidad de las actuaciones para las partes involucradas, prohibiéndose el carácter secreto de los sumarios para los imputados."}, {"id": "a38", "titulo": "TÍTULO III: DERECHOS Y OBLIGACIONES DEL PERSONAL", "capitulo": "CAPÍTULO VI - CESE", "nombre": "Artículo 54º: CAUSALES DE CESE. El cese del agente, que implica la extinción de la relación laboral y la baja del padrón de revista, se producirá por las siguientes causas:", "texto": "- Por incompatibilidad o inhabilidad, conforme a las prohibiciones y requisitos establecidos en el presente Estatuto.\n\n- Por renuncia aceptada o vencimiento del plazo de ley para su aceptación.\n\n- Por fallecimiento del agente.\n\n- Por haber agotado el máximo de licencia por razones de enfermedad, cuando el grado de incapacidad psicofísica dictaminado por la Junta Médica permita el encuadre del agente en los beneficios jubilatorios por invalidez.\n\n- Por jubilación ordinaria o de carácter voluntario.\n\n- De oficio, cuando el agente haya alcanzado la edad y los requisitos de servicios exigidos por las leyes previsionales vigentes para obtener el beneficio jubilatorio.\n\n- Por exoneración o cesantía, impuestas mediante el procedimiento sumarial correspondiente y fundadas en las causales previstas en este Estatuto.\n\n- Por la situación de no confirmación o cese del agente en los términos del Artículo 7º de este cuerpo normativo."}, {"id": "a39", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO I - RETRIBUCIÓN FIJA", "nombre": "Artículo 56º SUELDO BÁSICO*  El Sueldo Básico de cada agente resultará de la aplicación de los coeficientes establecidos sobre el Salario Básico Inicial (SBI), conforme a su situación de revista en el", "texto": "- Por Ascenso: El coeficiente correspondiente a la Categoría jerárquica o no jerárquica asignada mediante acto administrativo.\n\n- Por Promoción: El coeficiente correspondiente al Rango alcanzado dentro de su respectivo agrupamiento, de acuerdo al régimen de carrera horizontal.\n\nDichos coeficientes se detallan en las tablas que, como Anexo I, forman parte integrante del presente Estatuto. En ningún caso un agente podrá percibir simultáneamente básicos correspondientes a Rango y Categoría, prevaleciendo siempre el que resulte superior."}, {"id": "a40", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO I - RETRIBUCIÓN FIJA", "nombre": "Artículo 60º: SUELDO ANUAL COMPLEMENTARIO. Todos los agentes del Instituto gozarán del derecho a percibir el Sueldo Anual Complementario, el cual se abonará en dos cuotas: la primera de ellas con venc", "texto": "- El importe a abonar en cada cuota semestral será equivalente al cincuenta por ciento (50%) de la mayor remuneración mensual devengada por todo concepto dentro del semestre respectivo.\n\n- El pago será proporcional al tiempo efectivamente trabajado en cada uno de los semestres. En caso de extinción de la relación laboral por cualquier causa, el agente o sus derechohabientes tendrán derecho a percibir la parte proporcional del Sueldo Anual Complementario devengada hasta el momento del cese."}, {"id": "a41", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO II - RETRIBUCIÓN VARIABLE", "nombre": "Artículo 61º: HORAS EXTRAS* Tareas en horario extraordinario o suplementario, son aquellas que resulta indispensable realizar como complemento de la labor que se ejecuta durante la jornada de trabajo.", "texto": "El personal no jerárquico del presente Estatuto que deba cumplir tareas que excedan el horario normal será retribuido por tareas en horas extraordinarias.\n\n- Jornada Diurna: es la que se cumple desde las siete (7) horas, hasta las veintidós (22) horas.\n\n- Jornada Nocturna: es la que se cumple desde las veintidós (22) horas hasta las (7) horas del día inmediato siguiente.\n\nEn ningún caso un agente podrá cumplir más de doce (12) horas continuas de labor.\n\nNo se asignará tarea en horario suplementario al agente que se encuentre en uso de Licencia de cualquier tipo, o que no haya prestado servicios por inasistencia o cualquier otra causa, ni a quienes gocen de reducción horaria.\n\nLos servicios extraordinarios serán liquidados de acuerdo con las siguientes especificaciones:\n\n- Con el cincuenta por ciento (50%) de recargo del total de la retribución sujeta a aportes las tareas realizadas durante la Jornada Diurna.\n\n- Con el ciento por ciento (100%) las tareas realizadas en día no laborable y en día laborable durante la Jornada Nocturna.\n\nLa retribución se liquidará mensualmente y se determinará por hora, dividiendo a tal efecto la suma total de los conceptos remunerativos bonificables del agente por 154 horas (22 días a razón de siete horas diarias).\n\nDentro del cálculo de las horas extras se computará únicamente el tiempo trabajado que excede la duración de la jornada laboral asignada al agente.\n\nNo procederá el pago de servicios extraordinarios en los casos de fracciones inferiores a una hora, las que en cambio podrán acumularse dentro del periodo autorizado para completar el lapso.\n\nLas horas extraordinarias sólo podrán disponerse cuando razones de imprescindible necesidad del servicio lo requiera, atendiendo a un criterio de estricta contención de gastos.\n\nLa percepción de retribuciones por servicios extraordinarios no excluirá el derecho a percibir viáticos correspondientes.\n\nEste concepto salarial se abonará al finalizar el mes en que se haya devengado."}, {"id": "a42", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 62º: ANTIGÜEDAD. La antigüedad de servicios del personal será bonificada con el dos con 50/100 por ciento (2,50%) por cada año de servicios activos en Organismos Previsionales, de Obra Social", "texto": "A los efectos del cómputo de antigüedad, se tomará como un (1) año de servicios las fracciones mayores de seis (6) meses, depreciándose las fracciones de seis (6) meses o menores, al 31 de diciembre de cada año calendario. Este adicional se computará al momento en que se modifique la antigüedad del agente, y se abonará desde el mes inmediato posterior. Se restará del cómputo de la antigüedad el periodo durante el cual el agente usufructúe licencia sin goce de haberes, salvo las excepciones previstas por ley."}, {"id": "a43", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 63º: ADICIONAL ZONA DESFAVORABLE* Los agentes comprendidos en el presente Estatuto Escalafón percibirán un adicional mensual en concepto de \"Zona Desfavorable\", destinado a compensar las vari", "texto": "- Treinta y uno por ciento (31%): Para los agentes que desempeñen funciones en la Comarca del Río Senguer y en el Golfo San Jorge.\n\n- Veintidós con cincuenta por ciento (22,50%): Para los agentes que se desempeñen en el resto de la Provincia del Chubut.\n\nEste adicional tiene carácter remunerativo y se percibirá mientras el agente preste servicios efectivos en dichas zonas o se encuentre en uso de licencias con goce de haberes."}, {"id": "a44", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 64º: ADICIONAL POR REFRIGERIO* Los agentes del Instituto de Seguridad Social y Seguros que desempeñen funciones de manera efectiva y permanente en la Delegación de Capital Federal, percibirán", "texto": "Dicho concepto se liquidará aplicando un veintidós con cincuenta por ciento (22,50%) sobre el SBI (Sueldo Básico Inicial) vigente para el personal del Instituto.\n\nEste adicional tiene carácter remunerativo y su objeto es compensar los gastos derivados de la prestación de servicios en dicha jurisdicción."}, {"id": "a45", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 65º: ADICIONAL POR TÍTULO* El personal del Instituto percibirá un adicional por título en reconocimiento a su formación académica formal. El importe de este beneficio se calculará aplicando s", "texto": "- Título Universitario de Grado: Treinta por ciento (30%).\n\n- Título Universitario de Pregrado: Veintiuno por ciento (21%).\n\n- Título Oficial Terciario no Universitario: Dieciséis por ciento (16%).\n\n- Título Secundario o equivalente: Doce por ciento (12%).\n\n- Certificado de Estudios Primarios: Ocho por ciento (8%).\n\n- Certificados de Estudios/Capacitación: Cuatro por ciento (4%). Este rubro es exclusivo para el personal de los agrupamientos de \"Servicios\" y \"Planta Hotelera\", siempre que los certificados sean expedidos por organismos gubernamentales o internacionales, con una duración no inferior a seis (6) meses o cien (100) horas cátedra.\n\nA los efectos determinados previamente, no podrá bonificarse más de un (1) título o certificado por agente, reconociéndose en todos los casos aquel al que le corresponda una bonificación mayor."}, {"id": "a46", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 66º: FUNCIÓN TÉCNICA* Los agentes que pertenezcan a los agrupamientos Técnicos, Profesional o Médico/Legal percibirán una retribución mensual en concepto de \"Función Técnica\".", "texto": "El monto de este adicional será el equivalente al cuatro por ciento (4%) del Sueldo Básico que ostente el agente. Este concepto es independiente y acumulable al \"Adicional por Título\" que le corresponda percibir al agente según su formación académica."}, {"id": "a47", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 67º: ADICIONAL COORDINACIÓN AUDITORÍA MÉDICA* Los agentes que cumplan la función de coordinación de auditoría médica, percibirán una retribución mensual equivalente al ocho por ciento (8%) de", "texto": "Este adicional premia la responsabilidad de supervisión y control técnico-médico, y será percibido mientras el agente ejerza efectivamente dicha función."}, {"id": "a48", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 68º: ADICIONAL POR PROLONGACIÓN DE JORNADA (MAYOR CARGA HORARIA). El personal no jerárquico que, por la naturaleza de sus tareas y funciones deba prestar servicios fuera de su jornada laboral", "texto": "Para el inicio de la percepción de este concepto, será requisito indispensable contar con un Acto Administrativo previo emanado por la autoridad competente que justifique la necesidad del servicio. Este adicional es incompatible con la percepción de cualquier otro concepto que reconozca servicios fuera de la jornada normal (como horas extraordinarias o dedicación exclusiva) para la misma tarea.\n\nEste adicional consistirá en el pago de hasta veintidós (22) horas simples por mes, calculadas sobre el Sueldo Básico que ostente el agente al momento de la prestación. La cantidad de horas a reconocer serán informadas mensualmente por el responsable del sector al Departamento de Desarrollo de RRHH y Personal."}, {"id": "a49", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 69º: ADICIONAL GUARDIA* l personal no jerárquico que preste funciones que requieran la atención telefónica obligatoria fuera del horario normal de labor (Guardias), recibirá un adicional en c", "texto": "Este adicional será de veintidós (22) horas simples por mes. Para tener derecho a la percepción del adicional, el mismo deberá ser aprobado por Resolución de Directorio y el responsable del sector deberá informar mensualmente al Departamento de Desarrollo de Recursos Humanos y Personal sobre los agentes afectados. Se deberá contar con una certificación e informe de ejecución del jefe inmediato superior, autorizado por Director Funcional y/o Delegado previo visto bueno de la Gerencia General.\n\nArtículo 35º: ADICIONAL CULMINACIÓN DE ESCALAFÓN. Se considera adicional por Culminación de Escalafón a la retribución que percibirá el agente no jerárquico que, habiendo cumplido los treinta (30) años de antigüedad únicamente en el Instituto de Seguridad Social y Seguros, continúa en el ejercicio de sus funciones.\n\nDicha bonificación será equivalente al ocho por ciento (8%) del SBI, entendiendo por este el establecido en el Artículo 20º del Estatuto Escalafón Este adicional se abonará al momento de cumplir la antigüedad requerida."}, {"id": "a50", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 70º: FALLO DE CAJA* Los agentes del Instituto que tengan a su cargo el manejo de valores y efectivo en ventanilla de manera habitual, percibirán un adicional no remunerativo en concepto de \"F", "texto": "Los importes se calcularán aplicando los siguientes porcentajes sobre el SBI (Sueldo Básico Inicial) vigente:\n\n- Grupo 1 (19,80% del SBI): Para el personal que desempeñe funciones en la Delegación Trelew.\n\n- Grupo 2 (13,20% del SBI): Para el personal que desempeñe funciones en Casa Central y Delegaciones de Comodoro Rivadavia, Puerto Madryn y Esquel.\n\n- Grupo 3 (6,60% del SBI): Para el personal que desempeñe funciones en el resto de las dependencias y bocas de expendio del ISSyS.\n\nLa liquidación se calculará tomando como base general la cantidad de veintidós (22) días hábiles del mes. Este adicional será percibido a mes vencido, sujeto al cumplimiento efectivo de las funciones e informado mensualmente por el responsable del área."}, {"id": "a51", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 71º: ADICIONAL MANEJO DE VALORES* Los agentes que cumplan funciones de Delegado/a, Tesorero/a, Subdelegado/a, Subtesorero/a, Administrador/a de Complejos Turísticos y Jefe/a de Boca de Expend", "texto": "El goce de licencias ordinarias o especiales con goce de haberes no implica la pérdida del derecho a percibir esta bonificación. No obstante, en caso de ausencias injustificadas o sanciones disciplinarias, se detraerá el proporcional correspondiente a la cantidad de días en los cuales el agente no cumplió efectivamente con la función o se encontró sancionado.\n\nArtículo 72º: BONIFICACIÓN POR FALLECIMIENTO. En caso de fallecimiento del/la agente, el Instituto abonará a sus derechohabientes los haberes correspondientes al mes en que se produce el deceso y una bonificación adicional equivalente a un (1) mes de su remuneración mensual, normal, regular y permanente, sin perjuicio de otras asignaciones que puedan corresponderles por ley.\n\nFallecimiento en Acto de Servicio: Si el fallecimiento se produce como consecuencia directa del cumplimiento de sus funciones, la bonificación adicional será equivalente a tres (3) meses de su remuneración mensual, normal, regular y permanente.\n\nEl resarcimiento se abonará a los derechohabientes según las condiciones establecidas en el régimen sucesorio civil vigente. Si existieran intereses contrapuestos o falta de determinación clara del derecho al cobro, el ISSyS podrá consignar judicialmente las sumas devengadas dentro de los treinta (30) días posteriores al deceso.\n\nFallecimiento de Cónyuge o Hijos: En caso de fallecimiento del cónyuge, conviviente o hijos por los que el/la agente percibía asignaciones familiares, el agente recibirá una bonificación mensual equivalente a dicha asignación durante los seis (6) meses siguientes al fallecimiento."}, {"id": "a52", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO III - ADICIONALES Y BONIFICACIONES", "nombre": "Artículo 73º: ADICIONAL POR VIVIENDA* El personal designado por el ISSyS para cubrir tareas en forma transitoria en un radio mayor de ochenta (80) kilómetros de su residencia habitual, y que no posea ", "texto": "No corresponderá percibir dicho adicional en los casos en que el Instituto ponga a disposición del agente una vivienda, plaza hotelera propia o alojamiento adecuado para su residencia en el lugar de destino. La percepción de este beneficio cesará automáticamente al finalizar la transitoriedad de la designación o cuando el agente fije su residencia definitiva en el lugar.\n\nArtículo 74º: INDEMNIZACIÓN POR TRASLADO. Se otorgará una bonificación por traslado a los agentes que deban cambiar su lugar de residencia habitual por estrictos motivos de servicio, siempre que el traslado implique un desplazamiento efectivo y permanente a una ubicación situada a más de ochenta (80) kilómetros de distancia y por una duración prevista superior a un (1) año.\n\nLa indemnización se compondrá de los siguientes conceptos:\n\n- Asignación por Arraigo: Una suma equivalente a dos (2) veces el SBI (Sueldo Básico Inicial) vigente al momento del traslado.\n\n- Asignación por Grupo Familiar: Una suma adicional equivalente al treinta y uno por ciento (31%) del SBI por cada miembro del grupo familiar a cargo del agente que se traslade efectivamente con él.\n\nEsta indemnización se abonará por única vez ante cada traslado dispuesto por la autoridad competente y no será percibida si el traslado es solicitado por el agente por razones particulares."}, {"id": "a53", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO IV - SUBROGANCIAS", "nombre": "Artículo 75º: SUBROGANCIA* Se define como Subrogancia la cobertura transitoria de un cargo vacante, llevada a cabo por un agente que reviste una Categoría inferior, asumiendo todas las responsabilidad", "texto": "Se define como cargo vacante aquel que no cuenta con un agente que se desempeñe en el mismo y se encuentre debidamente presupuestado. El agente que se desempeñe interinamente en un cargo, se trate de una vacante transitoria (por licencias de larga duración) o definitiva (por renuncia, cese o fallecimiento), tendrá derecho a percibir la diferencia de sueldo correspondiente, siempre que la designación haya sido dispuesta por el Directorio mediante acto administrativo y su desempeño efectivo sea superior a treinta (30) días corridos.\n\nNo se entenderá como vacante transitoria el goce de la Licencia Anual Reglamentaria por parte del titular del cargo. Los reemplazos serán bonificados con el importe que resulte de la diferencia entre la retribución que percibe el agente y la que le correspondería por la Categoría del cargo vacante a ocupar, manteniendo su Rango de revista. Esta retribución se percibirá desde la fecha de toma de posesión y hasta tanto se cubra el cargo mediante concurso de ascenso, se reincorpore el titular, o medie una nueva designación de la autoridad competente."}, {"id": "a54", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO V- OTRAS CONSIDERACIONES", "nombre": "Artículo 76º: PROTECCIÓN E INEMBARGABILIDAD DE LAS REMUNERACIONES. Las remuneraciones que debe percibir el/la agente del ISSyS no podrán ser cedidas ni afectadas a terceros por derecho o título alguno", "texto": "La remuneración solo es embargable hasta el veinte por ciento (20%) del monto neto, con excepción de las deudas por cuotas alimentarias o Litis-Expensas, las cuales serán determinadas por orden judicial específica.\n\nNo podrá deducirse, retenerse o compensarse suma alguna que rebaje el monto de las remuneraciones fuera de los límites legales. Todas las retenciones sobre los haberes que se practiquen en el ámbito del Instituto se regirán estrictamente por lo establecido en la Ley I - Nº 109 (antes Ley 3144) y sus modificatorias."}, {"id": "a55", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO V- OTRAS CONSIDERACIONES", "nombre": "Artículo 77º: ASIGNACIONES FAMILIARES* Los agentes comprendidos en el presente Estatuto Escalafón tendrán derecho a percibir las asignaciones familiares que la Provincia del Chubut establece para los ", "texto": "Este beneficio tiene carácter no remunerativo y no será afectado por ningún tipo de descuento, retención o embargo, salvo lo dispuesto en el Artículo 76º respecto a deudas alimentarias."}, {"id": "a56", "titulo": "TITULO IV -  DE LAS RETRIBUCIONES", "capitulo": "CAPÍTULO V- OTRAS CONSIDERACIONES", "nombre": "Artículo 78º: VIÁTICOS. Se denomina Viático a la asignación diaria destinada a compensar los gastos personales (alojamiento y comida) en que incurren los agentes debido a una Comisión de Servicio en u", "texto": "El valor del viático diario se fija en el uno por ciento (1%) del SBI (Sueldo Básico Inicial) vigente, aplicándose la siguiente escala según los gastos cubiertos por el Instituto:\n\n| Concepto | Porcentaje del Viático |\n| --- | --- |\n| Comisión + Comida + Alojamiento | 100% |\n| Comisión + Alojamiento | 75% |\n| Comisión + Comida | 50% |\n| Comisión (Gastos menores) | 25% |\n\nIncremento por Zona: Cuando la comisión de servicios se realice en la Ciudad Autónoma de Buenos Aires (CABA) o en la ciudad de Comodoro Rivadavia, los valores resultantes se incrementarán en un veinte por ciento (20%).\n\nLimitaciones:\n\n- No se percibirán viáticos cuando la comisión no supere el radio de ochenta (80) km del lugar habitual de trabajo o se realice íntegramente dentro del horario laboral sin necesidad de pernocte o comidas extra.\n\n- La actualización de los valores será automática conforme al incremento del SBI.\n\nEscala por Permanencia Prolongada: Cuando la comisión supere los catorce (14) días en una misma ubicación, se aplicará la siguiente escala acumulativa sobre el valor del viático:\n\n- De 1 a 14 días: 100%\n\n- De 15 a 29 días: 75%\n\n- De 30 a 59 días: 70%\n\n- De 60 días en adelante: 50%\n\nANEXO\n\nCategorías Jerárquicas\n\n|   |   |\n| --- | --- |\n| Categoría | Coeficiente |\n| J-I | 3.875 |\n| J-II | 3.440 |\n| J-III | 3.190 |\n| J-IV | 2.815 |\n| J-V | 2.500 |\n| J-VI | 2.250 |\n| J-VII | 2.000 |\n\nCategorías No Jerárquicas\n\n|   |   |\n| --- | --- |\n| Categoría | Coeficiente |\n| C-V | 1.820 |\n| C-IV | 1.690 |\n| C-III | 1.470 |\n| C-II | 1.280 |\n| C-I | 1.000 |\n| C-0 | 0.750 |\n\nAgrupamientos Administrativo y Servicios\n\n|   |   |\n| --- | --- |\n| Rango | Coeficiente |\n| Inicial | 0.750 |\n| A | 1.000 |\n| B | 1.280 |\n| C | 1.470 |\n\nAgrupamiento Técnico/Profesional\n\n|   |   |\n| --- | --- |\n| Rango | Coeficiente |\n| Inicial | 1.470 |\n| A | 1.690 |\n| B | 1.820 |\n| C | 2.000 |\n\nAgrupamiento Médico/Legal\n\n|   |   |\n| --- | --- |\n| Rango | Coeficiente |\n| Inicial | 2.000 |\n| A | 2.250 |\n| B | 2.500 |\n| C | 2.815 |\n\nI\n\nREGLAMENTACION"}, {"id": "a57", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DE PRIORIDAD POR ENLACE FAMILIAR", "nombre": "Artículo 4º: Orden de Prelación. El derecho será ejercido por una sola persona por cada agente fallecido, de acuerdo al siguiente orden:", "texto": "- Cónyuge o Conviviente supérstite.\n\n- Hijos o Hijas. En caso de concurrencia de aspirantes de igual grado, la Dirección de Secretaría General dará curso a quien sea designado de común acuerdo entre los derechohabientes mediante acta fehaciente."}, {"id": "a58", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN DEL RÉGIMEN DE PRIORIDAD POR ENLACE FAMILIAR", "nombre": "Artículo 5º: Articulación con el Proceso de Selección. El ejercicio de la prioridad no exime al postulante del cumplimiento de las etapas de evaluación. A tal efecto, se aplicará el procedimiento esta", "texto": "- Inscripción: El postulante deberá cumplimentar los requisitos de los Artículos 16º y 17º del Estatuto.\n\n- Evaluación de Idoneidad: Deberá aprobar el Examen de Oposición (Art. 8º y 9º del Reglamento de Selección) con el puntaje mínimo establecido.\n\n- Preferencia: A igualdad de idoneidad y puntaje con otros postulantes externos en un concurso abierto, la vacante será asignada al beneficiario del presente régimen."}, {"id": "a59", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN TRASLADOS", "nombre": "Artículo 1º: Modalidades de Traslado. El traslado de un agente podrá ser dispuesto bajo las siguientes modalidades:", "texto": "- A solicitud del agente: Por razones de salud, integración familiar o motivos personales fundados.\n\n- Por razones de servicio: Dispuestos por la Gerencia General ante necesidades operativas del Instituto.\n\n- Por protección integral (Perspectiva de Género): Medida de resguardo ante situaciones de violencia."}, {"id": "a60", "titulo": "REGLAMENTACIÓN", "capitulo": "REGLAMENTACIÓN TRASLADOS", "nombre": "Artículo 2º: Traslado por Razones Personales. El agente que invoque razones personales para solicitar un traslado deberá presentar una nota ante el Departamento Desarrollo de Recursos Humanos y Person", "texto": "- Se considerarán razones personal
