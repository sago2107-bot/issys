/* Croquis como imagen PNG (solo el plano): copia el SVG con los estilos ya resueltos (en tema claro)
   y lo dibuja en un canvas. */
async function descargarCroquisPNG() {
  const raiz = document.documentElement, tema = raiz.getAttribute("data-theme");
  const tmp = document.createElement("div");
  tmp.className = "croquis";
  tmp.style.cssText = "position:fixed;left:-10000px;top:0;width:880px";
  tmp.innerHTML = planoCroquis();
  document.body.appendChild(tmp);
  raiz.setAttribute("data-theme", "light");
  const props = ["fill", "stroke", "stroke-width", "stroke-linejoin", "font-family", "font-size", "font-weight", "text-anchor", "dominant-baseline"];
  const svg = tmp.querySelector("svg"), copia = svg.cloneNode(true);
  const orig = [svg, ...svg.querySelectorAll("*")], dest = [copia, ...copia.querySelectorAll("*")];
  orig.forEach((el, i) => {
    if (el.closest("defs")) return;
    const cs = getComputedStyle(el);
    dest[i].setAttribute("style", props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";"));
  });
  if (tema === null) raiz.removeAttribute("data-theme"); else raiz.setAttribute("data-theme", tema);
  tmp.remove();
  const [, , vw, vh] = copia.getAttribute("viewBox").split(/\s+/).map(Number);
  copia.setAttribute("width", vw); copia.setAttribute("height", vh);
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copia)], { type: "image/svg+xml" }));
  try {
    const img = new Image();
    await new Promise((ok, mal) => { img.onload = ok; img.onerror = mal; img.src = url; });
    const esc2 = 2, mrg = 20;
    const cv = document.createElement("canvas"), ctx = cv.getContext("2d");
    cv.width = (vw + mrg * 2) * esc2; cv.height = (vh + mrg * 2) * esc2;
    ctx.scale(esc2, esc2);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, vw + mrg * 2, vh + mrg * 2);
    ctx.drawImage(img, mrg, mrg, vw, vh);
    const a = document.createElement("a");
    a.download = "croquis-consultorios-3er-piso.png";
    a.href = cv.toDataURL("image/png");
    a.click();
  } catch { flotante("No se pudo generar la imagen del croquis.", true); }
  finally { URL.revokeObjectURL(url); }
}

function guardarFicha(sid, cambiar) {
  if (!puedeEditar()) { flotante("No tiene permiso para modificar el cronograma.", true); return; }
  const salas = clonar(estado.salas), s = salas.find(x => x.id === sid);
  if (!s) return;
  const f = s.ficha ? s.ficha : {};
  f.items = f.items || {};
  cambiar(f);
  s.ficha = {
    sup: typeof f.sup === "number" ? f.sup : null,
    lado: typeof f.lado === "number" ? f.lado : null,
    planta: f.planta === "baja" || f.planta === "alta" ? f.planta : "",
    items: Object.fromEntries(Object.entries(f.items).filter(([k, v]) => ITEMS_REQ[k] && valorValido(v))),
    agregados: [...new Set((f.agregados || []).filter(k => ITEMS_REQ[k] && !ITEMS_REQ[k][3]))],
    extra: (f.extra || []).filter(x => x && x.clave && x.nombre).map(x => valorValido(x.v) ? { clave: x.clave, nombre: x.nombre, v: x.v } : { clave: x.clave, nombre: x.nombre })
  };
  estado.salas = salas;   // reflejo inmediato; la base de datos confirma después
  guardar({ salas });
  render();
}
function marcarReq(el) {
  const val = { si: true, no: false, na: "na" }[el.dataset.val], id = el.dataset.item;
  if (el.dataset.amb === "e") {
    if (!puedeEditar()) return;
    const e = clonar(estado.estab || {});
    if (e[id] === val) delete e[id]; else e[id] = val;
    estado.estab = e;
    guardar({ establecimiento: e });
    render();
    return;
  }
  if (el.dataset.amb === "c") { guardarCompartidos(L => { const c = L.find(x => x.id === el.dataset.sala); if (c) { if (c.v === val) delete c.v; else c.v = val; } }); return; }
  if (id.startsWith("x:")) {
    guardarFicha(el.dataset.sala, f => { const x = (f.extra || []).find(x => "x:" + x.clave === id); if (x) { if (x.v === val) delete x.v; else x.v = val; } });
    return;
  }
  guardarFicha(el.dataset.sala, f => { if (f.items[id] === val) delete f.items[id]; else f.items[id] = val; });
}

/* Equipamiento compartido entre consultorios (documento del cronograma, campo «compartidos»). */
const cantComp = c => { const n = Number(c.cant); return Number.isInteger(n) && n >= 1 ? n : 1; };
function guardarCompartidos(cambiar) {
  if (!puedeEditar()) { flotante("No tiene permiso para modificar el cronograma.", true); return; }
  const L = clonar(estado.comp || []);
  cambiar(L);
  const ids = idsSalas(estado.salas);
  estado.comp = L.map(c => {
    const o = { id: c.id, nombre: String(c.nombre || "").trim() || "Sin nombre", ubicacion: String(c.ubicacion || "").trim(), item: ITEMS_REQ[c.item] ? c.item : "", salas: (c.salas || []).filter(x => ids.has(x)), cant: cantComp(c) };
    if (valorValido(c.v)) o.v = c.v;
    return o;
  });
  guardar({ compartidos: estado.comp });
  render();
}

let borr = null;
const filaVacia = () => ({ dias: [false, false, false, false, false, false], ini: "08:00", fin: "12:00", conf: false, sala: "=" });
function abrirProf(id) {
  const p = id ? estado.profs.find(x => x.id === id) : null;
  if (id && !p) return;
  if (p) {
    const g = new Map();
    for (const b of p.bloques) {
      const s = tieneSala(b) ? b.sala : "=";
      const k = [b.ini, b.fin, b.conf ? 1 : 0, s].join("|");
      if (!g.has(k)) g.set(k, { ...filaVacia(), ini: aInput(b.ini), fin: aInput(b.fin), conf: !!b.conf, sala: s });
      g.get(k).dias[b.dia] = true;
    }
    const ids = idsSalas(estado.salas);
    borr = { id: p.id, nombre: p.nombre, corto: p.corto || "", especialidad: p.especialidad || "", sala: ids.has(p.sala) ? p.sala : "", filas: [...g.values()] };
    if (!borr.filas.length) borr.filas.push(filaVacia());
  } else borr = { id: null, nombre: "", corto: "", especialidad: "", sala: "auto", filas: [filaVacia()] };
  borr.verSalas = borr.filas.some(f => f.sala !== "=");
  borr.errores = [];

function profDeBorrador() {
  const bloques = [];
  for (const f of borr.filas) {
    const ini = deInput(f.ini), fin = deInput(f.fin);
    f.dias.forEach((on, d) => { if (on && !isNaN(ini) && !isNaN(fin) && ini < fin) bloques.push({ dia: d, ini, fin, conf: !!f.conf, ...(f.sala !== "=" ? { sala: f.sala } : {}) }); });
  }
  return { id: borr.id || "__nuevo__", nombre: borr.nombre, corto: borr.corto, especialidad: borr.especialidad, sala: borr.sala === "auto" ? "" : borr.sala, bloques };
}
function opcionesSala(valor, conAuto, t, otros, ids) {
  let h = conAuto ? `<option value="auto"${valor === "auto" ? " selected" : ""}>Asignar automáticamente</option>` : "";
  for (const s of estado.salas) {
    const libre = t && t.bloques.length ? (conflictosEn(t, s.id, otros, ids).length ? " · se superpone" : " · libre") : "";
    h += `<option value="${esc(s.id)}"${valor === s.id ? " selected" : ""}>${esc(s.nombre)}${libre}</option>`;
  }
  return h + `<option value=""${valor === "" ? " selected" : ""}>Sin asignar</option>`;
}
function pistaSala() {
  const t = profDeBorrador();
  if (!t.bloques.length) return { txt: "Cargue al menos un horario para ver en qué consultorios entra.", mal: false };
  const ids = idsSalas(estado.salas), otros = estado.profs.filter(x => x.id !== borr.id);
  const eleg = salasElegibles(t, estado.salas);
  const libres = eleg.filter(sid => !conflictosEn(t, sid, otros, ids).length);
  const exclusivo = eleg.length && estado.salas.find(s => s.id === eleg[0]).tipo === "exclusivo";
  if (borr.sala === "auto") {
    if (libres.length) return { txt: `Se asignará a ${nombreSala(libres[0], estado.salas)}.${libres.length > 1 ? " También entra en: " + libres.slice(1).map(s => nombreSala(s, estado.salas)).join(", ") + "." : ""}`, mal: false };
    return { txt: `No entra completo en ningún consultorio ${exclusivo ? "exclusivo de su especialidad" : "general"}. Se guardará sin asignar; luego puede usar «Reasignar consultorios».`, mal: true };
  }
  if (!borr.sala) return { txt: libres.length ? `Entra sin superposiciones en: ${libres.map(s => nombreSala(s, estado.salas)).join(", ")}.` : "No entra completo en ningún consultorio sin mover a otros profesionales.", mal: !libres.length };
  const cs = conflictosEn(t, borr.sala, otros, ids);
  const sala = estado.salas.find(s => s.id === borr.sala);
  const partes = [];
  if (cs.length) { const c = cs[0]; partes.push(`Se superpone con ${nombreCorto(c.q)} (${DIAS[c.b.dia].toLowerCase()} ${rango(Math.max(c.b.ini, c.c.ini), Math.min(c.b.fin, c.c.fin))})${cs.length > 1 ? ` y ${cs.length - 1} horario${cs.length > 2 ? "s" : ""} más` : ""}.`); }
  if (sala && sala.tipo === "exclusivo" && norm(sala.especialidad || sala.nombre) !== norm(t.especialidad)) partes.push(`${sala.nombre} es exclusivo de ${sala.especialidad || sala.nombre}.`);
  const inc = sala && sala.tipo !== "exclusivo" ? incumpleEdilicio(sala, t.especialidad) : [];
  if (inc.length) partes.push(`${sala.nombre} no reúne requisitos edilicios${t.especialidad ? " de " + t.especialidad : ""}: ${inc.map(f => detalleFalta(f, sala.ficha)).join("; ")}.`);
  if (!partes.length) return { txt: "Sin superposiciones en este consultorio.", mal: false };
  if (libres.length) partes.push(`Entra libre en: ${libres.map(s => nombreSala(s, estado.salas)).join(", ")}.`);
  return { txt: partes.join(" "), mal: true };
}

function guardarProf() {
  const er = [];
  if (!borr.nombre.trim()) er.push("Falta el nombre del profesional.");
  if (!borr.especialidad.trim()) er.push("Falta la especialidad.");
  borr.filas.forEach((f, i) => {
    const ini = deInput(f.ini), fin = deInput(f.fin), n = borr.filas.length > 1 ? ` (horario ${i + 1})` : "";
    if (!f.dias.some(Boolean)) er.push(`Marque al menos un día${n}.`);
    if (isNaN(ini) || isNaN(fin)) er.push(`Complete la hora de inicio y de fin${n}.`);
    else if (ini >= fin) er.push(`La hora de fin debe ser posterior a la de inicio${n}.`);
  });
  const t = profDeBorrador();
  if (!er.length) for (let i = 0; i < t.bloques.length; i++) for (let j = i + 1; j < t.bloques.length; j++)
    if (solapa(t.bloques[i], t.bloques[j])) { er.push(`Dos horarios del mismo profesional se superponen el ${DIAS[t.bloques[i].dia].toLowerCase()}.`); i = j = 1e9; }
  borr.errores = er;
  if (er.length) { pintarErrores(); return; }
  const ids = idsSalas(estado.salas), otros = estado.profs.filter(x => x.id !== borr.id);
  let aviso = "";
  if (borr.sala === "auto") {
    const libres = salasElegibles(t, estado.salas).filter(sid => !conflictosEn(t, sid, otros, ids).length);
    t.sala = libres[0] || "";
    if (!t.sala) aviso = "No entró en ningún consultorio sin superposiciones. Use «Reasignar consultorios».";
  }
  t.id = borr.id || nuevoId();
  guardar({ profs: [t] });
  $("#dlgProf").close();
  flotante(aviso || (borr.id ? "Cambios guardados." : `${nombreCorto(t)} quedó en ${nombreSala(t.sala, estado.salas)}.`), !!aviso);
}

/* ---- Acciones ---- */
async function reasignar() {
  const r = autoAsignar(estado.profs, estado.salas);
  const ids = idsSalas(estado.salas);
  const cambios = r.profs.filter(n => JSON.stringify(limpiar(n)) !== JSON.stringify(limpiar(estado.profs.find(p => p.id === n.id))));
  if (!cambios.length) {
    const an = analizar(estado.profs, estado.salas);
    if (r.sinLugar.length) flotante(`No hay consultorio libre para ${r.sinLugar.join(", ")}: en ese horario hay más profesionales que consultorios disponibles.`, true);
    else if (an.choques.length || an.sinAsignar.length) flotante("No se encontró una distribución mejor que la actual.", true);
    else flotante("La asignación actual ya es válida; no hay nada que mover.");
    return;
  }
  const li = cambios.map(n => {
    const v = estado.profs.find(p => p.id === n.id);
    const de = ids.has(v.sala) ? nombreSala(v.sala, estado.salas) : "Sin asignar";
    const varias = n.bloques.some(tieneSala);
    return `<li><strong>${esc(nombreCorto(n))}</strong>: ${esc(de)} → ${esc(nombreSala(n.sala, estado.salas))}${varias ? " (cambia de consultorio según el día)" : ""}</li>`;
  }).join("");
  let nota = "";
  if (!r.fijo) nota = `<p>No existe una distribución con consultorio fijo para todos. Algunos profesionales atenderían en consultorios distintos según el día.</p>`;
  if (r.sinLugar.length) nota += `<p><strong>Sin lugar en algún horario:</strong> ${esc(r.sinLugar.join(", "))}. Hay más profesionales que consultorios en esa franja.</p>`;
  const ok = await confirmar("Reasignar consultorios", `${nota}<p>Se ${cambios.length === 1 ? "moverá 1 profesional" : `moverán ${cambios.length} profesionales`}:</p><ul class="cambios">${li}</ul>`, "Aplicar");
  if (!ok) return;
  guardar({ profs: cambios });
  flotante("Consultorios reasignados.");
}
function moverProf(id, sid) {
  const p = estado.profs.find(x => x.id === id); if (!p) return;
  const ids = idsSalas(estado.salas);
  if ((ids.has(p.sala) ? p.sala : "") === sid && !p.bloques.some(tieneSala)) return;
  const n = { ...p, sala: sid, bloques: p.bloques.map(({ sala, ...b }) => b) };
  guardar({ profs: [n] });
  const cs = sid ? conflictosEn(n, sid, estado.profs.filter(x => x.id !== id), ids) : [];
  const sala = estado.salas.find(x => x.id === sid);
  const inc = sala && sala.tipo !== "exclusivo" ? incumpleEdilicio(sala, p.especialidad) : [];
  const extra = inc.length ? ` No reúne requisitos edilicios: ${inc.map(f => detalleFalta(f, sala.ficha)).join("; ")}.` : "";
  flotante((cs.length ? `${nombreCorto(p)} pasó a ${nombreSala(sid, estado.salas)}, pero se superpone con ${nombreCorto(cs[0].q)}.` : `${nombreCorto(p)} pasó a ${nombreSala(sid, estado.salas)}.`) + extra, !!cs.length || !!inc.length);
}

/* ============================================================================
   7) EVENTOS
   ========================================================================== */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-vista]");
  if (tab) { estado.vista = tab.dataset.vista; render(); window.scrollTo(0, 0); return; }
  const barra = e.target.closest(".b.edita");
  if (barra && !e.target.closest("[data-act]")) { abrirProf(barra.dataset.prof); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "imprimir-faltantes") imprimirFaltantes();
  else if (act === "imprimir-listado") imprimirFaltantes(true);
  else if (act === "croquis-pdf") imprimirCroquis();
  else if (act === "croquis-png") descargarCroquisPNG();
  else if (act === "imprimir") { document.body.classList.remove("imp-faltantes"); if (estado.vista !== "cronograma") { estado.vista = "cronograma"; render(); } window.print(); }
  else if (act === "sembrar") guardar({ salas: clonar(SALAS_BASE), profs: clonar(PROFS_BASE) });
  else if (act === "sembrar-vacio") guardar({ salas: clonar(SALAS_BASE) });
  else if (act === "nuevo-prof") abrirProf(null);
  else if (act === "editar-prof") abrirProf(el.dataset.id);
  else if (act === "reasignar") reasignar();
  else if (act === "dlg-cerrar") $("#dlgProf").close();
  else if (act === "fila-nueva") { borr.filas.push(filaVacia()); pintarDlgProf(); }
  else if (act === "fila-quitar") { borr.filas.splice(+el.closest(".hrow").dataset.i, 1); pintarDlgProf(); }
  else if (act === "ver-salas") { borr.verSalas = true; pintarDlgProf(); }
  else if (act === "prof-borrar") {
    const p = estado.profs.find(x => x.id === borr.id);
    if (p && await confirmar("Eliminar profesional", `<p>Se elimina a <strong>${esc(p.nombre)}</strong> y todos sus horarios.</p>`, "Eliminar", true)) { guardar({ borrar: [p.id] }); $("#dlgProf").close(); flotante("Profesional eliminado."); }
  }
  else if (act === "sala-nueva") { const n = CROQUIS_NROS.find(x => !borrSalas.some(s => +s.nro === x)); borrSalas.push({ id: "s" + nuevoId(), ...(n ? { nro: n } : {}), nombre: "Consultorio " + (n || borrSalas.length + 1), tipo: "general", especialidad: "" }); render(); }
  else if (act === "sala-quitar") { borrSalas.splice(+el.closest(".sala-fila").dataset.i, 1); render(); }
  else if (act === "sala-subir" || act === "sala-bajar") { const i = +el.closest(".sala-fila").dataset.i, j = i + (act === "sala-subir" ? -1 : 1); [borrSalas[i], borrSalas[j]] = [borrSalas[j], borrSalas[i]]; render(); }
  else if (act === "salas-guardar") guardarSalas();
  else if (act === "ver-req") { estado.reqSala = el.dataset.sala; estado.vista = "requisitos"; render(); window.scrollTo(0, 0); }
  else if (act === "rq-sala") { estado.reqSala = el.dataset.sala; render(); const c = $("#rq-cons"); if (c && el.closest(".matriz")) c.scrollIntoView(); }
  else if (act === "rq-marcar") marcarReq(el);
  else if (act === "croquis-sel") { const n = +el.dataset.nro; estado.croquisSel = estado.croquisSel === n ? 0 : n; render(); const g = document.getElementById("consultorio-0" + n); if (g) g.focus({ preventScroll: true }); }
  else if (act === "adoptar-croquis") adoptarCroquis();
  else if (act === "rq-agregado-quitar") { const id = el.dataset.item; guardarFicha(el.dataset.sala, f => { f.agregados = (f.agregados || []).filter(k => k !== id); delete f.items[id]; }); }
  else if (act === "rq-extra-quitar") { const id = el.dataset.item; guardarFicha(el.dataset.sala, f => { f.extra = (f.extra || []).filter(x => "x:" + x.clave !== id); }); }
  else if (act === "comp-nuevo") {
    const id = nuevoId();
    guardarCompartidos(L => L.push({ id, nombre: "Nuevo equipamiento", salas: [] }));
    const n = document.getElementById("cp-n-" + id); if (n) { n.focus(); n.select(); }
  }
  else if (act === "comp-quitar") {
    const c = (estado.comp || []).find(x => x.id === el.dataset.id);
    if (c && await confirmar("Quitar equipamiento compartido", `<p>Se quita <strong>${esc(c.nombre)}</strong> de la lista. Los consultorios que lo usaban vuelven a su propia marca.</p>`, "Quitar", true)) guardarCompartidos(L => L.splice(L.findIndex(x => x.id === c.id), 1));
  }
});

document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".b.edita")) { e.preventDefault(); abrirProf(e.target.dataset.prof); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-act=croquis-sel]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "buscar") { estado.filtro = t.value; pintarTablaProfs(); return; }
  const sf = t.closest(".sala-fila");
  if (sf && borrSalas) {
    const s = borrSalas[+sf.dataset.i]; s[t.dataset.campo] = t.value;
    if (t.dataset.campo === "tipo") $("[data-campo=especialidad]", sf).disabled = t.value !== "exclusivo";
    // Con número de croquis, el nombre sigue la numeración salvo que se haya escrito otro.
    if (t.dataset.campo === "nro" && t.value && (!s.nombre.trim() || /^Consultorio \d+$/.test(s.nombre.trim()))) { s.nombre = "Consultorio " + t.value; $("[data-campo=nombre]", sf).value = s.nombre; }
    return;
  }
  if (t.closest("#frmProf") && borr) {
    const fila = t.closest(".hrow");
    if (fila) {
      const f = borr.filas[+fila.dataset.i];
      if (t.dataset.dia !== undefined) f.dias[+t.dataset.dia] = t.checked;
      else if (t.dataset.campo === "conf") f.conf = t.checked;
      else f[t.dataset.campo] = t.value;
    } else if (t.dataset.campo) borr[t.dataset.campo] = t.value;
    if (t.id !== "pSala") refrescarPista(); else { const p = pistaSala(), el = $("#pPista"); el.textContent = p.txt; el.className = "pista-sala" + (p.mal ? " mal" : ""); }
  }
});

/* Lista de control: superficie, lado y planta se guardan al confirmar el campo. */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rq-todos") { estado.reqTodos = t.checked; render(); return; }
  if (t.id === "croquis-esp") { estado.croquisEsp = t.checked; render(); return; }
  const cp = t.dataset && t.dataset.comp;
  if (cp) {
    const id = t.closest("[data-comp-id]").dataset.compId;
    guardarCompartidos(L => {
      const c = L.find(x => x.id === id); if (!c) return;
      if (cp === "cant" && !(/^\d+$/.test(t.value.trim()) && +t.value >= 1)) { flotante("Ingrese una cantidad entera, 1 o más.", true); return; }
      if (cp === "sala") c.salas = t.checked ? [...new Set([...(c.salas || []), t.value])] : (c.salas || []).filter(x => x !== t.value);
      else c[cp] = t.value;
    });
    return;
  }
  const campo = t.dataset && t.dataset.ficha;
  if (!campo) return;
  if (campo === "planta") { guardarFicha(t.dataset.sala, f => { f.planta = t.value; }); return; }
  const txt = t.value.trim().replace(",", ".");
  const v = txt === "" ? null : Number(txt);
  if (v !== null && !(v > 0 && v < 10000)) { flotante("Ingrese un número válido, por ejemplo 9,5.", true); return; }
  guardarFicha(t.dataset.sala, f => { f[campo] = v; });
});

document.addEventListener("submit", e => {
  if (e.target.id === "frmProf") { e.preventDefault(); guardarProf(); return; }
  if (e.target.dataset.form === "rq-extra") {
    e.preventDefault();
    const nombre = $("input", e.target).value.trim(), clave = claveExtra(nombre), sid = e.target.dataset.sala;
    if (!clave) { flotante("Escriba el nombre del equipamiento.", true); return; }
    const s = estado.salas.find(x => x.id === sid);
    const cat = Object.keys(ITEMS_REQ).find(k => !ITEMS_REQ[k][3] && claveExtra(ITEMS_REQ[k][1]) === clave);
    if (cat) {
      const ev = evaluarSala(s, idsSalas(estado.salas));
      if (ev.filas.some(f => f.id === cat)) { flotante(ev.filas.find(f => f.id === cat).adicional ? "Ese equipamiento ya está en la lista del consultorio." : "La norma ya lo exige en este consultorio: figura en la lista.", true); return; }
      guardarFicha(sid, f => { f.agregados = [...(f.agregados || []), cat]; });
      return;
    }
    if (((s && s.ficha && s.ficha.extra) || []).some(x => x.clave === clave)) { flotante("Ese equipamiento ya está en la lista del consultorio.", true); return; }
    guardarFicha(sid, f => { f.extra = [...(f.extra || []), { clave, nombre }]; });
    return;
  }
});

/* Arrastrar un horario a otro consultorio muda al profesional toda la semana. */
let arrastrado = null;
document.addEventListener("dragstart", e => {
  const b = e.target.closest && e.target.closest(".b.edita"); if (!b) return;
  arrastrado = b.dataset.prof;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", arrastrado); } catch (err) { /* algunos navegadores lo restringen */ }
});
document.addEventListener("dragover", e => {
  const p = e.target.closest && e.target.closest(".pista[data-sala]"); if (!p || !arrastrado) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  $$(".pista.sobre-drop").forEach(x => x !== p && x.classList.remove("sobre-drop"));
  p.classList.add("sobre-drop");
});
document.addEventListener("drop", e => {
  const p = e.target.closest && e.target.closest(".pista[data-sala]");
  $$(".pista.sobre-drop").forEach(x => x.classList.remove("sobre-drop"));
  if (!p || !arrastrado) return;
  e.preventDefault();
  const id = arrastrado; arrastrado = null;
  moverProf(id, p.dataset.sala);
});
document.addEventListener("dragend", () => { arrastrado = null; $$(".pista.sobre-drop").forEach(x => x.classList.remove("sobre-drop")); });

/* ============================================================================
   8) INICIO
   ========================================================================== */
(async function iniciar() {
  render();
  // Ingreso único de los Sistemas ISSyS: Google + permiso 'consultorios' en usuarios/{email}.
  const ses = await ISSyS.iniciar({ sistema: SISTEMA, titulo: "Consultorios Comodoro Rivadavia", texto: "Cronograma de atención de los consultorios" });
  estado.usuario = { email: ses.usuario.email, nombre: ses.usuario.nombre };
  estado.rol = ISSyS.rolEn(ses.usuario, SISTEMA) || "lector";
  encabezado = ISSyS.ponerEncabezado(document.getElementById("issys-encabezado"), ses.usuario, {
    sistema: SISTEMA, rol: ISSyS.nombreRol(ses.usuario, SISTEMA)
  });
  almacen = almacenFirebase(ses);
  render();
})();
</script>
